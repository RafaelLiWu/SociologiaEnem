"Cultura e diversidade cultural":["Cultura é o conjunto de valores, normas, crenças, saberes, linguagens e práticas compartilhadas por um grupo social — não se confunde com erudição nem com escolaridade. Toda sociedade humana tem cultura, e nenhuma é superior a outra: as diferenças resultam de processos históricos e sociais distintos. Dentro de uma mesma sociedade coexistem culturas diversas (subculturas, contraculturas, culturas regionais).",["Cultura: conjunto de valores, normas e práticas de um grupo","Não existe cultura superior ou inferior","Toda sociedade humana produz cultura","Subcultura: variação dentro de um mesmo grupo social"],"No ENEM, cultura nunca é sinônimo de erudição ou de escolaridade. Desconfie de alternativas que hierarquizam culturas ou que reduzem cultura a manifestações artísticas.","Em uma pesquisa escolar sobre manifestações culturais brasileiras, uma estudante apresentou ao professor o seguinte quadro comparativo, construído com dados hipotéticos para fins didáticos, relacionando três práticas culturais distintas: o frevo pernambucano, o funk carioca e a ópera europeia clássica.","Considerando a definição sociológica de cultura, qual afirmação é correta sobre as três manifestações apresentadas?",["A ópera é expressão de cultura superior, pois exige maior formação técnica e erudição.","O frevo e o funk são folclore, enquanto a ópera é cultura verdadeira, por ter origem europeia.","As três manifestações são produções culturais legítimas de grupos sociais distintos, sem hierarquia entre elas.","Apenas as manifestações transmitidas pela escola podem ser consideradas cultura.","Somente o funk, por ser contemporâneo, expressa cultura viva, ao contrário das outras duas."],2,"Na Sociologia, cultura é todo conjunto de práticas, valores e significados de um grupo, sem hierarquia entre manifestações. A alternativa A confunde cultura com erudição; a B aplica etnocentrismo ao tratar a ópera como superior; a D reduz cultura à cultura escolar; a E inverte o erro da A, hierarquizando no outro sentido."],
"Etnocentrismo e relativismo cultural":["Etnocentrismo é julgar a cultura do outro pelos próprios valores, tomando-a como inferior ou desviante. O relativismo cultural, formulado por Franz Boas e desenvolvido por antropólogos como Clifford Geertz, propõe compreender cada cultura em seus próprios termos, sem hierarquizá-la. O relativismo não é indiferença ética nem defesa de práticas violadoras de direitos humanos: é um método de análise.",["Etnocentrismo: julgar o outro pela própria cultura","Relativismo cultural: compreender cada cultura em seus termos","Relativismo é método, não indiferença moral","Boas e Geertz: crítica ao evolucionismo cultural"],"Não confunda relativismo cultural (método) com relativismo moral (aceitar tudo). Palavras-chave de etnocentrismo: 'bárbaro', 'atrasado', 'exótico', 'primitivo'.","Em um relatório de viagem do século XVI, um navegador europeu descreveu os povos indígenas do litoral brasileiro como 'selvagens sem lei, religião ou costumes', sugerindo que deveriam ser convertidos à fé cristã e aos costumes europeus.","Do ponto de vista da Sociologia e da Antropologia contemporâneas, essa descrição ilustra:",["uma análise relativista, pois registra os costumes do ponto de vista nativo.","uma prática etnocêntrica, ao avaliar a cultura indígena pelos padrões europeus e considerá-la inferior.","uma postura neutra, típica dos primeiros cronistas, livres de juízo de valor.","uma descrição científica dos povos originários, seguindo os métodos da antropologia moderna.","uma defesa do multiculturalismo, por registrar a diferença entre os povos."],1,"Tomar a própria cultura como régua e classificar a outra como inferior é a definição clássica de etnocentrismo. A alternativa A confunde etnocentrismo com relativismo; a C afirma neutralidade onde há juízo; a D aplica categorias modernas a um texto pré-científico; a E confunde o registro da diferença com defesa dela."],
"Indústria cultural e cultura de massa":["Indústria cultural é o conceito formulado por Theodor Adorno e Max Horkheimer, na Escola de Frankfurt, para descrever a produção industrial de bens culturais padronizados, voltados ao consumo de massa. Ela transforma cultura em mercadoria, homogeneíza gostos e enfraquece a capacidade crítica. Cultura de massa não é sinônimo de cultura popular: esta nasce das classes populares; aquela é produzida para o consumo amplo.",["Indústria cultural: Adorno e Horkheimer (Escola de Frankfurt)","Cultura de massa ≠ cultura popular","Cultura como mercadoria padronizada","Semelhança com o fetichismo da mercadoria de Marx"],"Não confunda indústria cultural com cultura popular nem com erudição. Palavra-chave: padronização. A crítica de Adorno não é ao povo, mas à forma industrial de produzir cultura.","Ao analisar séries televisivas, trilhas sonoras e aplicativos de streaming, pesquisadores da comunicação observam que produções muito distintas tendem a repetir as mesmas fórmulas de sucesso: mesmos roteiros, mesmos enredos e mesmos produtos derivados, moldados para agradar ao maior público possível.","Esse processo é analisado pela Escola de Frankfurt como:",["cultura popular genuína, pois expressa a voz do povo.","indústria cultural, que padroniza bens culturais transformando-os em mercadoria de massa.","democratização cultural, pela oferta ampla de conteúdo a todos.","folclorização, pela recuperação de tradições populares.","contracultura, pela resistência ao mercado."],1,"Adorno e Horkheimer descrevem exatamente esse processo de padronização voltado ao consumo de massa como indústria cultural. A alternativa A mistura com cultura popular; a C é a leitura otimista criticada pela Escola; a D aplica outro conceito; a E confunde com movimento de resistência."],
"Identidade e multiculturalismo":["Identidade é a construção social da noção que um indivíduo ou grupo tem de si, formada na relação com os outros e marcada por pertencimentos (nacionalidade, gênero, raça, religião, território). Multiculturalismo é o reconhecimento da coexistência de culturas distintas na mesma sociedade, defendendo políticas de reconhecimento e de convivência. Autores como Charles Taylor e Stuart Hall discutem identidade como processo, não essência.",["Identidade: construção social e relacional","Multiculturalismo: reconhecimento da diferença","Hall: identidade como processo, não essência","Taylor: políticas de reconhecimento"],"Cuidado: identidade não é essência fixa nem destino biológico. Multiculturalismo ≠ assimilação. Palavra-chave do assimilacionismo: 'todos devem se tornar iguais'.","Uma escola pública recebeu estudantes migrantes de diferentes regiões brasileiras e de países vizinhos. Um professor propôs que cada aluno apresentasse um elemento de sua cultura de origem, e que a escola passasse a valorizar essas contribuições no currículo e nas festas escolares.","Essa proposta dialoga mais diretamente com:",["a assimilação cultural, em que migrantes devem adotar a cultura local.","o etnocentrismo, ao destacar apenas a cultura de origem dos migrantes.","o multiculturalismo, que reconhece e valoriza a coexistência de culturas na mesma sociedade.","o evolucionismo cultural, ao classificar as culturas por grau de desenvolvimento.","a indústria cultural, ao padronizar as apresentações escolares."],2,"Valorizar a coexistência e o reconhecimento mútuo de culturas distintas é a base do multiculturalismo. A alternativa A descreve o oposto; a B aplica o conceito de etnocentrismo ao que é justamente uma tentativa de evitá-lo; a D retoma uma hierarquização evolucionista; a E mistura outro conceito."],
"Cultura popular e manifestações brasileiras":["Cultura popular é o conjunto de práticas, saberes, festas e expressões criadas e transmitidas pelas classes populares, distinta da cultura erudita e da indústria cultural. No Brasil, manifestações como frevo, maracatu, samba de roda, festa junina, capoeira e cordel são exemplos de cultura popular viva, reconhecida como patrimônio cultural imaterial.",["Cultura popular: criada e transmitida pelas classes populares","≠ cultura erudita e ≠ indústria cultural","Patrimônio imaterial: IPHAN reconhece manifestações","Exemplos: frevo, maracatu, samba de roda, capoeira"],"Cultura popular não é 'folclore' no sentido pejorativo. O ENEM valoriza o reconhecimento dessas manifestações como patrimônio legítimo.","O Instituto do Patrimônio Histórico e Artístico Nacional (IPHAN) reconheceu o frevo, o maracatu e a capoeira como patrimônio cultural imaterial do Brasil.","Esse reconhecimento significa que:",["essas manifestações são consideradas inferiores à cultura erudita.","são expressões culturais legítimas das classes populares, valorizadas como patrimônio nacional.","o IPHAN transformou essas práticas em espetáculo para turistas.","a cultura popular não tem relação com a identidade brasileira.","essas manifestações devem ser substituídas pela cultura erudita."],1,"O reconhecimento como patrimônio imaterial valida a legitimidade da cultura popular. As demais alternativas hierarquizam culturas ou desvirtuam o significado do título."],
"Patrimônio material e imaterial":["Patrimônio cultural é o conjunto de bens, práticas e expressões que uma sociedade reconhece como parte de sua identidade e memória. Patrimônio material inclui edifícios, monumentos, obras de arte e objetos; patrimônio imaterial inclui saberes, festas, rituais, músicas e modos de fazer. A Constituição de 1988 reconhece ambos como protegidos pelo Estado.",["Material: edifícios, monumentos, objetos","Imaterial: saberes, festas, rituais, músicas","Constituição de 1988: proteção do patrimônio","IPHAN: órgão de preservação"],"Não reduza patrimônio a 'prédios históricos'. A dimensão imaterial (saberes, festas) é igualmente importante. Palavras-chave: memória, identidade, preservação.","O modo de fazer o queijo Minas artesanal e o samba de roda do Recôncavo Baiano foram reconhecidos como patrimônio cultural imaterial brasileiro.","Esses casos ilustram que o patrimônio imaterial:",["refere-se apenas a objetos guardados em museus.","compreende saberes e práticas culturais transmitidos entre gerações.","não tem relação com a identidade de um povo.","é menos importante que o patrimônio material.","só existe em países europeus."],1,"Patrimônio imaterial abrange saberes e práticas transmitidos culturalmente. As demais alternativas restringem o conceito a objetos ou desvalorizam essa dimensão."],
"Determinismo cultural e estruturalismo":["Determinismo cultural é a ideia de que a cultura de um grupo determina inteiramente o comportamento dos indivíduos, sem espaço para agência ou escolha. O estruturalismo, corrente associada a Claude Lévi-Strauss, busca identificar estruturas profundas que organizam a cultura e a sociedade. Críticos apontam que ambas as abordagens podem negligenciar a capacidade dos sujeitos de transformar suas condições.",["Determinismo cultural: cultura determina o comportamento","Estruturalismo: estruturas profundas organizam a cultura","Lévi-Strauss: estruturas elementares do parentesco","Crítica: risco de negar a agência individual"],"Não confunda determinismo cultural com relativismo cultural. O primeiro afirma que a cultura determina tudo; o segundo propõe compreender cada cultura em seus termos. Palavra-chave: agência.","Pesquisadores discutem se a cultura de um grupo determina completamente o comportamento de seus membros ou se os indivíduos mantêm capacidade de agir e transformar suas condições.","A principal crítica ao determinismo cultural é que ele:",["reconhece a agência individual e a transformação social.","pode negligenciar a capacidade dos sujeitos de agir e transformar suas condições.","é idêntico ao relativismo cultural.","defende a superioridade de algumas culturas.","nega a existência de estruturas sociais."],1,"O determinismo cultural tende a negar a agência individual. As demais alternativas confundem o conceito com outras correntes ou negam a crítica."],
"Indústria cultural e mídia":["A indústria cultural, analisada por Adorno e Horkheimer, se articula com os meios de comunicação de massa (rádio, TV, internet) para difundir bens culturais padronizados. A mídia não apenas informa, mas também forma opiniões e consolida valores, podendo reforçar estereótipos e desigualdades. O ENEM cobra a análise crítica do papel da mídia na sociedade contemporânea.",["Mídia: formação de opinião e valores","Adorno e Horkheimer: indústria cultural","Estereótipos e desigualdades na mídia","Comunicação de massa"],"Não trate a mídia como neutra: ela reflete e reproduz relações de poder. Palavras-chave: formação de opinião, estereótipos, comunicação de massa.","Pesquisadores observam que a mídia, muitas vezes, divulga características de diferentes culturas carregando estereótipos ou fazendo juízos de valor sobre modos de vida, costumes e crenças[citation:6].","A análise sociológica da mídia deve considerar que:",["a mídia é sempre neutra e objetiva.","a mídia pode reforçar estereótipos e desigualdades, ao divulgar culturas de forma parcial ou preconceituosa.","a mídia não tem relação com a formação de opinião.","a mídia apenas informa, sem influenciar valores.","a mídia elimina todos os preconceitos."],1,"A mídia pode reforçar estereótipos e desigualdades. As demais alternativas idealizam ou negam o papel da mídia na formação de valores."],
"Modos de produção":["Marx descreve a história das sociedades a partir dos modos de produção: formas historicamente determinadas de organizar as forças produtivas (meios de produção + trabalho) e as relações de produção (quem possui o quê). Cada modo de produção corresponde a uma forma de sociedade: primitivo, escravista, feudal, capitalista. A passagem de um a outro se dá por contradições internas, especialmente a luta de classes.",["Modo de produção: forças produtivas + relações de produção","Sequência em Marx: primitivo, escravista, feudal, capitalista","Motor da história: luta de classes","Base econômica condiciona a superestrutura"],"Marx não é determinista mecanicista: a superestrutura (direito, política, cultura) reage sobre a base econômica. Desconfie de questões que tratam o modo de produção como algo isolado da sociedade.","Em uma aula de Sociologia, o professor apresentou um quadro comparativo com quatro modos de produção históricos: primitivo, escravista, feudal e capitalista. Em cada um, indicou como se dá o acesso aos meios de produção (terra, ferramentas, máquinas) e como se organiza o trabalho.","Segundo a análise de Karl Marx, o que distingue um modo de produção de outro é, fundamentalmente:",["a religião predominante em cada época.","o nível tecnológico alcançado, medido pela quantidade de invenções.","a forma historicamente determinada de organizar as forças produtivas e as relações de produção.","o grau de escolaridade da população.","o tamanho territorial de cada sociedade."],2,"Para Marx, o que define um modo de produção é o conjunto das forças produtivas (meios e trabalho) e das relações de produção (propriedade). A alternativa A pertence à superestrutura; B isola a técnica; D e E não são critérios do materialismo histórico."],
"Mais-valia e alienação em Marx":["Mais-valia é o valor produzido pelo trabalhador que excede o valor de sua força de trabalho (o salário) e é apropriado pelo capitalista — é a fonte do lucro no capitalismo. Ela pode ser absoluta (aumento da jornada) ou relativa (aumento da produtividade). Alienação é o processo pelo qual o trabalhador se torna estranho ao produto, ao processo e a si mesmo, por não dominar o que produz.",["Mais-valia = valor produzido − salário","Mais-valia absoluta: aumenta a jornada","Mais-valia relativa: aumenta a produtividade","Alienação: estranhamento do trabalho e do produto"],"Marx não é o 'pai da Sociologia' (esse título costuma ser atribuído a Comte, com a Sociologia como ciência, ou a Durkheim como fundador institucional). Confira quem diz o quê.","Em uma fábrica, um trabalhador produz, em uma jornada de 8 horas, mercadorias cujo valor corresponde a 200 reais. Seu salário diário é de 80 reais. O valor restante é apropriado pelo dono da fábrica.","De acordo com a teoria marxista, a diferença de 120 reais corresponde a:",["mais-valia, valor produzido pelo trabalhador e apropriado pelo capitalista.","salário indireto, valor redistribuído pelo Estado ao trabalhador.","lucro natural, retribuição justa pelo risco do empresário.","mais-trabalho não remunerado destinado a impostos.","imposto sobre a produção, revertido em serviços públicos."],0,"Para Marx, a mais-valia é exatamente essa diferença entre o valor produzido e o valor da força de trabalho (salário), apropriada pelo capitalista. A alternativa B descreve outra categoria; a C naturaliza a apropriação; a D e a E confundem com tributos, que não são a categoria em questão."],
"Fordismo e toyotismo":["Fordismo (início do século XX) é o modelo de produção em massa caracterizado pela linha de montagem, pela padronização dos produtos, pela divisão rígida de tarefas e pela produção em série, com trabalhadores especializados em movimentos repetitivos. Toyotismo (a partir dos anos 1970) é o modelo japonês de produção flexível: produção sob demanda ('just in time'), trabalhadores polivalentes, controle de qualidade integrado e menor estoque.",["Fordismo: linha de montagem, produção em massa, padronização","Toyotismo: produção flexível, just in time, trabalhador polivalente","Ford: esteira e altos salários como estratégia","Toyota: estoque mínimo e qualidade total"],"Compare os dois modelos pelas palavras-chave: Ford — massa, esteira, padronização; Toyota — flexível, sob demanda, polivalente. Não confunda toyotismo com precarização; ela vem depois, com a reestruturação produtiva.","Ao longo do século XX, a indústria automobilística passou por mudanças profundas. Em 1913, a Ford implantou a linha de montagem em série. A partir dos anos 1970, a Toyota passou a produzir conforme a demanda, com estoques reduzidos e trabalhadores que operavam várias máquinas.","A passagem do fordismo ao toyotismo é caracterizada por:",["manutenção da produção em massa com aumento da rigidez das tarefas.","substituição da linha de montagem por artesanato qualificado.","passagem da produção em massa padronizada para a produção flexível, sob demanda e com trabalhadores polivalentes.","redução da automação industrial e retorno ao trabalho manual.","eliminação da divisão do trabalho e do controle sobre o trabalhador."],2,"O toyotismo (ou acumulação flexível) substitui o padrão rígido fordista por produção sob demanda, trabalhadores polivalentes e estoques mínimos. A alternativa A mantém o fordismo; a B retoma o artesanato; a D vai contra a automação; a E é falsa — a divisão e o controle continuam, apenas reorganizados."],
"Uberização e precarização do trabalho":["Uberização designa a difusão de formas de trabalho mediadas por plataformas digitais, sem vínculo formal, com pagamento por tarefa, ausência de garantias trabalhistas e transferência de custos (veículo, internet, combustível) ao trabalhador. Precarização é o processo mais amplo de perda de direitos, estabilidade e proteção social. Autores contemporâneos, como Ricardo Antunes, discutem como essas formas ampliam a exploração e diluem a fronteira entre trabalho e vida.",["Uberização: trabalho por plataforma, sem vínculo","Precarização: perda de direitos e proteção social","Pagamento por tarefa e transferência de custos","Antunes: novas formas de exploração do trabalho"],"A palavra 'uberização' é derivada de 'Uber' (nome de empresa), mas o conceito vai além da empresa. Palavras-chave: algoritmo, sem vínculo, por tarefa, autônomo, custos transferidos.","Um estudo hipotético sobre entregadores por aplicativo revelou que 78% trabalham mais de 10 horas por dia, sem vínculo empregatício, sem férias remuneradas e arcando com combustível, manutenção e celular, custos que reduzem o rendimento diário.","A situação descrita exemplifica, sociologicamente:",["o empreendedorismo autônomo clássico, com plena liberdade e proteção legal.","a uberização do trabalho, marcada pela ausência de vínculo, pagamento por tarefa e transferência de custos ao trabalhador.","o fordismo, com linha de montagem e trabalhadores especializados.","o toyotismo, com garantia de emprego vitalício e salário fixo.","a ampliação de direitos trabalhistas pela via digital."],1,"Ausência de vínculo, pagamento por tarefa e transferência de custos são justamente o que caracteriza a uberização e a precarização. A alternativa A idealiza a situação; a C e a D descrevem modelos industriais distintos; a E inverte o processo, que amplia a precarização, não os direitos."],
"Trabalho e tecnologia":["O trabalho na era da tecnologia e da globalização é marcado pela automação, robotização e digitalização. A Terceira Revolução Industrial (Revolução Informacional) transformou o mundo do trabalho, criando novas profissões e extinguindo outras, exigindo qualificação constante e ampliando a precarização. Autores como Ricardo Antunes analisam o impacto da tecnologia sobre o trabalho e a classe trabalhadora[citation:5].",["Automação e robotização","Terceira Revolução Industrial (Revolução Informacional)","Impacto sobre empregabilidade e qualificação","Precarização e novas formas de trabalho"],"Diferencie automação (substituição de trabalho humano por máquinas) de digitalização (uso de tecnologias digitais). Palavras-chave: empregabilidade, qualificação, plataformas.","Um estudo sobre o impacto da automação no mercado de trabalho mostra que áreas de produção repetitiva perdem postos rapidamente, enquanto crescem demandas por trabalhadores qualificados em tecnologia e serviços[citation:5].","A análise sociológica do trabalho na era da tecnologia deve considerar que:",["a automação não afeta o emprego.","a automação e a digitalização transformam o mundo do trabalho, criando e extinguindo profissões e exigindo qualificação constante.","a tecnologia só beneficia os trabalhadores.","a globalização não tem relação com o trabalho.","as plataformas digitais garantem estabilidade no emprego."],1,"A automação transforma o trabalho, criando e extinguindo profissões. As demais alternativas negam ou simplificam o impacto da tecnologia sobre o emprego."],
"Classes, estamentos e castas":["São formas de estratificação social historicamente distintas. Castas: grupos fechados, hereditários, sem mobilidade, com base religiosa (ex.: Índia tradicional). Estamentos: grupos definidos por honra, privilégios jurídicos e nascimento (ex.: nobreza, clero, povo no Antigo Regime). Classes: grupos definidos pela posição no sistema produtivo, com mobilidade possível (ex.: capitalistas e trabalhadores no capitalismo).",["Castas: fechadas, hereditárias, sem mobilidade","Estamentos: definidos por honra e privilégio jurídico","Classes: definidas pela posição produtiva","Marx e Weber: definições distintas de classe"],"Não confunda classe com estamento nem casta. Palavras-chave: casta = fechada; estamento = honra/privilégio; classe = econômica, com mobilidade.","Em um estudo comparado sobre formas de desigualdade, foram apresentados três casos: (1) a sociedade indiana tradicional, com grupos definidos pelo nascimento e sem casamento entre grupos; (2) a França do Antigo Regime, com nobreza, clero e terceiro estado separados por privilégios; (3) o capitalismo industrial, com trabalhadores assalariados e proprietários dos meios de produção.","Esses três casos correspondem, respectivamente, a:",["classes, castas e estamentos.","castas, estamentos e classes.","estamentos, classes e castas.","castas, classes e estamentos.","classes, estamentos e castas."],1,"A Índia tradicional exemplifica castas; o Antigo Regime, os estamentos; o capitalismo, as classes sociais. As demais alternativas embaralham essas definições. Não confunda, por exemplo, estamento (honra/privilégio) com casta (fechamento por nascimento com base religiosa)."],
"Mobilidade social":["Mobilidade social é o deslocamento de indivíduos ou grupos entre posições na estrutura social. Pode ser vertical (ascendente ou descendente) ou horizontal (mudança de posição sem alterar o estrato); intrageracional (dentro da mesma geração) ou intergeracional (comparando gerações). Sociedades mais abertas têm maior mobilidade; sociedades de castas, praticamente nenhuma.",["Vertical: sobe ou desce na hierarquia social","Horizontal: muda de posição sem mudar de estrato","Intergeracional: compara pais e filhos","Intrageracional: dentro de uma mesma trajetória"],"Não basta a pessoa melhorar de renda: mobilidade de classe exige mudança de posição estrutural, não só de salário. Palavras-chave: intergeracional, ascendente, descendente.","Uma pesquisa hipotética comparou três gerações de uma mesma família. O avô, operário sem instrução; o pai, técnico com ensino médio; a filha, médica formada em universidade pública. Ao mesmo tempo, um executivo, após perder o emprego, passou a trabalhar como motorista de aplicativo.","Os dois casos exemplificam, respectivamente:",["mobilidade horizontal e mobilidade intrageracional.","mobilidade vertical ascendente intergeracional e mobilidade vertical descendente intrageracional.","mobilidade descendente e mobilidade horizontal.","mobilidade intergeracional e mobilidade horizontal.","imobilidade social nos dois casos."],1,"A família mostra ascensão entre gerações (avô, pai, filha) — mobilidade vertical ascendente intergeracional. O executivo desce de posição dentro da própria vida — vertical descendente intrageracional. As demais alternativas trocam os tipos."],
"Pobreza e concentração de renda":["Pobreza é a privação de recursos e oportunidades necessários a uma vida digna; pode ser medida em termos absolutos (renda mínima para sobrevivência) ou relativos (comparação com o padrão da sociedade). Concentração de renda é a desigualdade na distribuição do total produzido. O Brasil é historicamente um dos países mais desiguais do mundo, segundo dados do IBGE e de relatórios internacionais como os do World Inequality Lab.",["Pobreza absoluta: renda mínima de sobrevivência","Pobreza relativa: comparação com o padrão social","Concentração de renda: desigualdade na distribuição","Brasil: alta desigualdade histórica"],"Pobreza ≠ desigualdade. Um país pode ter pouca pobreza absoluta e muita concentração de renda. Confira se a questão pergunta sobre pobreza ou sobre desigualdade.","Segundo dados hipotéticos, em um país, 1% mais rico da população concentra 28% da renda total, enquanto os 50% mais pobres ficam com apenas 10%. Ainda assim, a pobreza absoluta caiu nos últimos anos.","A situação descrita indica que:",["houve eliminação da pobreza absoluta e da desigualdade.","a desigualdade de renda permanece elevada, mesmo com a queda da pobreza absoluta, que são fenômenos distintos.","a concentração de renda não tem relação com a distribuição.","o país se tornou igualitário porque a pobreza caiu.","a desigualdade só existe quando há pobreza absoluta."],1,"Pobreza e desigualdade são fenômenos distintos: pode-se reduzir a primeira sem alterar a segunda. A alternativa A confunde os dois; a C nega a relação; a D conclui indevidamente; a E reduz indevidamente desigualdade a pobreza."],
"Estratificação social":["Estratificação social é a divisão da sociedade em camadas ou estratos hierarquizados, com base em critérios como renda, poder, prestígio, educação ou origem. As formas históricas de estratificação incluem castas, estamentos e classes. A estratificação gera desigualdades de acesso a recursos e oportunidades, e sua análise é central para compreender a estrutura social[citation:20].",["Estratificação: divisão em camadas hierarquizadas","Critérios: renda, poder, prestígio, educação, origem","Formas históricas: castas, estamentos, classes","Gera desigualdades de acesso"],"Diferencie estratificação (estrutura) de desigualdade (consequência). Palavras-chave: camadas, hierarquia, acesso.","Pesquisadores analisam como a sociedade se divide em camadas ou classes sociais e os impactos socioeconômicos dessas divisões, incluindo desigualdades de acesso à educação, saúde e justiça[citation:20].","A análise sociológica da estratificação social destaca que:",["a sociedade é homogênea e sem hierarquias.","a estratificação divide a sociedade em camadas hierarquizadas, gerando desigualdades de acesso a recursos e oportunidades.","a estratificação não tem relação com desigualdade.","todas as sociedades têm a mesma estrutura de classes.","a estratificação é um fenômeno exclusivamente econômico."],1,"A estratificação hierarquiza a sociedade e gera desigualdades. As demais alternativas negam a hierarquia ou reduzem a estratificação a uma única dimensão."],
"Estado e formas de governo":["Estado é a instituição que detém o monopólio legítimo da força em um território (definição clássica de Max Weber). Formas de governo dizem respeito a como o poder é exercido: monarquia (chefe de Estado hereditário) ou república (chefe eleito); presidencialismo, parlamentarismo ou semipresidencialismo. Formas de Estado referem-se à organização territorial: unitário ou federado.",["Weber: Estado detém o monopólio legítimo da força","Monarquia x República: origem do chefe de Estado","Presidencialismo x Parlamentarismo","Estado unitário x Estado federado"],"Não confunda forma de governo (monarquia, república) com forma de Estado (unitário, federal) nem com sistema de governo (presidencialismo, parlamentarismo). O Brasil é república federativa presidencialista.","O Brasil é uma república federativa presidencialista. Isso significa que: (1) o chefe de Estado e de governo é eleito pelo voto; (2) os estados-membros têm autonomia; (3) o Presidente exerce o Poder Executivo. Em outros países, como o Reino Unido, há monarquia com sistema parlamentarista.","Considerando as classificações de formas de Estado e de governo, é correto afirmar que o Brasil é:",["uma monarquia parlamentarista unitária.","uma república presidencialista federativa.","uma república parlamentarista unitária.","uma monarquia presidencialista federativa.","uma república semipresidencialista unitária."],1,"O Brasil é república (chefe eleito) → não é monarquia; presidencialista (Presidente chefe de Estado e de governo); federativa (estados-membros autônomos). As outras alternativas combinam mal os critérios."],
"Contratualistas (Hobbes, Locke e Rousseau)":["Os contratualistas explicam a origem do Estado por um pacto entre indivíduos. Hobbes (Leviatã): no estado de natureza, 'o homem é o lobo do homem', e o pacto cede poder absoluto ao soberano em troca de segurança. Locke (Dois Tratados): o estado de natureza é pacífico, e o pacto visa proteger a propriedade e a liberdade, justificando o direito de resistência. Rousseau (Do Contrato Social): o pacto funda a vontade geral e a soberania popular.",["Hobbes: estado de natureza violento, soberano forte","Locke: estado de natureza pacífico, proteção da propriedade","Rousseau: vontade geral, soberania popular","Contratualismo: origem do Estado por pacto"],"Não confunda Hobbes com Locke: para Hobbes, o pacto é para sair do medo; para Locke, para proteger direitos já existentes. Rousseau é o mais próximo da ideia de soberania popular.","Três autores contratualistas são frequentemente estudados nas aulas de Sociologia e Filosofia Política: Thomas Hobbes, John Locke e Jean-Jacques Rousseau. Cada um parte de uma hipótese distinta sobre o estado de natureza e chega a uma concepção diferente de soberania.","A ideia de que o poder deve se fundar na vontade geral do povo, expressa por meio de um pacto legítimo, é característica do pensamento de:",["Thomas Hobbes, no Leviatã, que defende o poder absoluto do soberano.","John Locke, nos Dois Tratados, que enfatiza a propriedade e o direito de resistência.","Jean-Jacques Rousseau, no Contrato Social, que formula a vontade geral e a soberania popular.","Maquiavel, em O Príncipe, que descreve o realismo político.","Max Weber, que definiu os tipos de dominação legítima."],2,"A vontade geral e a soberania popular são conceitos centrais de Rousseau. A alternativa A atribui a Hobbes algo oposto; a B a Locke, cuja ênfase é a propriedade; a D e a E misturam outros autores."],
"Cidadania e direitos em Marshall":["O sociólogo britânico T. H. Marshall descreve a cidadania como composta por três dimensões históricas: direitos civis (liberdade, propriedade, justiça — séculos XVII e XVIII), direitos políticos (votar e ser votado — século XIX) e direitos sociais (educação, saúde, trabalho, previdência — século XX). A conquista é gradual e resultado de lutas sociais.",["Civis: liberdade e justiça (séc. XVII-XVIII)","Políticos: voto e participação (séc. XIX)","Sociais: educação, saúde, trabalho (séc. XX)","Cidadania = conquista histórica"],"Cuidado: cidadania formal (prevista em lei) não é sinônimo de cidadania real (efetivamente exercida). O ENEM cobra essa distinção.","T. H. Marshall descreveu a cidadania como um processo histórico. Em uma linha do tempo, temos: no século XVIII, garantias de liberdade individual e acesso à justiça; no XIX, o direito de votar e ser votado; no XX, o direito à educação, à saúde e à previdência social.","Segundo a tipologia de Marshall, essas três conquistas correspondem, respectivamente, a direitos:",["políticos, sociais e civis.","sociais, políticos e civis.","civis, políticos e sociais.","civis, sociais e políticos.","políticos, civis e sociais."],2,"A sequência histórica de Marshall é: civis (liberdades individuais), políticos (voto) e sociais (educação, saúde, previdência). As outras alternativas trocam a ordem."],
"Sociologia Política":["A Sociologia Política estuda as relações de poder, o Estado, os regimes políticos, a democracia, a cidadania e os movimentos sociais. Autores como Weber, Bobbio e Florestan Fernandes contribuem para a análise do poder e das instituições políticas. Temas centrais: patrimonialismo, clientelismo, cultura política e participação.",["Poder e dominação (Weber)","Democracia e cidadania","Patrimonialismo e clientelismo","Cultura política"],"Diferencie poder (capacidade de influenciar) de dominação (poder legítimo). Weber define três tipos de dominação. Palavras-chave: patrimonialismo, clientelismo.","Em um país, o poder político é exercido por meio de eleições regulares, mas grupos econômicos influenciam decisões parlamentares por meio de lobbies e financiamento de campanhas.","A situação descrita evidencia que:",["a democracia formal garante igualdade real de poder.","há tensão entre a democracia representativa e a influência de grupos econômicos, o que exige análise crítica.","o poder é exclusivamente econômico.","não há relação entre economia e política.","a democracia é um sistema perfeito."],1,"A influência de grupos econômicos mostra limites da democracia formal. As outras alternativas idealizam ou reduzem a complexidade."],
"Três Poderes e organização do Estado brasileiro":["O Estado brasileiro organiza-se em três Poderes independentes e harmônicos: Executivo (administra e executa políticas públicas), Legislativo (elabora leis e fiscaliza) e Judiciário (julga e garante a Constituição). Essa divisão foi formulada por Montesquieu e está prevista no art. 2º da Constituição de 1988.",["Executivo: administra e executa","Legislativo: legisla e fiscaliza","Judiciário: julga e garante a Constituição","Montesquieu: separação dos poderes"],"Não confunda as funções: Executivo não 'faz leis' (salvo medidas provisórias); Legislativo não 'julga'; Judiciário não 'administra'.","Um prefeito sanciona uma lei aprovada pela Câmara Municipal. Um juiz determina que a lei seja cumprida em um caso concreto. Um vereador fiscaliza os gastos da prefeitura.","As três ações correspondem, respectivamente, a funções dos Poderes:",["Executivo, Judiciário e Legislativo.","Legislativo, Executivo e Judiciário.","Judiciário, Legislativo e Executivo.","Executivo, Legislativo e Judiciário.","Legislativo, Judiciário e Executivo."],0,"Sancionar lei é ato do Executivo; julgar é do Judiciário; fiscalizar gastos é do Legislativo. As demais alternativas trocam as funções."],
"Democracia: conceitos e desafios":["Democracia é o regime em que o poder emana do povo, exercido direta ou indiretamente. Democracia direta: participação direta nas decisões (plebiscito, referendo). Democracia representativa: eleição de representantes. Desafios contemporâneos incluem desigualdade de acesso, desinformação, influência econômica e crise de representatividade.",["Direta: plebiscito, referendo, iniciativa popular","Representativa: eleição de representantes","Desafios: desinformação, desigualdade, crise de representação","Democracia formal ≠ democracia real"],"Democracia não é apenas votar: envolve participação, controle social e efetivação de direitos. Palavra-chave: representatividade.","Em um país, as eleições ocorrem regularmente e o voto é universal. No entanto, pesquisas mostram que grupos econômicos influenciam decisões parlamentares e que parcelas da população desconhecem seus direitos.","A situação indica que:",["a democracia formal está plenamente realizada.","há desafios para a efetivação da democracia real, que exige participação e igualdade de influência.","a democracia não tem relação com a participação.","o voto é suficiente para garantir a democracia.","não há problemas na democracia contemporânea."],1,"A democracia real exige mais que eleições: participação efetiva, controle social e igualdade. As demais alternativas reduzem a democracia ao voto ou negam seus desafios."],
"Movimento operário e sindicatos":["O movimento operário surge com a industrialização, no século XIX, em resposta às péssimas condições de trabalho. Organiza-se em sindicatos, partidos e associações, conquistando direitos como jornada de 8 horas, descanso semanal, férias e proibição do trabalho infantil. No Brasil, as primeiras organizações operárias aparecem no fim do século XIX e ganham força com a industrialização do século XX.",["Sindicatos: defesa coletiva dos trabalhadores","Conquistas: jornada, férias, descanso, segurança","Lutas grevistas e negociação coletiva","No Brasil: fim do séc. XIX e industrialização do XX"],"Movimento operário tem caráter coletivo, não individual. Greve é uma das formas de ação; não confunda com ações isoladas nem com filantropia patronal.","Em um livro sobre a história do trabalho, o autor descreve a criação dos primeiros sindicatos na Inglaterra, no século XIX, e suas lutas pela redução da jornada de trabalho para 8 horas, pelo descanso semanal e pela proibição do trabalho infantil nas fábricas.","Essas organizações e conquistas são expressão:",["do movimento operário, que se organizou coletivamente para defender direitos dos trabalhadores.","de ações isoladas de empregadores benevolentes.","de políticas públicas propostas exclusivamente pelo Estado.","de partidos únicos, sem base social.","de associações patronais em defesa das empresas."],0,"Os sindicatos e as greves operárias do século XIX são a expressão clássica do movimento operário, organização coletiva dos trabalhadores. As outras alternativas atribuem as conquistas a outros atores, negando o protagonismo dos trabalhadores."],
"Movimento feminista":["O movimento feminista luta pela igualdade de direitos entre mulheres e homens e pela superação do patriarcado. Costuma-se dividir em ondas: a primeira (séc. XIX e início do XX), pelo direito ao voto e à educação; a segunda (anos 1960-70), pela igualdade no trabalho, sexualidade e crítica ao patriarcado; a terceira e a quarta, pelo reconhecimento da diversidade e por pautas interseccionais. Autoras como Simone de Beauvoir, Betty Friedan e Judith Butler são referências.",["1ª onda: voto e educação (sufrágio)","2ª onda: igualdade no trabalho, sexualidade, corpo","3ª/4ª ondas: diversidade, interseccionalidade","Butler: gênero como performance, não essência"],"Feminismo não é o oposto de machismo: é luta por igualdade. Beauvoir: 'não se nasce mulher, torna-se mulher'. Butler: gênero é performativo, não dado biológico.","O movimento feminista tem uma história longa e plural. No Brasil, o voto feminino foi conquistado em 1932; nas décadas seguintes, o movimento passou a discutir trabalho, sexualidade, violência doméstica e representação política, e a incorporar pautas de mulheres negras, indígenas e LGBT.","A trajetória descrita mostra que o feminismo:",["é um movimento único, com pauta restrita ao direito ao voto.","é um movimento homogêneo, sem relação com outras pautas sociais.","é um movimento plural, com pautas que se ampliaram historicamente e dialogam com raça, classe e sexualidade.","é um movimento exclusivamente europeu, sem presença no Brasil.","é uma ação isolada, sem relação com conquistas institucionais."],2,"O feminismo é plural e histórico: começou com pautas como voto e educação e se ampliou para trabalho, sexualidade, violência e marcadores como raça e classe. As demais alternativas negam essa pluralidade ou a presença do movimento no Brasil."],
"Movimento negro e indígena no Brasil":["O movimento negro brasileiro atua desde o período pós-abolição, denunciando o racismo e lutando por igualdade, memória, cultura e políticas de reparação. Exemplos: Frente Negra Brasileira (1931), Teatro Experimental do Negro (1944), Movimento Negro Unificado (1978), e conquistas como a Lei de Cotas (2012) e o Estatuto da Igualdade Racial (2010). O movimento indígena defende territórios, línguas, culturas e o direito à autodeterminação, com destaque para a atuação da APIB e lideranças como Ailton Krenak e Davi Kopenawa.",["Frente Negra (1931), TEN (1944), MNU (1978)","Conquistas: Lei de Cotas, Estatuto da Igualdade Racial","Movimento indígena: território, língua, autodeterminação","APIB, Krenak e Kopenawa"],"Diferencie racismo (estrutural), preconceito (opinião) e discriminação (ato). Palavras-chave do movimento indígena: demarcação, autodeterminação, terra.","Duas conquistas marcam o reconhecimento de direitos no Brasil recente: a Lei de Cotas (2012), que reserva vagas em universidades federais para estudantes de escolas públicas, pretos, pardos e indígenas; e a demarcação de terras indígenas prevista na Constituição de 1988.","Essas conquistas resultam principalmente:",["da boa vontade espontânea das elites políticas.","de ações isoladas de juízes e parlamentares.","da pressão organizada dos movimentos negro e indígena, que pautaram o Estado ao longo de décadas.","de decisões exclusivamente internacionais.","de interesses econômicos de empresas privadas."],2,"As conquistas de direitos no Brasil têm sido resultado de décadas de mobilização dos movimentos sociais, especialmente negro e indígena. A alternativa A nega o protagonismo social; a B isola agentes; a D e a E retiram a agência dos movimentos."],
"ONGs e novas formas de participação":["Organizações Não Governamentais (ONGs) são entidades da sociedade civil, sem fins lucrativos, que atuam em causas sociais, ambientais, de direitos humanos e assistência. Ampliaram-se a partir dos anos 1980-90, com o processo de redemocratização e a atuação internacional. Ao lado de coletivos, redes e movimentos em rede (Castells), configuram novas formas de participação, complementando — mas não substituindo — partidos, sindicatos e movimentos clássicos.",["ONGs: sociedade civil, sem fins lucrativos","Atuação: direitos, ambiente, assistência, advocacy","Redes e coletivos: participação contemporânea","Castells: movimentos em rede"],"ONGs não substituem o Estado nem o voto: são formas complementares de participação. Desconfie de alternativas que as apresentem como 'tudo' ou como 'nada'.","Um município firmou parceria com uma ONG local para capacitar jovens em situação de vulnerabilidade em cursos profissionalizantes. A ONG recebe recursos públicos e presta contas em portal próprio. Paralelamente, coletivos digitais se organizam para fiscalizar o orçamento municipal.","A situação descrita mostra que:",["as ONGs substituem integralmente o Estado nas políticas sociais.","as ONGs e coletivos são novas formas de participação da sociedade civil que complementam a ação estatal e o controle social.","as ONGs não têm qualquer papel social relevante.","o único canal legítimo de participação é o voto.","os coletivos digitais não são formas de participação política."],1,"ONGs e coletivos ampliam a participação social e o controle cidadão, atuando em conjunto com o Estado. A alternativa A as coloca como substituição; a C nega sua relevância; a D reduz participação ao voto; a E desconhece as novas formas."],
"Movimento ambientalista":["O movimento ambientalista surge com força a partir dos anos 1960-70, denunciando os impactos da industrialização sobre o meio ambiente. No Brasil, ganhou destaque com a luta de Chico Mendes, a criação do Ibama e do Ministério do Meio Ambiente, e a atuação de organizações como o Greenpeace e o ISA. Suas pautas incluem preservação, justiça ambiental e combate às mudanças climáticas.",["Surgimento: anos 1960-70","Chico Mendes e a luta dos seringueiros","Justiça ambiental e mudanças climáticas","ONGs: Greenpeace, ISA, WWF"],"Ambientalismo não é só 'defesa da natureza': envolve justiça social e crítica ao modelo de desenvolvimento. Palavras-chave: sustentabilidade, justiça ambiental.","Em 1988, o líder seringueiro Chico Mendes foi assassinado por defender a floresta amazônica e os modos de vida dos povos da floresta, contra o avanço do desmatamento.","A atuação de Chico Mendes é representativa do:",["movimento ambientalista, que articula defesa da natureza e justiça social.","movimento operário, exclusivamente urbano.","movimento feminista.","movimento indígena, sem relação com o meio ambiente.","movimento religioso."],0,"Chico Mendes articulou a defesa da floresta com a luta dos trabalhadores rurais, sendo símbolo do ambientalismo socioambiental. As demais alternativas deslocam a pauta para outros movimentos."],
"Movimento LGBTQIA+ contemporâneo":["O movimento LGBTQIA+ luta pelo reconhecimento de identidades, contra a discriminação e a violência, e por igualdade de direitos (casamento, adoção, nome social, criminalização da LGBTfobia). No Brasil, ganhou visibilidade a partir dos anos 1970-80, com o Grupo Somos e o jornal Lampião. Conquistas incluem a decisão do STF de 2011 sobre união estável e a criminalização da LGBTfobia em 2019.",["Diversidade de identidades (L, G, B, T, Q, I, A, +)","Conquistas: união estável (2011), criminalização da LGBTfobia (2019)","Combate à violência e discriminação","Movimento plural e diverso"],"Não trate LGBTQIA+ como bloco homogêneo: há diversidade interna. Palavras-chave: reconhecimento, igualdade, criminalização.","Em 2019, o Supremo Tribunal Federal equiparou a homofobia e a transfobia ao crime de racismo, até que o Congresso legisle sobre o tema.","Essa decisão representa:",["uma vitória do movimento LGBTQIA+, no combate à discriminação e à violência.","um retrocesso nos direitos civis.","uma medida exclusivamente econômica.","um ato isolado sem relação com movimentos sociais.","uma medida que nega a cidadania."],0,"A decisão é uma conquista do movimento LGBTQIA+, ampliando a proteção contra discriminação. As demais alternativas negam ou desvirtuam seu significado."],
"Declaração Universal dos Direitos Humanos":["A Declaração Universal dos Direitos Humanos foi adotada pela Assembleia Geral da ONU em 10 de dezembro de 1948, no contexto pós-Segunda Guerra Mundial e do Holocausto. Ela estabelece, em 30 artigos, que todos os seres humanos nascem livres e iguais em dignidade e direitos, independentemente de raça, sexo, religião, opinião ou origem. Não é um tratado, mas inspira Constituições e tratados internacionais.",["Adotada em 10/12/1948 pela ONU","30 artigos; princípio da dignidade humana","Universalidade e indivisibilidade dos direitos","Inspira Constituições e tratados"],"Lembre a data (1948) e o contexto (pós-Guerra, Holocausto). Diferencie universalidade (valem para todos) de relativismo cultural extremo.","A Declaração Universal dos Direitos Humanos, de 1948, foi redigida por representantes de diferentes tradições jurídicas e culturais, sob a coordenação de Eleanor Roosevelt, após os horrores da Segunda Guerra Mundial e do Holocausto.","A Declaração tem como princípio central:",["a soberania absoluta dos Estados sobre os indivíduos.","a supremacia de algumas culturas sobre outras.","a dignidade inerente a todos os seres humanos, com direitos iguais e inalienáveis.","a subordinação dos direitos humanos ao poder econômico.","a defesa exclusiva dos direitos civis, sem direitos sociais."],2,"A dignidade da pessoa humana e a igualdade de direitos são o núcleo da DUDH. A alternativa A inverte a relação entre Estado e indivíduo; a B contradiz a universalidade; a D nega a indivisibilidade; a E ignora os direitos sociais, também previstos."],
"Constituição de 1988 e direitos sociais":["A Constituição Federal de 1988, chamada 'Constituição Cidadã', foi promulgada após o fim da ditadura militar, num amplo processo de participação social. Ela consagra direitos civis, políticos e sociais; prevê saúde e educação como direitos de todos e deveres do Estado; reconhece direitos de povos indígenas, quilombolas e crianças; e define o Brasil como Estado Democrático de Direito.",["Promulgada em 5 de outubro de 1988","'Constituição Cidadã'","Saúde e educação como direitos de todos","Estado Democrático de Direito; ampla participação social"],"A Constituição de 1988 é posterior à ditadura (1964-1985) e resultado da redemocratização. Não confunda com a de 1946 (também democrática) nem com a de 1967 (regime militar).","A Constituição Federal de 1988, conhecida como 'Constituição Cidadã', ampliou direitos civis, políticos e sociais após mais de duas décadas de regime militar. Entre outras medidas, consagrou o SUS como sistema público universal de saúde.","Sobre essa Constituição, é correto afirmar:",["foi outorgada pelo regime militar de 1964.","resultou da redemocratização, com ampla participação da sociedade, e consagrou direitos sociais como saúde e educação.","limitou-se a direitos civis, sem prever direitos sociais.","restringiu os direitos dos povos indígenas e quilombolas.","foi escrita sem participação popular, por especialistas nomeados."],1,"A Constituição de 1988 é fruto da redemocratização e marca a ampliação de direitos no Brasil, incluindo os sociais. A alternativa A inverte o contexto histórico; a C nega os direitos sociais; a D contraria o texto constitucional; a E desconsidera a participação social."],
"Direitos civis, políticos e sociais":["A distinção clássica (Marshall) divide a cidadania em três gerações ou dimensões: direitos civis (liberdades individuais, propriedade, justiça); direitos políticos (votar, ser votado, participar); direitos sociais (trabalho, saúde, educação, previdência). As chamadas 'gerações' não se substituem: somam-se e se reforçam. No Brasil, a efetivação desses direitos é desigual, marcada por desigualdades regionais e sociais.",["Civis: liberdades e justiça","Políticos: voto e participação","Sociais: saúde, educação, trabalho","Não se substituem: somam-se"],"Direito previsto em lei não é necessariamente direito efetivo. Cidadania formal ≠ cidadania real. Palavras-chave: efetivação, acesso, desigualdade.","Uma reportagem hipotética destaca a seguinte contradição: no Brasil, todos têm direito ao voto (direito político) e à saúde pública (direito social), mas o acesso a serviços de saúde e à justiça varia muito conforme a região e a renda das famílias.","A situação ilustra que:",["a cidadania formal é idêntica à cidadania real em qualquer lugar.","os direitos sociais substituem os direitos políticos no Brasil.","há distância entre cidadania formal (prevista em lei) e cidadania real (efetivada no cotidiano), com desigualdades de acesso.","os direitos civis não existem no Brasil.","direitos políticos são irrelevantes para a cidadania."],2,"A cidadania prevista em lei (formal) não garante acesso igual (real). A alternativa A iguala as duas dimensões; a B supõe substituição indevida; a D e a E negam direitos que existem formalmente no país."],
"Sociologia Jurídica":["A Sociologia Jurídica investiga as relações entre direito e sociedade, analisando como as normas jurídicas refletem e moldam relações sociais, e como a justiça é aplicada de forma desigual. Temas como acesso à justiça, seletividade penal e função social do direito são centrais. Autores como Boaventura de Sousa Santos discutem a sociologia jurídica crítica.",["Direito como fato social","Seletividade penal e acesso à justiça","Função social do direito","Boaventura: sociologia jurídica crítica"],"Não confunda direito formal (previsto em lei) com direito efetivo (aplicado na prática). A justiça pode ser seletiva. Palavras-chave: seletividade, acesso.","Estudo hipotético mostra que a aplicação da lei varia conforme a classe social e a raça dos envolvidos, com maior punição para grupos vulneráveis e maior acesso a defesas técnicas para grupos de alta renda.","A Sociologia Jurídica analisa esse fenômeno como:",["falha individual de juízes.","seletividade do sistema de justiça, que reproduz desigualdades sociais.","prova de que a lei é justa para todos.","problema sem relação com a estrutura social.","fenômeno exclusivamente econômico."],1,"A seletividade penal é um conceito central da Sociologia Jurídica. As outras alternativas individualizam ou negam a dimensão estrutural."],
"Surgimento da Sociologia":["A Sociologia surge no século XIX, na Europa, em meio à Revolução Industrial, à urbanização e às transformações políticas (Revolução Francesa). Auguste Comte propôs a 'física social' (positivismo), depois renomeada Sociologia. Émile Durkheim a institucionalizou como disciplina acadêmica, com objeto e método próprios. O contexto exigia entender a nova ordem social, marcada por conflitos de classe, pobreza urbana e anomia.",["Séc. XIX, Europa, pós-Revolução Industrial","Comte: 'física social', positivismo","Durkheim: institucionalização e método","Contexto: industrialização, urbanização, revoluções"],"Comte é associado ao positivismo e à criação do termo; Durkheim, à institucionalização. Marx não é considerado 'pai da Sociologia', embora seja um clássico fundamental.","A Sociologia surge na Europa do século XIX, em um contexto de industrialização, crescimento das cidades, êxodo rural, conflitos de classe e transformações políticas. Auguste Comte propôs inicialmente o nome 'física social', depois substituído por 'Sociologia'.","Sobre esse surgimento, é correto afirmar:",["a Sociologia surgiu na Antiguidade, com Aristóteles.","a Sociologia surgiu no século XIX, para compreender as transformações sociais trazidas pela industrialização e pelas revoluções.","a Sociologia se confunde com a Filosofia e nunca se tornou ciência autônoma.","a Sociologia foi criada por Karl Marx, como ciência do capitalismo.","a Sociologia surgiu no século XX, após as guerras mundiais."],1,"A Sociologia se constitui como ciência no século XIX, em resposta às transformações da industrialização. A alternativa A recua indevidamente; a C ignora a autonomia da disciplina; a D atribui a criação a Marx; a E adia o surgimento em um século."],
"Senso comum x conhecimento científico":["Senso comum é um saber espontâneo, fragmentário, frequentemente baseado em tradição e experiência cotidiana, sem método nem verificação sistemática. O conhecimento científico é metódico, sistemático, verificável, público e passível de revisão. A Sociologia se aproxima do senso comum como ponto de partida, mas dele se distingue pela crítica e pelo rigor metodológico — como destacou Durkheim em 'As Regras do Método Sociológico'.",["Senso comum: espontâneo, fragmentário, sem método","Ciência: metódica, sistemática, verificável","Durkheim: romper com pré-noções","Ruptura com o senso comum como ponto de partida"],"Não trate o senso comum como 'falso' e a ciência como 'verdadeira': a diferença é de método e de crítica. Palavra-chave: ruptura.","Um professor propôs aos alunos comparar duas afirmações. (1) 'Quem estuda sempre enriquece, é só se esforçar'. (2) Pesquisas mostram que a mobilidade social depende de fatores estruturais, como acesso à educação, herança familiar e desigualdades regionais.","A comparação evidencia que:",["o senso comum é sempre falso e a ciência, sempre verdadeira.","o senso comum e o conhecimento científico são idênticos em método e rigor.","o conhecimento científico se distingue por ser metódico, sistemático e verificável, rompendo com explicações espontâneas do senso comum.","o senso comum não deve ser considerado em pesquisas sociais.","a ciência não se preocupa em verificar suas afirmações."],2,"A ciência se distingue pela sistematicidade e verificação, rompendo com explicações espontâneas, sem descartar o senso comum como ponto de partida. A alternativa A absolutiza; a B iguala; a D descarta o senso comum indevidamente; a E nega a verificação."],
"Métodos de pesquisa social":["A pesquisa social pode ser quantitativa (dados estatísticos, amostras, surveys, censos) ou qualitativa (entrevistas, observação participante, análise documental, grupos focais). Métodos mistos combinam as duas abordagens. A escolha depende da pergunta: medir a distribuição de renda pede dados quantitativos; compreender o sentido da ação pede método compreensivo (Weber).",["Quantitativa: censos, surveys, amostras","Qualitativa: entrevistas, observação, documentos","Weber: método compreensivo","Métodos mistos: combinam as duas abordagens"],"Não existe método 'melhor': depende do objetivo. Weber propôs a compreensão (Verstehen); Durkheim privilegiou o tratamento dos fatos sociais como coisas. Palavra-chave: adequação do método.","Para uma pesquisa sobre a percepção do trabalho entre entregadores de aplicativo, um grupo propôs um survey com 500 questionários; outro sugeriu entrevistas em profundidade com 15 entregadores e observação em campo.","Sobre as duas propostas, é correto afirmar:",["apenas a primeira é científica, pois usa números.","apenas a segunda é científica, pois lida com sentido.","as duas são abordagens legítimas — quantitativa e qualitativa —, e a escolha depende do objetivo da pesquisa.","nenhuma das duas serve à Sociologia, que só usa documentos.","as duas são equivalentes e indiferentes ao objeto de pesquisa."],2,"Quantitativa e qualitativa são abordagens legítimas, com finalidades distintas: medir regularidades ou compreender sentidos. A alternativa A e a B hierarquizam indevidamente; a D nega a prática sociológica; a E ignora a relação entre método e objeto."],
"Conceitos Fundamentais da Sociologia":["A Sociologia estuda as relações sociais, as instituições e os processos de transformação da sociedade. Conceitos básicos incluem: socialização (processo pelo qual o indivíduo aprende normas e valores), instituições sociais (família, escola, religião, Estado), estratificação (desigualdades estruturadas), poder (capacidade de influenciar), ideologia (sistemas de crenças que legitimam relações de poder), e mudança social.",["Socialização: aprender normas e valores","Instituições sociais: família, escola, religião, Estado","Estratificação: desigualdades estruturadas","Ideologia: crenças que legitimam poder"],"Conceitos fundamentais aparecem de forma interdisciplinar. Não confunda socialização (processo) com socialismo (doutrina política).","Em uma escola, crianças aprendem a esperar a vez, respeitar regras e cumprimentar professores. Paralelamente, aprendem que determinadas profissões são mais valorizadas que outras.","Os dois processos descritos correspondem, respectivamente, a:",["socialização e estratificação social.","estratificação e socialização.","ideologia e socialização.","mudança social e estratificação.","socialização e mudança social."],0,"Aprendizado de normas e valores é socialização; a hierarquia de valorização de profissões é estratificação. As demais alternativas trocam ou misturam os conceitos."],
"Indivíduo e Sociedade":["A relação entre indivíduo e sociedade é um dos eixos centrais da Sociologia. Nem o indivíduo é totalmente determinado pela sociedade, nem a sociedade é apenas a soma de indivíduos: ambos se constituem mutuamente. Norbert Elias, em 'A Sociedade dos Indivíduos', mostra que a separação entre indivíduo e sociedade é falsa, pois cada um só existe na relação com o outro. Durkheim enfatiza a primazia do social; Weber, a ação individual dotada de sentido.",["Indivíduo e sociedade se constituem mutuamente","Elias: 'A Sociedade dos Indivíduos' — relação, não oposição","Durkheim: primazia do social","Weber: ação individual com sentido"],"Não caia no extremo: nem 'o indivíduo é tudo' nem 'a sociedade determina tudo'. O ENEM cobra a relação dialética entre ambos. Palavra-chave: socialização.","O rapaz que pretende se casar não nasceu com esse imperativo. Ele foi insuflado pela sociedade, reforçado pelas incontáveis pressões de histórias de família, educação, moral, religião e dos meios de comunicação.","A situação descrita ilustra que:",["o indivíduo é totalmente livre de influências sociais.","a sociedade determina completamente o comportamento individual.","indivíduo e sociedade se influenciam mutuamente, e as escolhas individuais são moldadas por pressões sociais.","não há relação entre escolhas individuais e contexto social.","a sociedade não influencia decisões pessoais."],2,"A situação mostra a influência social sobre escolhas individuais, mas sem determinismo absoluto. A alternativa A nega a influência social; a B afirma determinismo total; a D e a E negam a relação entre indivíduo e sociedade."],
"Revolução Científica e Industrial":["A Revolução Científica (séc. XVI-XVII) transformou a forma de conhecer o mundo, com Galileu, Descartes e Newton, substituindo explicações religiosas por método experimental e matematização. A Revolução Industrial (séc. XVIII-XIX), iniciada na Inglaterra, mecanizou a produção, urbanizou a sociedade e criou novas classes sociais. Juntas, essas revoluções criaram as condições para o surgimento da Sociologia como ciência.",["Revolução Científica: método experimental e matematização","Revolução Industrial: mecanização, fábrica, urbanização","Contexto de surgimento da Sociologia","Transformações sociais profundas"],"Não confunda Revolução Científica (forma de conhecer) com Revolução Industrial (forma de produzir). Ambas criaram o contexto para a Sociologia. Palavra-chave: contexto histórico.","A Sociologia surge no século XIX como resposta intelectual aos problemas sociais gerados pela Revolução Industrial (urbanização, pobreza, conflitos de classe) e às transformações trazidas pela Revolução Científica.","A relação entre as revoluções Científica e Industrial e o surgimento da Sociologia é:",["inexistente, pois a Sociologia nasceu isolada.","de contexto: ambas criaram as condições sociais e intelectuais para o surgimento da Sociologia como ciência.","apenas econômica, sem relação com o conhecimento.","de oposição, pois a Sociologia negava a ciência.","restrita à Inglaterra, sem impacto global."],1,"As revoluções Científica e Industrial criaram o contexto social e intelectual para a Sociologia. As demais alternativas negam ou distorcem essa relação."],
"Relações Sociais":["Relações sociais são as interações entre indivíduos e grupos, mediadas por normas, valores e estruturas sociais. Para Marx, as relações sociais são fundamentalmente relações de produção; para Weber, são orientadas por sentidos e expectativas mútuas; para Durkheim, são moldadas por instituições e pela solidariedade social. As relações sociais se transformam historicamente, como na passagem da sociedade feudal para a capitalista.",["Marx: relações sociais = relações de produção","Weber: relações orientadas por sentido","Durkheim: relações moldadas por instituições","Relações sociais são históricas e transformáveis"],"Diferencie os três autores: Marx enfatiza a economia; Weber, a ação com sentido; Durkheim, as instituições. Palavra-chave: interação social.","Na sociedade contemporânea, as relações sociais tendem a ser mediadas por imagens midiáticas, e a imagem de um indivíduo pode agregar valor econômico na indústria do espetáculo.","A análise sociológica das relações sociais na contemporaneidade deve considerar:",["que as relações sociais são imutáveis.","que as relações sociais são transformadas historicamente e podem ser mediadas por fatores como mídia e economia.","que as relações sociais não têm relação com o poder.","que as relações sociais são exclusivamente econômicas.","que as relações sociais não se alteram com a tecnologia."],1,"As relações sociais são históricas e se transformam, inclusive pela mediação da mídia e da economia. As demais alternativas negam a historicidade ou reduzem a uma única dimensão."],
"Émile Durkheim e os fatos sociais":["Durkheim (1858-1917) foi um dos fundadores da Sociologia como ciência autônoma. Definiu o objeto da disciplina como 'fatos sociais': maneiras de agir, pensar e sentir externas ao indivíduo, dotadas de coercitividade e generalidade. Em 'O Suicídio' (1897), mostrou que até o ato aparentemente mais individual é influenciado por fatores sociais (integração e regulação). Distinguiu solidariedade mecânica (sociedades tradicionais) e orgânica (sociedades modernas, com divisão do trabalho).",["Fatos sociais: externos, coercitivos, gerais","Tratar os fatos sociais como coisas","Suicídio: fenômeno social (egoísta, altruísta, anômico)","Solidariedade mecânica x orgânica"],"Não reduza os fatos sociais a opiniões individuais: eles são exteriores e coercitivos. Palavras-chave: exterioridade, coerção, generalidade.","Ao estudar o suicídio, Durkheim observou que as taxas variavam conforme o grau de integração social dos indivíduos: homens solteiros, protestantes em certos contextos e pessoas isoladas apresentavam taxas mais altas em determinados períodos do que grupos mais integrados.","A análise de Durkheim mostra que:",["o suicídio é um ato puramente individual, sem relação com a sociedade.","mesmo atos aparentemente individuais, como o suicídio, são influenciados por fatores sociais, como integração e regulação.","o suicídio só existe em sociedades modernas.","a Sociologia não deve estudar o suicídio.","as taxas de suicídio são aleatórias em qualquer sociedade."],1,"Durkheim mostrou que taxas de suicídio variam com integração e regulação social — daí tratar o suicídio como fato social. A alternativa A nega a tese; a C recorta indevidamente; a D contraria a própria obra; a E ignora regularidades."],
"Max Weber: ação social e dominação":["Weber (1864-1920) define a Sociologia como ciência que busca compreender a ação social — conduta dotada de sentido, orientada pela ação de outros — e explicar seus efeitos. Classifica a ação em racional com relação a fins, racional com relação a valores, afetiva e tradicional. Distingue três tipos puros de dominação legítima: tradicional, carismática e racional-legal.",["Ação social: conduta com sentido voltado a outros","Tipos: racional-fins, racional-valores, afetiva, tradicional","Dominação: tradicional, carismática, racional-legal","Burocracia: tipo ideal da dominação racional-legal"],"Não confunda ação social (com sentido) com ação em massa (reação homogênea). A dominação racional-legal é a base do Estado moderno e da burocracia.","Em uma análise sobre obediência ao poder, três exemplos foram comparados: (1) a obediência a um líder por sua 'aura' pessoal; (2) a obediência a tradições e costumes herdados; (3) a obediência às leis e às normas impessoais de um Estado moderno.","Segundo a tipologia weberiana de dominação legítima, esses casos correspondem, respectivamente, a dominação:",["racional-legal, tradicional e carismática.","tradicional, carismática e racional-legal.","carismática, tradicional e racional-legal.","carismática, racional-legal e tradicional.","racional-legal, carismática e tradicional."],2,"Carismática: baseada em qualidades pessoais do líder. Tradicional: baseada em costumes e herança. Racional-legal: baseada em leis impessoais. As outras alternativas trocam a ordem."],
"Karl Marx: materialismo histórico":["Marx (1818-1883) analisa a sociedade a partir do materialismo histórico: as condições materiais de produção da vida determinam, em última instância, a estrutura social, política e cultural. Conceitos centrais: luta de classes, mais-valia, alienação, infraestrutura (base econômica) e superestrutura (Estado, direito, ideologia). Seu método é dialético e crítico, voltado à transformação social.",["Materialismo histórico: base econômica condiciona a superestrutura","Luta de classes: motor da história","Infraestrutura x superestrutura","Método dialético e crítico"],"Marx não é o 'pai da Sociologia'. A contribuição dele é o materialismo histórico e a crítica da economia política. Palavras-chave: base, superestrutura, mais-valia.","Para Marx, a estrutura econômica da sociedade (modo de produção) é a base sobre a qual se erguem instituições jurídicas, políticas e formas de consciência social, que ele chama de superestrutura.","De acordo com o materialismo histórico, é correto afirmar que:",["a superestrutura determina totalmente a base econômica.","a base econômica e a superestrutura são independentes entre si.","a base econômica condiciona, em última instância, a superestrutura, que também reage sobre ela.","a cultura e a política não têm relação com a economia.","a religião é o único fator relevante para explicar a história."],2,"No materialismo histórico, a base econômica condiciona a superestrutura, que reage dialeticamente sobre ela. A alternativa A inverte a relação; a B nega o condicionamento; a D nega a articulação; a E absolutiza um fator isolado."],
"Pierre Bourdieu: capital cultural e habitus":["Pierre Bourdieu (1930-2002) analisou como as desigualdades se reproduzem por meio de mecanismos culturais. Conceitos centrais: capital cultural (conhecimentos, gostos e disposições herdados), habitus (disposições incorporadas que orientam práticas) e campo (espaço social com regras próprias). Sua obra 'A Reprodução' mostra como a escola valoriza o capital cultural das classes dominantes, legitimando desigualdades como 'mérito'.",["Capital cultural: conhecimentos e gostos herdados","Habitus: disposições incorporadas","Campo: espaço social com regras próprias","Reprodução: escola legitima desigualdades"],"Bourdieu não diz que a escola é inútil, mas que ela reproduz desigualdades. Não confunda capital cultural com 'cultura geral'. Palavra-chave: reprodução.","Para Bourdieu, alunos das classes populares chegam à escola com repertório cultural diferente do valorizado, o que é tratado como deficiência, enquanto o repertório das classes altas é tomado como 'mérito'.","A análise de Bourdieu mostra que:",["a escola é neutra e distribui oportunidades igualmente.","a escola tende a reproduzir desigualdades ao valorizar o capital cultural das classes dominantes.","o capital cultural não influencia o desempenho escolar.","o esforço individual é o único fator de sucesso.","a escola elimina desigualdades."],1,"Bourdieu mostra que a escola reproduz desigualdades ao tomar o capital cultural dominante como parâmetro. As demais alternativas negam a crítica ou idealizam a escola."],
"Michel Foucault: poder e disciplina":["Michel Foucault (1926-1984) analisou o poder não apenas como repressão, mas como algo produtivo e capilar, presente nas instituições (escola, prisão, hospital). Conceitos centrais: disciplina (conjunto de técnicas que moldam corpos e comportamentos), biopoder (gestão da vida das populações) e sociedade disciplinar. Em 'Vigiar e Punir', mostra a passagem do suplício à disciplina nas prisões.",["Poder capilar e produtivo","Disciplina: moldar corpos e comportamentos","Biopoder: gestão da vida das populações","Vigiar e Punir: do suplício à disciplina"],"Foucault não diz que o poder é apenas repressivo: ele produz subjetividades e comportamentos. Não confunda disciplina (técnica) com disciplina escolar no senso comum.","Segundo Foucault, a escola, a prisão e o hospital compartilham técnicas de controle do tempo, do espaço e dos corpos, produzindo corpos dóceis e úteis.","A análise de Foucault sobre o poder destaca:",["que o poder é apenas repressivo.","que o poder é capilar e produtivo, presente nas instituições e nas práticas cotidianas.","que o poder não tem relação com as instituições.","que a disciplina é uma invenção recente e inútil.","que o poder é exclusivamente econômico."],1,"Foucault mostra que o poder se exerce de forma capilar e produtiva. As demais alternativas reduzem o poder à repressão ou negam sua dimensão institucional."],
"Zygmunt Bauman: modernidade líquida":["Zygmunt Bauman (1925-2017) descreve a contemporaneidade como 'modernidade líquida': as relações sociais, identidades e instituições tornaram-se fluidas, instáveis e provisórias. Diferente da modernidade sólida (com instituições duradouras), a líquida exige adaptação constante e produz insegurança e individualização. Em 'Modernidade Líquida', analisa o consumo, o amor e o trabalho como esferas marcadas pela efemeridade.",["Modernidade líquida: fluidez e instabilidade","Modernidade sólida: instituições duradouras","Individualização e insegurança","Consumo, amor e trabalho efêmeros"],"Bauman não defende a fluidez como algo positivo: ele a analisa criticamente. Não confunda 'líquido' com 'leve' ou 'livre'. Palavra-chave: insegurança.","Nas sociedades contemporâneas, relações de trabalho, vínculos afetivos e identidades são cada vez mais provisórios, exigindo dos indivíduos constante reinvenção.","A análise de Bauman sobre a modernidade líquida destaca:",["a solidez das instituições contemporâneas.","a fluidez das relações sociais e a insegurança que ela produz.","a estabilidade das identidades.","a ausência de mudanças sociais.","a permanência dos laços comunitários."],1,"Bauman analisa a fluidez e a insegurança da contemporaneidade. As demais alternativas negam a tese ou invertem seus termos."],
"Norbert Elias: processo civilizador":["Norbert Elias (1897-1990), em 'O Processo Civilizador', analisa como as sociedades europeias desenvolveram, ao longo de séculos, maior controle das emoções e dos impulsos, por meio de mudanças nas normas sociais e nas configurações de poder. Não se trata de 'evolução' moral, mas de transformações históricas nas formas de convivência e autocontrole.",["Processo civilizador: controle das emoções","Configurações sociais e poder","Não é evolução moral, mas transformação histórica","Autocontrole e normas sociais"],"Elias não defende superioridade europeia: analisa transformações históricas. Não confunda 'civilizador' com juízo de valor. Palavra-chave: autocontrole.","Elias mostra que, ao longo dos séculos, normas de comportamento à mesa, em público e nas relações sociais se tornaram mais rígidas, exigindo maior autocontrole dos indivíduos.","A tese de Elias sobre o processo civilizador indica:",["que a Europa é moralmente superior.","que houve transformação histórica nas formas de autocontrole e convivência, sem juízo de superioridade.","que o controle das emoções sempre existiu igual.","que as normas sociais não mudam.","que a civilização é um fenômeno biológico."],1,"Elias analisa transformações históricas no autocontrole, sem hierarquizar culturas. As demais alternativas fazem juízo de valor ou negam a historicidade."],
"Gilberto Freyre: Casa-Grande & Senzala":["Em 'Casa-Grande & Senzala' (1933), Gilberto Freyre analisa a formação da sociedade brasileira colonial a partir da relação entre senhores, escravizados e indígenas, destacando a miscigenação e o papel da família patriarcal rural. Sua obra rompeu com leituras racistas e deterministas, mas também foi criticada por suavizar as violências da escravidão, ao enfatizar harmonia e miscigenação.",["Casa-Grande & Senzala (1933)","Miscigenação e patriarcalismo rural","Crítica posterior: atenua a violência da escravidão","Leitura culturalista da formação brasileira"],"Freyre não é racista, mas sua leitura da 'democracia racial' foi criticada por mascarar desigualdades. Palavras-chave: miscigenação, patriarcalismo, crítica à democracia racial.","Em 'Casa-Grande & Senzala', Gilberto Freyre analisou a formação da sociedade brasileira colonial, enfatizando a miscigenação, o patriarcalismo rural e as relações entre senhores, escravizados e indígenas, em uma leitura culturalista.","Uma crítica recorrente à obra de Freyre é a de que:",["ele defende a segregação racial nos moldes do apartheid.","ele reproduz o racismo científico do século XIX.","ao enfatizar harmonia e miscigenação, ele atenua as violências da escravidão e alimenta a ideia de 'democracia racial'.","sua obra ignora completamente a família patriarcal.","ele nega a importância da cultura na formação brasileira."],2,"A crítica principal a Freyre é o excesso de ênfase na harmonia e na miscigenação, que teria suavizado a violência escravista. A alternativa A e a B atribuem a Freyre o oposto do que ele defende; a D e a E contradizem a própria obra."],
"Sérgio Buarque: Raízes do Brasil":["Em 'Raízes do Brasil' (1936), Sérgio Buarque de Holanda analisa a formação social brasileira a partir da oposição entre 'homem cordial' — marcado por relações pessoais e afetivas — e o ideal impessoal da modernidade. Sua tese central é que a herança ibérica patrimonialista dificulta a separação entre público e privado e explica traços da política brasileira.",["Raízes do Brasil (1936)","Homem cordial: relações pessoais e afetivas","Patrimonialismo: confusão entre público e privado","Herança ibérica e dificuldade de impessoalidade"],"Cuidado: 'homem cordial' não significa 'gentil' nem 'bondoso'; refere-se à primazia das relações pessoais e à dificuldade de impessoalidade. Palavra-chave: patrimonialismo.","Sérgio Buarque de Holanda, em 'Raízes do Brasil', afirmou que o 'homem cordial' é aquele que age movido por laços pessoais e afetivos, e que essa característica dificulta a separação entre o público e o privado na política brasileira.","A tese do 'homem cordial' se refere:",["à bondade natural do povo brasileiro, superior a outros povos.","à hospitalidade brasileira como traço étnico herdado dos indígenas.","à primazia das relações pessoais e afetivas, que dificulta a impessoalidade na esfera pública.","ao formalismo das instituições brasileiras, contrário à afetividade.","à defesa do patrimonialismo como ideal republicano."],2,"'Homem cordial' designa o agir orientado por laços pessoais, e não a gentileza. A alternativa A distorce o conceito; a B o etniciza indevidamente; a D inverte a tese; a E faz apologia do que o autor critica."],
