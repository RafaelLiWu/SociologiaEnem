"Darcy Ribeiro: formação do povo brasileiro":["Em 'O Povo Brasileiro' (1995), Darcy Ribeiro analisa a formação do povo brasileiro a partir do encontro violento entre indígenas, africanos escravizados e colonizadores europeus, e das matrizes culturais que resultaram desse processo. Critica o ideal de 'democracia racial' e ressalta as desigualdades estruturais e a violência fundadora da colonização.",["O Povo Brasileiro (1995)","Matrizes: indígena, africana, europeia","Crítica à 'democracia racial'","Violência fundadora da colonização"],"'Democracia racial' é ideia criticada por Darcy Ribeiro e Florestan Fernandes, não defendida por eles. Palavras-chave: matrizes culturais, violência, desigualdade estrutural.","Em 'O Povo Brasileiro', Darcy Ribeiro afirma que a sociedade brasileira se formou a partir de matrizes indígenas, africanas e europeias, em um processo violento que gerou desigualdades duradouras e desmentiu o ideal de 'democracia racial'.","A tese central de Darcy Ribeiro:",["confirma que o Brasil vive uma democracia racial plena.","propõe que a formação brasileira resultou de um processo pacífico e igualitário.","reconhece matrizes indígenas, africanas e europeias e critica a 'democracia racial', mostrando a violência e a desigualdade estruturais da formação brasileira.","defende que o Brasil tem apenas herança europeia.","afirma que a escravidão não teve efeitos duradouros."],2,"Darcy Ribeiro reconhece a pluralidade de matrizes e critica a ideia de harmonia racial, mostrando a violência e a permanência das desigualdades. As demais alternativas contrariam sua obra."],
"Florestan Fernandes e Jessé Souza":["Florestan Fernandes (1920-1995) analisou a integração do negro na sociedade de classes e criticou a 'democracia racial' como mito que encobre desigualdades. Jessé Souza, sociólogo contemporâneo, em obras como 'A Ralé Brasileira' e 'A Elite do Atraso', analisa como o racismo e a herança escravocrata estruturam as classes sociais brasileiras, criticando interpretações que reduzem desigualdade a meritocracia.",["Florestan: crítica à 'democracia racial' e à integração desigual","Jessé Souza: herança escravocrata e racismo estrutural","Crítica ao mito meritocrático","Classes sociais no Brasil e a 'ralé'"],"Ambos criticam o mito da democracia racial e o discurso meritocrático. Não confunda: Florestan estuda a integração do negro; Jessé Souza trabalha com o conceito de 'ralé' e crítica à meritocracia.","O sociólogo Jessé Souza analisa como a herança escravocrata e o racismo estrutural moldaram as classes sociais brasileiras, criticando a ideia de que a posição de cada um depende apenas de esforço individual.","A análise de Jessé Souza se aproxima mais diretamente de:",["uma defesa do mito da democracia racial.","uma defesa da meritocracia como motor da mobilidade social.","uma crítica ao mito meritocrático, mostrando como a herança escravocrata e o racismo estruturam desigualdades no Brasil.","uma recusa em considerar o racismo como problema social.","uma defesa do determinismo biológico."],2,"Jessé Souza critica o mito meritocrático e destaca o peso do racismo estrutural e da herança escravocrata. As demais alternativas o colocam em posições contrárias ao seu pensamento."],
"Lélia Gonzalez: racismo e feminismo negro":["Lélia Gonzalez (1935-1994) foi filósofa, antropóloga e uma das principais vozes do feminismo negro no Brasil. Sua obra articula raça, classe e gênero, criticando tanto o racismo da sociedade brasileira quanto o etnocentrismo do feminismo branco. Cunhou o conceito de 'amefricanidade' para designar a herança cultural africana nas Américas.",["Lélia Gonzalez: feminismo negro e antirracismo","Interseccionalidade: raça, classe e gênero","Amefricanidade: herança africana nas Américas","Crítica ao feminismo hegemônico branco"],"Lélia Gonzalez antecede o conceito de interseccionalidade no Brasil. Não confunda com feminismo liberal: sua crítica é estrutural e articulada à raça.","Lélia Gonzalez criticou o feminismo brasileiro por não considerar as especificidades das mulheres negras, cujas experiências de opressão envolvem simultaneamente raça, classe e gênero.","A contribuição central de Lélia Gonzalez é:",["uma defesa do feminismo universal, sem recortes de raça.","a articulação entre racismo e sexismo, mostrando que as mulheres negras sofrem opressões específicas e simultâneas.","uma crítica exclusiva ao machismo, sem relação com racismo.","uma defesa do determinismo biológico.","uma recusa em discutir gênero."],1,"Lélia Gonzalez articula racismo e sexismo, evidenciando a especificidade da opressão sobre mulheres negras. As demais alternativas desconectam as opressões ou negam sua contribuição."],
"Família e suas transformações":["A família é uma instituição social que varia historicamente e entre culturas: da família extensa patriarcal colonial ao modelo nuclear do século XX, até as configurações contemporâneas (monoparental, homoafetiva, recomposta, ampliada). A família é agente de socialização primária e transmissora de valores, mas também palco de tensões de gênero e geração. Autores como Élisabeth Badinter discutem suas transformações.",["Família: instituição histórica e variável","Socialização primária","Modelos: extensa, nuclear, monoparental, homoafetiva","Tensões de gênero e geração"],"Não há um único modelo 'correto' de família. Cuidado com generalizações sobre 'a família'. Palavras-chave: pluralidade, historicidade.","Segundo o IBGE (dados públicos), o número de famílias monoparentais chefiadas por mulheres e de famílias homoafetivas cresceu nas últimas décadas no Brasil, ao lado da redução média do tamanho das famílias.","Esses dados mostram que:",["a família brasileira se tornou homogênea e igual à do século XIX.","a família é uma instituição histórica e variável, com pluralidade de configurações no Brasil contemporâneo.","o único modelo legítimo de família é o nuclear.","as famílias monoparentais são um fenômeno antigo, sem mudança recente.","a família não se transforma com a sociedade."],1,"Os dados mostram pluralização das configurações familiares, confirmando que a família é histórica e variável. As demais alternativas negam essas transformações ou impõem um modelo único."],
"Escola e reprodução social":["A escola é uma instituição socializadora central nas sociedades modernas: transmite conhecimentos, valores e normas. Ao mesmo tempo, sociólogos como Pierre Bourdieu e Jean-Claude Passeron mostram que ela tende a reproduzir desigualdades, ao valorizar o capital cultural das classes dominantes e tratar as demais como deficitárias. A escola não é apenas espaço de emancipação: é também campo de disputa.",["Socialização secundária","Bourdieu: capital cultural e reprodução","Escola: emancipação e reprodução","Campo de disputa social"],"Não trate a escola como 'neutra' nem como 'aparelho absoluto': ela é campo de disputas. Bourdieu: capital cultural e reprodução. Palavra-chave: herança cultural.","Para Bourdieu e Passeron, a escola tende a reconhecer como 'mérito' o repertório cultural que os alunos das classes altas já trazem de casa — língua, gostos, hábitos de leitura —, tratando como deficiência o que é diferença.","Segundo essa análise, a escola:",["é totalmente neutra e distribui oportunidades igualmente.","contribui para reproduzir desigualdades, ao valorizar o capital cultural das classes dominantes.","não tem relação com as classes sociais.","só atua como espaço de emancipação.","elimina qualquer desigualdade desde o ingresso."],1,"Bourdieu mostra que a escola reproduz desigualdades, ao tomar o capital cultural dominante como parâmetro. A alternativa A nega a crítica; a C e a D absolutizam outras leituras; a E é empiricamente falsa."],
"Religião e sociedade":["A religião é uma instituição social que organiza crenças, rituais, valores e vínculos comunitários, cumprindo funções de sentido, coesão e controle social. Durkheim via na religião uma forma de a sociedade adorar a si mesma (o sagrado como símbolo do coletivo). Weber mostrou a influência de valores religiosos no comportamento econômico ('A Ética Protestante e o Espírito do Capitalismo'). Marx a analisou como 'ópio do povo', crítica à função de consolo diante das desigualdades.",["Durkheim: religião como fato social, sagrado x profano","Weber: influência dos valores religiosos na economia","Marx: crítica à religião como consolo","Religião: instituição social plural"],"As três leituras clássicas divergem: Durkheim (coesão), Weber (sentido e economia), Marx (crítica). Não atribua uma à outra. Palavra-chave: instituição social.","Três autores clássicos trataram da religião. Durkheim a analisou como forma de coesão social; Weber investigou a relação entre a ética protestante e o espírito do capitalismo; Marx a criticou como 'ópio do povo'.","A comparação correta dessas leituras é:",["os três autores defendem a religião como caminho para a revolução social.","todos tratam a religião como fenômeno exclusivamente pessoal.","Durkheim enfatiza a coesão social; Weber, a influência dos valores religiosos na economia; Marx, a crítica à religião como consolo diante das desigualdades.","Weber defende a extinção da religião; Durkheim, a teocracia; Marx, a fusão entre Igreja e Estado.","os três autores ignoram a religião em suas obras."],2,"Cada autor analisa a religião com ênfases distintas: coesão (Durkheim), relação com a economia (Weber) e crítica (Marx). As alternativas A, B e E distorcem ou negam as obras; a D inventa posições que não são dos autores."],
"Sociologia da Educação":["A Sociologia da Educação estuda a escola como instituição social, suas funções de socialização, transmissão de conhecimento e reprodução ou transformação das desigualdades. Autores como Durkheim, Bourdieu e Passeron analisam o papel da educação na sociedade. A escola é campo de disputa e pode tanto emancipar quanto reproduzir.",["Socialização e transmissão cultural","Bourdieu: capital cultural e reprodução","Escola: emancipação e reprodução","Campo de disputa social"],"Não trate a escola como neutra. Bourdieu mostra como ela reproduz desigualdades ao valorizar o capital cultural dominante. Palavras-chave: capital cultural, reprodução.","Pesquisas mostram que alunos de escolas públicas têm desempenho médio inferior ao de alunos de escolas privadas, mesmo controlando o nível socioeconômico.","A análise sociológica desse fenômeno destaca que:",["a escola pública é intrinsecamente inferior.","a escola pode reproduzir desigualdades ao valorizar o capital cultural das classes dominantes.","o desempenho depende apenas do esforço individual.","o capital cultural não influencia o aprendizado.","a educação não tem relação com a estrutura social."],1,"Bourdieu mostra que a escola tende a valorizar o capital cultural dominante, reproduzindo desigualdades. As outras alternativas naturalizam a diferença ou negam a relação com a estrutura social."],
"Sociologia da Religião":["A Sociologia da Religião analisa a religião como fenômeno social, suas funções de coesão, sentido e controle social. Durkheim, Weber e Marx oferecem abordagens clássicas. Temas contemporâneos incluem secularização, pluralismo religioso, intolerância e Estado laico.",["Sagrado e profano (Durkheim)","Ética protestante (Weber)","Religião como ópio (Marx)","Secularização e pluralismo"],"Diferencie as abordagens: Durkheim (coesão), Weber (sentido e economia), Marx (crítica). Não confunda. Palavras-chave: laicidade, intolerância.","No Brasil, pesquisa hipotética mostra que, apesar da diversidade religiosa, casos de intolerância religiosa têm aumentado, especialmente contra religiões de matriz africana.","A análise sociológica desse cenário deve considerar que:",["a religião é um fenômeno exclusivamente privado.","o Estado laico deve garantir a liberdade religiosa e combater a intolerância.","a intolerância é um problema individual.","a religião não tem relação com a sociedade.","todas as religiões são iguais."],1,"O Estado laico garante a liberdade de crença e deve proteger todas as religiões. As outras alternativas privatizam a religião ou negam a dimensão social da intolerância."],
"Sociologia do Corpo e Saúde":["A Sociologia do Corpo e Saúde analisa como o corpo, a saúde e a doença são construídos socialmente, atravessados por normas, desigualdades e relações de poder. Temas como medicalização, saúde pública, gênero e corpo, e desigualdades em saúde são centrais. Autores como Michel Foucault discutem o biopoder e a medicalização.",["Corpo como construção social","Medicalização (Foucault)","Determinação social da saúde","Desigualdades em saúde"],"Saúde não é apenas biológica: é socialmente determinada. Palavras-chave: medicalização, desigualdade em saúde.","Estudos mostram que a expectativa de vida varia conforme a região e a renda, com populações vulneráveis adoecendo mais e tendo menos acesso a serviços de saúde.","A análise sociológica da saúde deve considerar:",["que a saúde é apenas biológica.","que a saúde é socialmente determinada, com desigualdades de acesso e condições de vida.","que o corpo não sofre influência social.","que a medicina resolve todos os problemas.","que a doença é escolha individual."],1,"A determinação social da saúde é um conceito central. As outras alternativas biologizam ou individualizam o fenômeno."],
"Socialização":["Socialização é o processo pelo qual o indivíduo internaliza normas, valores, práticas e identidades da sociedade em que vive, tornando-se membro ativo de seus grupos. Divide-se em socialização primária (infância, família, base da personalidade) e secundária (outros contextos, como escola e trabalho). Agentes socializadores incluem família, escola, pares, mídia e religião.",["Socialização primária: família, infância, base da personalidade","Socialização secundária: escola, trabalho, outros grupos","Agentes: família, escola, pares, mídia, religião","Internalização de normas e valores"],"Não confunda socialização (processo) com socialismo (doutrina). O ENEM cobra a distinção entre socialização primária e secundária. Palavra-chave: internalização.","Uma criança aprende, na família, a falar, a respeitar regras básicas e a se comportar à mesa. Anos depois, na escola, aprende a seguir horários, trabalhar em grupo e respeitar autoridades institucionais.","Os dois processos descritos correspondem, respectivamente, a:",["socialização secundária e socialização primária.","socialização primária e socialização secundária.","socialização e estratificação.","mudança social e socialização.","aculturação e socialização."],1,"A família é o principal agente da socialização primária; a escola, da secundária. As demais alternativas invertem a ordem ou misturam conceitos."],
"Intolerância Religiosa":["Intolerância religiosa é a discriminação, o preconceito ou a hostilidade dirigidos a indivíduos ou grupos por causa de suas crenças, práticas ou pertencimento religioso. Ela fere a liberdade de consciência e o princípio do Estado laico, que deve garantir a livre prática de todas as religiões. No Brasil, religiões de matriz africana são alvos frequentes de intolerância.",["Intolerância: discriminação por crença religiosa","Estado laico: garante liberdade de crença","Religiões de matriz africana: alvos frequentes","Intolerância fere direitos humanos"],"Não confunda intolerância religiosa com crítica religiosa. A primeira é discriminação e violência; a segunda é debate de ideias. Palavras-chave: laicidade, liberdade de crença.","No Brasil, dados hipotéticos mostram que casos de intolerância religiosa têm aumentado, especialmente contra praticantes de religiões de matriz africana, com ataques a templos e ofensas.","A análise sociológica da intolerância religiosa deve considerar que:",["a intolerância é um problema individual, sem dimensão social.","a intolerância religiosa fere o princípio do Estado laico e os direitos humanos, exigindo políticas de proteção à liberdade de crença.","a religião não tem relação com a sociedade.","todas as religiões são iguais, e a intolerância não existe.","a intolerância é um fenômeno exclusivamente brasileiro."],1,"A intolerância religiosa é um problema social que fere a laicidade e os direitos humanos. As demais alternativas individualizam ou negam o fenômeno."],
"Globalização e neoliberalismo":["Globalização é o processo de integração econômica, política, cultural e informacional em escala mundial, intensificado a partir dos anos 1980-90. O neoliberalismo é a doutrina que defende a redução do Estado, a privatização, a abertura comercial e a desregulamentação. Críticos apontam o aumento das desigualdades e a perda de soberania; defensores alegam eficiência e inovação. Autores como Milton Santos analisaram a globalização como perversa e desigual.",["Globalização: integração mundial","Neoliberalismo: Estado mínimo, privatização, abertura","Milton Santos: globalização perversa","Críticas: desigualdade e perda de soberania"],"Milton Santos: 'globalização como fábula, perversidade e possibilidade'. Não confunda globalização (processo) com neoliberalismo (doutrina). Palavras-chave: fluxos, redes, desigualdade.","O geógrafo Milton Santos afirmou que a globalização, tal como praticada, é perversa: amplia fluxos e conexões, mas concentra riqueza e exclui grandes parcelas da população mundial.","A posição de Milton Santos sobre a globalização:",["celebra a globalização como processo homogêneo e benéfico a todos.","considera a globalização um processo apenas cultural, sem dimensão econômica.","critica a globalização real como perversa e desigual, ainda que reconheça suas potencialidades.","defende a extinção de qualquer troca internacional.","ignora os efeitos sociais da globalização."],2,"Milton Santos critica a globalização real por sua perversidade e desigualdade, sem deixar de reconhecer potencialidades. As demais alternativas distorcem sua posição."],
"Sociedade de consumo e publicidade":["Sociedade de consumo é aquela em que o consumo, mais do que satisfação de necessidades, é organizado como marca de status e identidade. A publicidade atua como mediadora, criando desejos e vinculando mercadorias a estilos de vida. Autores como Jean Baudrillard analisam o consumo como sistema de signos, e Zygmunt Bauman discute a 'modernidade líquida', em que identidades são construídas também pelo consumo.",["Consumo como marca de status","Baudrillard: consumo como sistema de signos","Bauman: modernidade líquida e identidade","Publicidade: produção de desejos"],"Consumir não é apenas satisfazer necessidade: é também produzir identidade e pertencimento. Palavra-chave: signo. Não moralize o consumo; analise-o sociologicamente.","Campanhas publicitárias associam produtos a estilos de vida, valores e pertencimentos (juventude, sucesso, sustentabilidade). Pesquisadores observam que o consumo de determinados bens funciona como marcador de identidade e status.","A análise sociológica desse fenômeno destaca que:",["o consumo satisfaz apenas necessidades biológicas.","o consumo é apenas questão econômica, sem dimensão simbólica.","o consumo funciona também como sistema de signos, marcando identidades e posições sociais, mediado pela publicidade.","a publicidade não influencia escolhas de consumo.","o consumo não se relaciona com identidade."],2,"Baudrillard e outros autores mostram que o consumo funciona como sistema de signos, articulando identidade e status. As demais alternativas reduzem o consumo a mera satisfação material ou negam seu caráter simbólico."],
"Sociologia do Desenvolvimento":["A Sociologia do Desenvolvimento analisa os processos de mudança social, econômica e política em sociedades, incluindo temas como subdesenvolvimento, dependência, modernização e desigualdades globais. Autores como Celso Furtado, Fernando Henrique Cardoso e Enzo Faletto são referências. O desenvolvimento é medido não só pelo PIB, mas por indicadores sociais.",["Subdesenvolvimento e dependência","Modernização e desenvolvimento desigual","Celso Furtado: subdesenvolvimento","FHC e Faletto: dependência associada"],"Diferencie crescimento econômico de desenvolvimento social. O desenvolvimento envolve distribuição de renda e qualidade de vida. Palavras-chave: dependência, subdesenvolvimento.","Um país apresentou crescimento do PIB, mas a concentração de renda e a pobreza permaneceram altas, e os indicadores de educação e saúde não melhoraram.","A situação descrita indica que:",["houve desenvolvimento social pleno.","o crescimento econômico não se traduziu automaticamente em desenvolvimento social, que exige distribuição e bem-estar.","o PIB é a única medida de desenvolvimento.","a desigualdade não importa.","o desenvolvimento é impossível."],1,"Desenvolvimento social vai além do PIB. As outras alternativas confundem crescimento com desenvolvimento ou negam a importância da distribuição."],
"Sociologia das Migrações":["A Sociologia das Migrações estuda os deslocamentos populacionais, suas causas e consequências sociais, econômicas e culturais. Temas como migração interna, imigração, refúgio, xenofobia e integração social são centrais. Autores como Abdelmalek Sayad discutem a migração como fato social total.",["Migração voluntária e forçada","Refúgio e xenofobia","Integração e diáspora","Sayad: migração como fato social total"],"Migração pode ser voluntária ou forçada. Não confunda migrante com refugiado. Palavras-chave: xenofobia, integração.","Conflitos e crises econômicas levaram ao aumento de fluxos migratórios para o Brasil, com desafios de integração e episódios de xenofobia contra imigrantes e refugiados.","A análise sociológica das migrações deve considerar:",["que o migrante é sempre uma ameaça.","que as migrações são fenômenos sociais complexos, com causas estruturais e impactos na sociedade receptora.","que a migração é um problema individual.","que não há relação com a economia global.","que a cultura local não se transforma."],1,"As migrações são fenômenos sociais complexos. As outras alternativas estigmatizam ou simplificam."],
"Mudança Social":["Mudança social é a transformação das estruturas, instituições e padrões culturais de uma sociedade ao longo do tempo. Pode ser gradual ou revolucionária, e resulta de fatores como inovações tecnológicas, conflitos sociais, movimentos políticos e transformações econômicas. Durkheim analisou a mudança da solidariedade mecânica para a orgânica; Marx, a mudança pelo conflito de classes; Weber, pela racionalização.",["Mudança social: transformação de estruturas e instituições","Gradual ou revolucionária","Fatores: tecnologia, conflitos, movimentos","Durkheim, Marx e Weber: diferentes teorias da mudança"],"Não confunda mudança social com mudança individual. A primeira é estrutural, afeta a sociedade como um todo. Palavras-chave: transformação, estrutura.","Ao longo das três últimas décadas, houve uma explosão de movimentos sociais pelo mundo, questionando estruturas de poder e propondo novas formas de organização social.","A análise sociológica da mudança social deve considerar que:",["a sociedade é estática e imutável.","a mudança social resulta de fatores diversos, como movimentos sociais, inovações e conflitos, e transforma estruturas e instituições.","a mudança social é sempre pacífica.","a mudança social não afeta as instituições.","a mudança social é um fenômeno individual."],1,"A mudança social é estrutural e multifatorial. As demais alternativas negam a dinâmica social ou reduzem a mudança a um único aspecto."],
"Urbanização e êxodo rural":["Urbanização é o crescimento da população urbana em relação à rural, acompanhado de transformações no território, na economia e nos modos de vida. No Brasil, acelerou-se a partir dos anos 1930-50, com o êxodo rural e a industrialização. Gerou metropolização, periferização, favelização e problemas de mobilidade, moradia e saneamento. Autores como Milton Santos e Ermínia Maricato analisam a urbanização desigual brasileira.",["Urbanização acelerada: anos 1930-50","Êxodo rural e industrialização","Periferização e favelização","Maricato: cidade informal e desigual"],"Urbanização não é sinônimo de desenvolvimento: pode produzir periferias e segregação socioespacial. Palavras-chave: periferização, segregação, moradia.","No Brasil, entre 1940 e 1980, a população urbana passou de cerca de 30% para mais de 65% do total, num movimento acelerado de êxodo rural e industrialização. Nesse processo, cresceram as periferias e as favelas.","A urbanização brasileira descrita caracteriza-se:",["como um processo homogêneo, com distribuição equitativa de infraestrutura.","como um processo acelerado, mas desigual, gerando periferização, favelização e segregação socioespacial.","por ocorrer sem relação com a industrialização.","por ter ocorrido no século XIX, com a vinda da família real.","por não ter produzido impactos territoriais."],1,"A urbanização brasileira foi acelerada e desigual, com periferização e segregação. As demais alternativas distorcem o período, negam a relação com a industrialização ou minimizam os impactos."],
"Questão agrária e conflitos socioambientais":["A questão agrária brasileira envolve a concentração histórica da terra, os conflitos por sua posse e as lutas de trabalhadores rurais, indígenas e quilombolas. Os conflitos socioambientais surgem do choque entre modelos de desenvolvimento (agronegócio, mineração, grandes obras) e modos de vida tradicionais. A Comissão Pastoral da Terra registra anualmente episódios de violência no campo.",["Concentração histórica da terra","Conflitos: MST, indígenas, quilombolas","Agronegócio x modos de vida tradicionais","CPT: registros de violência no campo"],"Não oponha 'agronegócio' e 'agricultura familiar' de forma simplista: há diversidade de atores. Palavras-chave: território, conflito, modelo de desenvolvimento.","A Comissão Pastoral da Terra (CPT) registra anualmente conflitos por terra e água no Brasil. Em um levantamento hipotético, povos indígenas, comunidades quilombolas e pequenos agricultores relatam ameaças ligadas ao avanço de projetos de mineração e do agronegócio.","A situação descrita exemplifica:",["conflitos socioambientais, marcados pela tensão entre modelos de desenvolvimento e modos de vida tradicionais.","a inexistência de conflitos no campo brasileiro.","a harmonia entre todos os atores rurais no Brasil.","um problema exclusivamente urbano.","um conflito restrito a questões econômicas, sem dimensão territorial ou cultural."],0,"A tensão entre grandes projetos e modos de vida tradicionais é a marca dos conflitos socioambientais. As alternativas B e C negam o fenômeno; a D desloca indevidamente o problema; a E reducionismo."],
"Sociologia Urbana":["A Sociologia Urbana estuda as relações sociais, os conflitos e as dinâmicas de poder que se desenvolvem no espaço das cidades. Temas como segregação socioespacial, periferização, mobilidade urbana, direito à cidade e violência são centrais. Autores como Henri Lefebvre, Manuel Castells e Milton Santos contribuem para o debate.",["Segregação socioespacial","Periferização e favelização","Direito à cidade (Lefebvre)","Urbanização desigual"],"Não confunda urbanização (processo) com crescimento urbano. Palavras-chave: periferia, favela, mobilidade, segregação.","Em uma metrópole brasileira, pesquisadores mapearam que a população de baixa renda se concentra nas periferias, distantes dos empregos e dos serviços públicos, enquanto os bairros centrais são ocupados por camadas de alta renda.","A situação descrita exemplifica qual conceito sociológico?",["Mobilidade social ascendente.","Segregação socioespacial.","Etnocentrismo.","Indústria cultural.","Anomia."],1,"A segregação socioespacial é a distribuição desigual dos grupos sociais no espaço urbano, com concentração de pobres nas periferias. A alternativa A trata de mobilidade entre estratos; C é julgamento cultural; D é produção cultural; E é ausência de normas."],
"Sociologia Rural":["A Sociologia Rural analisa as relações sociais, econômicas e culturais no campo, incluindo a questão agrária, o campesinato, os conflitos por terra e as transformações recentes no campo brasileiro. Temas como agronegócio, agricultura familiar, reforma agrária e êxodo rural são centrais. Autores como José de Souza Martins discutem a sociologia rural no Brasil.",["Questão agrária e campesinato","Agricultura familiar x agronegócio","Reforma agrária e conflitos","José de Souza Martins: sociologia rural"],"Diferencie agricultura familiar de agronegócio. Palavras-chave: terra, conflito, MST. Não oponha de forma simplista.","Dados hipotéticos mostram que, no Brasil, os estabelecimentos de agricultura familiar ocupam cerca de 24% da área, mas respondem por 70% dos alimentos consumidos no país.","A análise sociológica da questão agrária brasileira deve considerar que:",["a agricultura familiar é irrelevante para a segurança alimentar.","a concentração de terras é um problema histórico, e a agricultura familiar tem papel central na produção de alimentos.","o agronegócio é o único modelo viável no campo.","não há conflitos por terra no Brasil.","o êxodo rural não afetou a estrutura agrária."],1,"A agricultura familiar é fundamental para a alimentação, e a concentração de terras é histórica. A alternativa A nega os dados; C absolutiza o agronegócio; D e E ignoram a realidade."],
"Patriarcado e feminismo":["Patriarcado é o sistema social que organiza o poder em torno da autoridade masculina, moldando relações de gênero na família, no trabalho, na política e na cultura. O conceito foi desenvolvido por autoras como Carole Pateman e Heleieth Saffioti. O feminismo, como movimento e teoria, busca superar o patriarcado e conquistar igualdade de gênero, com pautas historicamente ampliadas.",["Patriarcado: autoridade masculina estrutural","Saffioti e Pateman: patriarcado e contrato sexual","Feminismo: teoria e movimento","Gênero: construção social, distinto de sexo"],"Sexo (biológico) ≠ gênero (construção social). Patriarcado é estrutura, não 'homens individuais'. Evite generalizações. Palavras-chave: estrutura, poder, gênero.","A socióloga Heleieth Saffioti mostrou como o patriarcado molda relações sociais no Brasil, articulando-se com classe e raça. O conceito não se refere a homens individuais, mas a uma estrutura que organiza o poder e as expectativas de gênero.","Sobre o conceito de patriarcado, é correto afirmar:",["refere-se a um conjunto de homens específicos, sem dimensão estrutural.","designa uma estrutura social de poder que organiza as relações de gênero, articulando-se com classe e raça.","é sinônimo de sexo biológico.","diz respeito apenas à esfera doméstica, sem relação com o trabalho ou a política.","foi refutado por todas as correntes sociológicas."],1,"Patriarcado é estrutura social, não conjunto de indivíduos, e articula-se com outros marcadores. A alternativa A personaliza o conceito; a C confunde com sexo; a D restringe à casa; a E é empiricamente falsa."],
"Racismo estrutural":["Racismo estrutural é a ideia de que o racismo não se limita a atos individuais, mas se reproduz nas instituições, normas e práticas sociais, gerando desigualdades persistentes. Autores como Silvio Almeida, Kabengele Munanga e Sueli Carneiro discutem o conceito no Brasil. Ele se distingue do preconceito (opinião) e da discriminação (ato); o racismo estrutural molda acesso a emprego, moradia, justiça e educação.",["Racismo estrutural: dimensão institucional e social","Preconceito (opinião), discriminação (ato), racismo (estrutura)","Almeida, Munanga, Carneiro","Desigualdades persistentes por raça"],"Diferencie preconceito, discriminação e racismo. Racismo estrutural não é 'só ato individual'. Palavras-chave: instituições, estrutura, desigualdades.","Uma pesquisa hipotética mostrou que, em uma mesma cidade, pessoas negras têm menor acesso a crédito, maior taxa de desemprego e pior atendimento em serviços públicos do que pessoas brancas com perfil socioeconômico equivalente.","Esse resultado indica:",["ausência de racismo no Brasil.","racismo estrutural, que se reproduz em instituições e práticas sociais, gerando desigualdades persistentes.","fenômeno exclusivamente individual, sem dimensão institucional.","problema apenas econômico, sem relação com raça.","igualdade racial plena no país."],1,"Desigualdades persistentes mesmo com perfil socioeconômico equivalente indicam racismo estrutural. A alternativa A e a E negam o fenômeno; a C reduz a atos individuais; a D negligencia a raça."],
"Questões indígenas e LGBTQIA+":["As questões indígenas envolvem território, autodeterminação, línguas, culturas e direitos reconhecidos na Constituição de 1988 (art. 231), além da luta contra o genocídio e a violência no campo. A população LGBTQIA+ enfrenta estigma, violência e discriminação, e luta por reconhecimento, igualdade e políticas públicas. Autores como Jaider Esbell, Ailton Krenak, Judith Butler e Guacira Lopes Louro contribuem para o debate.",["Território e autodeterminação indígena","Art. 231 da CF/1988","LGBTQIA+: reconhecimento, igualdade, violência","Krenak, Butler, Louro"],"Não trate povos indígenas no singular nem LGBTQIA+ como bloco homogêneo. Palavras-chave: reconhecimento, diversidade, direitos.","Movimentos indígenas e LGBTQIA+ no Brasil têm pautas específicas: os primeiros lutam pela demarcação de territórios e pelo direito à autodeterminação; os segundos, pelo reconhecimento de identidades, combate à violência e igualdade de direitos.","Sobre esses movimentos, é correto afirmar:",["ambos defendem pautas idênticas às dos movimentos ambientalistas.","tratam-se de movimentos homogêneos, sem diversidade interna.","são movimentos com pautas próprias — territoriais e culturais no caso indígena; reconhecimento e igualdade no caso LGBTQIA+ — e com diversidade interna.","não têm relação com direitos reconhecidos na Constituição.","são fenômenos exclusivos do século XIX."],2,"Ambos têm pautas próprias e diversidade interna, relacionadas a direitos previstos constitucionalmente. A alternativa A ignora especificidades; a B ignora a diversidade; a D nega a base constitucional; a E desloca o período histórico."],
"Interseccionalidade: gênero, raça e classe":["Interseccionalidade é o conceito formulado por Kimberlé Crenshaw para analisar como diferentes marcadores sociais — gênero, raça, classe, sexualidade — se articulam e produzem experiências específicas de opressão. Não se trata de somar opressões, mas de compreender como elas se entrelaçam. No Brasil, Lélia Gonzalez e Sueli Carneiro antecedem e desenvolvem essa perspectiva.",["Crenshaw: interseccionalidade","Articulação de gênero, raça e classe","Não é soma de opressões","Lélia Gonzalez e Sueli Carneiro no Brasil"],"Não confunda interseccionalidade com 'soma de opressões'. É articulação. Palavra-chave: marcadores sociais.","Uma mulher negra e pobre enfrenta barreiras no mercado de trabalho que não se explicam apenas pelo gênero, apenas pela raça ou apenas pela classe, mas pela combinação desses fatores.","A análise sociológica desse fenômeno destaca:",["que as opressões são independentes e não se articulam.","a interseccionalidade, que analisa como gênero, raça e classe se entrelaçam produzindo experiências específicas de opressão.","que apenas a classe explica a situação.","que o racismo não tem relação com gênero.","que a mulher negra não sofre opressões específicas."],1,"A interseccionalidade analisa a articulação de marcadores. As outras alternativas isolam ou negam a articulação."],
"Controle social e desvio":["Controle social é o conjunto de mecanismos pelos quais a sociedade busca conformar os indivíduos às normas: informal (família, escola, religião) e formal (leis, polícia, justiça). Desvio é a conduta que viola normas sociais relevantes; não é sinônimo de crime, pois depende do contexto. Durkheim mostrou que o desvio pode ter função social (reafirma normas); Becker, na teoria do etiquetamento, mostrou que o desvio também depende de quem é rotulado.",["Controle social: informal x formal","Desvio: violação de normas sociais","Durkheim: função social do desvio","Becker: etiquetamento e rotulação"],"Desvio ≠ crime. Comportamentos desviantes podem ser legais ou ilegais. Palavras-chave: normas, rotulação, contexto.","Dois adolescentes praticam o mesmo ato: picham um muro. Um deles, de família de classe média, é encaminhado a medidas socioeducativas leves; o outro, morador de periferia, tem registro criminal formal e responde a processo mais severo.","A teoria sociológica que melhor explica essa diferença é:",["a do controle social formal, que trata todos igualmente.","a teoria do etiquetamento (Becker), que analisa como a rotulação social diferencia a aplicação de sanções.","a teoria do determinismo biológico.","a teoria do funcionalismo de Durkheim, que nega o desvio.","a teoria do materialismo histórico, aplicada apenas ao trabalho."],1,"Becker mostra que o desvio também depende de quem é rotulado e de como a sociedade reage. A alternativa A idealiza o controle formal; a C naturaliza a diferença; a D e a E deslocam a explicação do fenômeno."],
"Encarceramento em massa no Brasil":["O Brasil tem uma das maiores populações carcerárias do mundo, com forte sobre-representação de pessoas negras e de baixa renda. Sociólogos como Ana Luiza Pinheiro Flauzina, Michelle Alexander (nos EUA) e Loïc Wacquant discutem o encarceramento em massa como parte de um sistema que reproduz desigualdades raciais e sociais, em vez de apenas responder ao crime.",["Encarceramento em massa: números elevados","Sobre-representação de negros e pobres","Wacquant: Estado penal e desigualdade","Relação com racismo estrutural"],"Encarceramento em massa não é sinônimo de mais segurança: está ligado a seletividade penal e a marcadores de raça e classe. Palavra-chave: seletividade.","Segundo dados públicos (SISDEPEN/2023), o Brasil tem mais de 800 mil pessoas privadas de liberdade. A maioria é negra e tem baixa escolaridade. Pesquisadores apontam seletividade penal e relação com racismo estrutural.","A análise sociológica do encarceramento em massa no Brasil destaca:",["a neutralidade racial e social do sistema penal.","a seletividade penal, com sobre-representação de pessoas negras e pobres, articulada ao racismo estrutural.","a inexistência de dados sobre o tema.","a relação exclusiva com fatores econômicos globais.","a ausência de consequências sociais do encarceramento."],1,"Os dados e a literatura apontam seletividade penal e vínculo com racismo estrutural. A alternativa A nega essa seletividade; a C desinforma; a D reduz a um fator único; a E ignora os efeitos sociais."],
"Violência simbólica e de gênero":["Violência simbólica é a forma de violência que se exerce por meio de normas, valores, discursos e práticas que naturalizam desigualdades e fazem com que os dominados as percebam como legítimas. Pierre Bourdieu desenvolveu o conceito. A violência de gênero é a violência dirigida a pessoas em razão de seu gênero, incluindo a doméstica (Lei Maria da Penha, 2006) e o feminicídio (Lei do Feminicídio, 2015).",["Violência simbólica: Bourdieu","Naturalização das desigualdades","Lei Maria da Penha (2006)","Lei do Feminicídio (2015)"],"Violência simbólica não é menos grave: ela legitima outras violências. Não confunda com violência física. Palavras-chave: naturalização, legitimação.","Pesquisas mostram que piadas que ridicularizam mulheres, negros ou LGBTs, embora pareçam inofensivas, reforçam estereótipos e naturalizam desigualdades, abrindo caminho para violências mais graves.","A análise sociológica desse fenômeno destaca:",["que piadas não têm consequências sociais.","a violência simbólica, que naturaliza desigualdades e legitima outras formas de violência.","que a violência é apenas física.","que o humor é sempre inofensivo.","que a violência de gênero não existe no Brasil."],1,"Bourdieu mostra que a violência simbólica naturaliza desigualdades. As outras alternativas minimizam ou negam o conceito."],
"Cibercultura e redes sociais":["Cibercultura é o conjunto de práticas, valores e formas de sociabilidade que emergem com as tecnologias digitais (Castells, Lévy). As redes sociais transformaram modos de comunicação, ativismo e construção de identidades, ao mesmo tempo que produziram problemas como vigilância, desinformação e polarização. A internet não é neutra: reflete e amplia desigualdades existentes.",["Castells: sociedade em rede","Lévy: cibercultura e inteligência coletiva","Redes: comunicação, ativismo e identidade","Internet não é neutra"],"Não caia no extremo: redes sociais podem ampliar participação, mas também reproduzem desigualdades e desinformação. Palavras-chave: sociedade em rede, cibercultura.","As redes sociais têm sido usadas para mobilização política, denúncia de violências e construção de identidades coletivas. Ao mesmo tempo, pesquisadores observam que algoritmos, vigilância e desigualdades no acesso moldam quem participa e como.","A análise sociológica da cibercultura indica que as redes sociais:",["são esferas totalmente neutras e igualitárias.","ampliaram formas de comunicação e participação, mas não eliminam desigualdades e produzem novos problemas, como vigilância e desinformação.","não têm relação com a política.","substituíram completamente a vida offline.","não afetam a construção de identidades."],1,"A cibercultura amplia e complexifica sociabilidades, sem eliminar desigualdades nem eliminar a vida offline. As demais alternativas simplificam ou negam os fenômenos."],
"Fake news, algoritmos e bolhas digitais":["Fake news são informações falsas ou distorcidas disseminadas com aparência de notícia, frequentemente com motivação política ou econômica. Algoritmos de recomendação tendem a oferecer conteúdos alinhados ao perfil do usuário, criando bolhas (ou filtros-bolha) e câmaras de eco que reforçam convicções e dificultam o debate público. Autores como Eli Pariser discutem o filtro-bolha.",["Fake news: desinformação com aparência de notícia","Algoritmos de recomendação e personalização","Filtro-bolha (Pariser) e câmaras de eco","Impactos no debate público"],"'Bolha' não é sinônimo de 'notícia falsa': a primeira é efeito de algoritmos e escolhas; a segunda é conteúdo falso. Palavras-chave: filtro-bolha, câmara de eco.","Plataformas digitais utilizam algoritmos que personalizam o que cada usuário vê. Pesquisadores mostram que isso pode criar bolhas informacionais, em que cada um vê majoritariamente conteúdos com que já concorda, o que facilita a circulação de desinformação.","A análise sociológica desse cenário destaca:",["que algoritmos são neutros e ampliam o debate plural.","que a personalização algorítmica pode reforçar bolhas informacionais e câmaras de eco, dificultando o debate público e favorecendo a desinformação.","que fake news não existem.","que a internet eliminou a polarização política.","que todos os usuários têm acesso idêntico à informação."],1,"A personalização algorítmica tende a reforçar bolhas e câmaras de eco, favorecendo a desinformação. As demais alternativas idealizam o ambiente digital ou negam fenômenos documentados."],
"Sociologia da Comunicação":["A Sociologia da Comunicação analisa os meios de comunicação como instituições sociais, seu papel na formação de opinião, na cultura e no poder. Temas como indústria cultural, mídia e política, redes sociais e desinformação são centrais. Autores como Adorno, Horkheimer e Habermas discutem a comunicação e a esfera pública.",["Indústria cultural (Adorno e Horkheimer)","Mídia como poder","Esfera pública (Habermas)","Concentração midiática e pluralismo"],"A mídia não é neutra: reflete e reproduz relações de poder. Palavras-chave: indústria cultural, esfera pública, pluralismo.","Pesquisadores observam que a concentração de meios de comunicação nas mãos de poucos grupos empresariais limita o pluralismo de informações e influencia o debate público.","A análise sociológica desse cenário destaca:",["a mídia é totalmente neutra e plural.","a concentração midiática pode limitar o debate público e a diversidade de perspectivas.","a comunicação não tem relação com o poder.","o pluralismo é garantido pela internet.","a indústria cultural democratizou o acesso."],1,"A concentração midiática afeta o pluralismo. As outras alternativas idealizam ou negam a relação entre comunicação e poder."],
"Sociedade em rede (Castells)":["Manuel Castells, em 'A Sociedade em Rede', analisa como as tecnologias da informação transformaram a economia, o trabalho, a cultura e o poder, organizando a sociedade em redes globais. A sociedade em rede é marcada por fluxos de informação, flexibilidade e conectividade, mas também por desigualdades entre conectados e desconectados.",["Castells: sociedade em rede","Fluxos de informação e conectividade","Desigualdade entre conectados e desconectados","Transformações na economia, trabalho e poder"],"Não confunda sociedade em rede (conceito amplo) com redes sociais (plataformas). A obra de Castells antecede as redes sociais contemporâneas. Palavra-chave: fluxos.","Segundo Castells, a sociedade contemporânea se organiza em redes globais de informação, que conectam alguns e excluem outros, gerando novas formas de desigualdade.","A tese central de Castells sobre a sociedade em rede destaca:",["que a tecnologia é neutra e beneficia a todos igualmente.","que as redes globais de informação transformaram a economia e o poder, mas também produzem desigualdades entre conectados e desconectados.","que as redes sociais são a única forma de organização social.","que a sociedade em rede é homogênea.","que não há exclusão digital."],1,"Castells analisa as redes como estruturantes, com inclusões e exclusões. As outras alternativas idealizam ou negam a desigualdade."],
"Manipulação de dados e privacidade":["No ambiente digital, dados pessoais são coletados, processados e utilizados por empresas e governos para fins comerciais e políticos. A privacidade torna-se questão central, especialmente após escândalos como o caso Cambridge Analytica. A LGPD (Lei Geral de Proteção de Dados, 2018) regulamenta o tratamento de dados no Brasil. Autores como Shoshana Zuboff discutem o 'capitalismo de vigilância'.",["Coleta massiva de dados pessoais","Cambridge Analytica: uso político de dados","LGPD (2018): proteção de dados no Brasil","Zuboff: capitalismo de vigilância"],"Privacidade não é só 'não aparecer': é controle sobre os próprios dados. Não confunda com segredo. Palavras-chave: vigilância, LGPD, capitalismo de vigilância.","O escândalo Cambridge Analytica revelou que dados de milhões de usuários foram usados para direcionar propaganda política sem consentimento, evidenciando riscos à privacidade e à democracia.","A análise sociológica desse caso destaca:",["que a coleta de dados é neutra e benéfica.","que a manipulação de dados pessoais pode ameaçar a privacidade e a democracia, exigindo regulação (como a LGPD).","que a privacidade não importa na era digital.","que o caso não teve consequências.","que a tecnologia é sempre confiável."],1,"O caso evidencia riscos à privacidade e à democracia, justificando regulação. As outras alternativas minimizam ou negam o problema."],
"Inteligência Artificial e Sociedade":["A Inteligência Artificial (IA) transforma o trabalho, a comunicação e as relações sociais. Algoritmos já tomam decisões sobre crédito, emprego e segurança, muitas vezes reproduzindo vieses racistas e de gênero (racismo algorítmico). Autores como Shoshana Zuboff discutem o 'capitalismo de vigilância'. O ENEM cobra a relação entre IA, ética e desigualdades sociais.",["IA: transformação do trabalho e das relações sociais","Racismo algorítmico: vieses em decisões automatizadas","Capitalismo de vigilância (Zuboff)","Desafios éticos: privacidade, autonomia, desemprego"],"Não trate IA como neutra: ela reproduz vieses dos dados e das escolhas humanas. Palavras-chave: viés algorítmico, ética, automação.","A Unesco recomenda que empresas de IA tenham equipes diversas para combater preconceitos em algoritmos, que já demonstraram vieses racistas e de gênero em decisões de crédito e seleção de emprego.","A análise sociológica da IA deve considerar que:",["a tecnologia é sempre neutra e benéfica.","a IA pode reproduzir desigualdades e vieses, exigindo regulação e equipes diversas para evitar discriminação algorítmica.","os algoritmos não afetam decisões sociais.","a IA elimina todos os preconceitos.","não há relação entre IA e trabalho."],1,"A IA reproduz vieses e exige regulação. As demais alternativas idealizam a tecnologia ou negam seu impacto social."]
};

const startSim=n=>startQuiz(shuf(uniq(FLAT)).slice(0,n),"Simulado · "+(n>=99?"completo":n+" questões")),startMod=i=>startQuiz(shuf(SUB[i].map((x,j)=>({i,j,n:x.n}))),"Quiz · "+M[i].n);
function startRev(){const l=uniq(FLAT).filter(x=>S.wrong[x.n]);if(l.length)startQuiz(shuf(l),"Revisão dos erros")}
const redo=()=>startQuiz(shuf(Q.list.filter((x,k)=>!Q.ans[k].ok)),"Refazendo os erros"),nextQ=()=>{Q.k++;Q.sel=null;render()};
function vQ(){if(!Q){location.replace("#/sim");return null}if(Q.k>=Q.list.length)return vRes();const it=Q.list[Q.k];
return`<div class="bc a"><a href="#/sim">← Sair</a> · ${Q.title}</div><div class="qh a"><b>Questão ${Q.k+1} de ${Q.list.length}</b><span id="qs">✔ ${Q.score}</span><span id="qt">⏱ ${fmt(Math.floor((Date.now()-Q.t0)/1000))}</span></div>${bar(100*Q.k/Q.list.length)}<section class="bx a"><span class="bd ${SUB[it.i][it.j].l}">${M[it.i].n}</span><div id="qb">${qb(it.n,null,1)}</div></section><p class="mu">Atalhos: A–E responde · Enter ou → avança</p>`}
function vRes(){const n=Q.list.length,pc=Math.round(100*Q.score/n),by={};
if(!Q.saved){Q.saved=1;Q.sec=Math.floor((Date.now()-Q.t0)/1000);S.sims.unshift({d:Date.now(),t:Q.title,s:Q.score,n,sec:Q.sec});S.sims=S.sims.slice(0,15);sv()}
Q.ans.forEach((a,k)=>{const m=Q.list[k].i,o=by[m]||(by[m]={a:0,t:0});o.t++;if(a.ok)o.a++});const wr=n-Q.score;
return`<div class="res a">${ring(pc).replace('class="rg"','class="rg big"')}<h1>${pc>=70?"Mandou bem! 🎉":pc>=40?"Bom caminho! 💪":"Vale revisar! 📚"}</h1><p class="mu">${Q.score} de ${n} acertos em ${fmt(Q.sec)} · ${Q.title}</p><div class="row" style="justify-content:center">${wr?`<button class="bt" onclick="redo()">Refazer as ${wr} erradas</button>`:""}<a class="bt gh" href="#/sim">Novo simulado</a><a class="bt gh" href="#/st">Estatísticas</a></div></div><div class="bx a" style="--i:1"><h2>Resultado por módulo</h2>${Object.keys(by).map(m=>`<div class="mr hu" style="--h:${m*24}"><span>${IC[m]} ${M[m].n}</span>${bar(100*by[m].a/by[m].t)}<small>${by[m].a}/${by[m].t}</small></div>`).join("")}</div>`}
function vFc(s){const sc=s===undefined||s===""?-1:+s;if(!FC||FC.sc!=sc)FC={sc,k:0,f:0,list:uniq(FLAT.filter(x=>sc<0||x.i==sc))};
return`<h1 class="a">🃏 Flashcards de conceitos</h1><div class="chs a"><a class="ch${sc<0?" on":""}" href="#/fc">Todos</a>${M.map((m,i)=>`<a class="ch${sc==i?" on":""}" href="#/fc/${i}" title="${m.n}">${IC[i]}</a>`).join("")}</div><div id="fcx" class="a" style="--i:1">${fcHtml()}</div><div class="row fcb a" style="--i:2"><button class="bt gh" onclick="fcGo(-1)">←</button><button class="bt" onclick="flipFc()">Virar</button><button class="bt gh" onclick="fcGo(1)">→</button><button class="bt gh" onclick="fcShuf()">🔀 Embaralhar</button></div><p class="mu" style="text-align:center">Atalhos: ← → navega · Espaço vira o cartão</p>`}
function fcHtml(){const x=FC.list[FC.k],c=C[x.n];return`<div class="fcnt">${FC.k+1} / ${FC.list.length}</div><div class="fcw"><div class="fcard${FC.f?" flip":""}" onclick="flipFc()"><div class="face"><span class="bd ${x.l}">${M[x.i].n}</span><h2>${x.n}</h2><small class="mu">Toque para ver os conceitos-chave</small></div><div class="face bk2">${c?c[1].map(f=>`<code>${f}</code>`).join(""):"<i>sem conceitos</i>"}</div></div></div>`}
const fcGo=d=>{FC.k=(FC.k+d+FC.list.length)%FC.list.length;FC.f=0;q("#fcx").innerHTML=fcHtml()},flipFc=()=>{FC.f^=1;q(".fcard").classList.toggle("flip",!!FC.f)},fcShuf=()=>{FC.list=shuf(FC.list);FC.k=0;FC.f=0;q("#fcx").innerHTML=fcHtml()};
function vSt(){let A=0,E=0;Object.values(S.res).forEach(r=>{A+=r.a;E+=r.e});const T=A+E,cs=[["✅",doneN()+"/"+FLAT.length,"assuntos concluídos"],["🎯",T?Math.round(100*A/T)+"%":"—","de acerto"],["✔",A,"acertos"],["✘",E,"erros"],["⏱",fmt(S.t),"tempo de estudo"],["📝",S.sims.length,"simulados feitos"]];
return`<h1 class="a">📊 Estatísticas</h1><div class="g3">${cs.map((c,k)=>`<div class="bx stat a" style="--i:${k}"><span>${c[0]}</span><b>${c[1]}</b><small>${c[2]}</small></div>`).join("")}</div><h2 class="a">Acertos e erros por módulo</h2><div class="bx a">${M.map((m,i)=>{const s=ms(i);return`<div class="mr"><span>${IC[i]} ${m.n}</span><div class="sb"><i class="g1" data-w="${s.t?100*s.a/s.t:0}"></i><i class="e1" data-w="${s.t?100*s.e/s.t:0}"></i></div><small>${s.t?`${s.a} certas · ${s.e} erradas · ${s.p}%`:"—"}</small></div>`}).join("")}</div><h2 class="a">Últimos simulados</h2>${S.sims.length?`<div class="bx a">${S.sims.map(x=>`<div class="mr2"><span>${new Date(x.d).toLocaleDateString("pt-BR")} · ${x.t}</span><b>${x.s}/${x.n} (${Math.round(100*x.s/x.n)}%)</b><small>${fmt(x.sec)}</small></div>`).join("")}</div>`:`<p class="mu">Nenhum simulado ainda. Comece pela aba Simulado.</p>`}<button class="bt gh" onclick="rst()">Zerar estatísticas</button>`}
function rst(){if(confirm("Zerar acertos, erros, simulados e tempo de estudo? Progresso e favoritos continuam salvos.")){S.res={};S.wrong={};S.sims=[];S.t=0;sv();render()}}
function vRv(){const l=uniq(FLAT).filter(x=>S.wrong[x.n]);return`<h1 class="a">🔁 Revisão de erros</h1>`+(l.length?`<p class="a mu">Questões que você errou na última tentativa. Acertar de novo tira da lista.</p><div class="row a"><button class="bt" onclick="startRev()">▶ Refazer as ${l.length} erradas</button></div>`+l.map(row).join(""):`<div class="bx empty a">🎉<p>Nenhum erro pendente. Responda questões nos assuntos ou faça um simulado.</p><a class="bt" href="#/sim">Fazer simulado</a></div>`)}
function vFv(){const l=FLAT.filter(x=>S.fav[x.i+"."+x.j]);return`<h1 class="a">⭐ Favoritos</h1>`+(l.length?l.map(row).join(""):`<div class="bx empty a">⭐<p>Toque na estrela de um assunto para guardá-lo aqui.</p><a class="bt" href="#/">Ver assuntos</a></div>`)}
function vGl(){const t=nz((st.gl||"").trim());let h=`<h1 class="a">📚 Glossário sociológico</h1><div class="srch a"><input type="search" placeholder="Buscar conceito..." value="${st.gl||""}" oninput="st.gl=this.value;glr()" autocomplete="off"></div><div id="glx">`;
M.forEach((m,i)=>{const list=SUB[i].filter(x=>C[x.n]&&(!t||nz(x.n+" "+C[x.n][1].join(" ")).includes(t)));if(!list.length)return;h+=`<h2 class="a">${IC[i]} ${m.n}</h2>`;list.forEach(x=>{h+=`<div class="gl-item a"><b>${x.n}<button class="cp" onclick="cp(${i},'${x.n.replace(/'/g,"\\'")}')">copiar</button></b><p>${C[x.n][1].join(" · ")}</p></div>`})});
h+=`</div>`;return h}
function glr(){const t=nz((st.gl||"").trim());const el=q("#glx");if(!el)return;let h="";M.forEach((m,i)=>{const list=SUB[i].filter(x=>C[x.n]&&(!t||nz(x.n+" "+C[x.n][1].join(" ")).includes(t)));if(!list.length)return;h+=`<h2>${IC[i]} ${m.n}</h2>`;list.forEach(x=>{h+=`<div class="gl-item"><b>${x.n}<button class="cp" onclick="cp(${i},'${x.n.replace(/'/g,"\\'")}')">copiar</button></b><p>${C[x.n][1].join(" · ")}</p></div>`})});el.innerHTML=h||"<p class='mu'>Nada encontrado.</p>"}
function cp(i,n){const t=`${n} (${M[i].n}): ${C[n][1].join(" · ")}`;try{navigator.clipboard.writeText(t)}catch(e){}}
function vErr(){const arr=[
["Cultura não é erudição","No ENEM, 'cultura' significa todo conjunto de práticas, valores e significados de um grupo. Não confunda com escolaridade, com arte erudita ou com 'boa educação'."],
["Marx não é o 'pai da Sociologia'","A Sociologia nasce com Comte (positivismo) e se institucionaliza com Durkheim. Marx é um clássico fundamental, com o materialismo histórico."],
["Desigualdade não é só renda","Renda é uma dimensão. Desigualdade envolve acesso a educação, saúde, justiça, território, reconhecimento e poder."],
["Preconceito ≠ discriminação ≠ racismo","Preconceito é opinião; discriminação é ato; racismo estrutural é a reprodução institucional de desigualdades raciais."],
["Etnocentrismo ≠ relativismo cultural","Etnocentrismo julga a outra cultura pela própria. Relativismo cultural procura compreender cada cultura em seus próprios termos."],
["Sexo ≠ gênero","Sexo é categoria biológica; gênero é construção social e histórica das expectativas sobre masculinidades e feminilidades."],
["Patriarcado não é sinônimo de 'homens'","Patriarcado é estrutura social de poder; não se reduz a indivíduos nem a um grupo de homens específicos."],
["Cidadania formal ≠ cidadania real","Direito previsto em lei não garante acesso efetivo. Cidadania real depende de condições sociais, econômicas e territoriais."],
["Mais-valia não é o valor total produzido","Mais-valia é o valor produzido além do valor da força de trabalho, apropriado pelo capitalista."],
["Classe ≠ estamento ≠ casta","Classe: posição econômica com mobilidade. Estamento: honra e privilégio. Casta: fechada, hereditária, com base religiosa."],
["Indústria cultural ≠ cultura popular","Cultura popular nasce das classes populares; indústria cultural é a produção padronizada para o consumo de massa (Adorno e Horkheimer)."],
["Bolha digital ≠ fake news","Bolha é efeito da personalização algorítmica; fake news é conteúdo falso com aparência de notícia."],
["Não confunda ação social com ação em massa","Ação social (Weber) tem sentido e se orienta pela ação de outros; ação em massa é reação homogênea sem sentido compartilhado."],
["'Democracia racial' é mito criticado","Não é tese defendida pelos autores brasileiros contemporâneos: Florestan Fernandes e Darcy Ribeiro criticam esse mito."],
["Estado weberiano: monopólio legítimo da força","Não é 'uso da força' sem mais: é monopólio da violência legítima em um território — o que distingue o Estado de outras instituições."]];
return`<h1 class="a">⚠️ Erros mais comuns no ENEM</h1><p class="a mu">Pegadinhas clássicas da prova de Sociologia (Ciências Humanas). Leia com atenção e revise antes do simulado.</p>${arr.map((x,k)=>`<div class="bx a" style="--i:${k%12}"><h2>${x[0]}</h2><p>${x[1]}</p></div>`).join("")}`}
function vMapa(){const nodes=[
[0,"Senso comum","s/6/1"],[1,"Sociologia como ciência","s/6/0"],[2,"Método e pesquisa","s/6/2"],
[3,"Clássicos (Durkheim · Weber · Marx)","m/7"],[4,"Conceitos aplicados","m/0"],
[5,"Cultura e diversidade","s/0/0"],[6,"Trabalho e classes","s/1/0"],[7,"Desigualdade","s/2/0"],
[8,"Poder e Estado","s/3/0"],[9,"Movimentos sociais","s/4/0"],[10,"Sociologia brasileira","m/8"],
[11,"Instituições","m/9"],[12,"Globalização e consumo","m/10"],[13,"Território e ambiente","m/11"],
[14,"Gênero, raça e sexualidade","m/12"],[15,"Violência e controle","m/13"],[16,"Tecnologia e redes","m/14"]];
return`<h1 class="a">🗺️ Mapa de conexões</h1><p class="a mu">Trilha sugerida de estudos: comece pelos fundamentos e avance para os temas aplicados. Toque em um nó para ir ao assunto.</p><div class="mapa a"><div class="trilha">${nodes.map(n=>`<span class="node" onclick="go('${n[2]}')">${n[1]}</span>`).join('<span class="seta">→</span>')}</div><p class="mu" style="margin-top:14px;font-size:13px">Comece pelos fundamentos (senso comum → ciência → método → clássicos) e siga pelos temas aplicados (cultura, trabalho, desigualdade, poder...). Os clássicos fundamentam todo o restante.</p></div>`}
function render(){const p=location.hash.replace(/^#\/?/,"").split("/"),v=p[0];view=v;st.q=null;st.gl=st.gl||"";let o;
if(v=="m")o=vMod(+p[1]);else if(v=="s"){cur={i:+p[1],j:+p[2]};o=vSub(cur.i,cur.j)}else if(v=="sim")o=vSim();else if(v=="q")o=vQ();else if(v=="fc")o=vFc(p[1]);else if(v=="st")o=vSt();else if(v=="rv")o=vRv();else if(v=="fv")o=vFv();else if(v=="gl")o=vGl();else if(v=="err")o=vErr();else if(v=="mapa")o=vMapa();else{view="";o=vHome()}
if(o==null)return;q("#app").innerHTML=o;bars();const act=["m","s",""].includes(view)?"":(view=="q"?"sim":view);document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r==act));scrollTo(0,0)}
function th(){const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches;S.theme=dark?"light":"dark";d.dataset.theme=S.theme;sv()}
if(S.theme)document.documentElement.dataset.theme=S.theme;
const tick=()=>{const e=q("#tm");if(e)e.textContent=(run?"⏸ ":"⏱ ")+fmt(S.t);const t=q("#qt");if(t&&Q&&Q.k<Q.list.length)t.textContent="⏱ "+fmt(Math.floor((Date.now()-Q.t0)/1000))};
function tmT(){run=!run;tick()}
setInterval(()=>{if(run){S.t++;if(S.t%5==0)sv()}tick()},1000);
addEventListener("keydown",e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){if(e.key=="Escape")e.target.blur();return}if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;
if(k=="/"){const s=q("#sq")||q(".srch input");if(s){e.preventDefault();s.focus()}return}
const oi=k.length==1&&"abcde".includes(k.toLowerCase())?"abcde".indexOf(k.toLowerCase()):"12345".indexOf(k);
if((view=="s"||view=="q")&&oi>=0&&k.length==1){pick(oi);return}
if(k=="ArrowRight"){if(view=="s")navS(1);else if(view=="q"&&Q&&Q.sel!=null)nextQ();else if(view=="fc")fcGo(1)}
else if(k=="ArrowLeft"){if(view=="s")navS(-1);else if(view=="fc")fcGo(-1)}
else if(k==" "&&view=="fc"){e.preventDefault();flipFc()}
else if(k=="Enter"&&view=="q"&&Q&&Q.sel!=null)nextQ();
else if(k=="Escape"&&view!="")go("")});
addEventListener("pagehide",sv);addEventListener("hashchange",render);render();tick();
</script></body></html>
