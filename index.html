"Sociologia rural":["A Sociologia rural estuda as relações sociais no campo, incluindo agricultura familiar, agronegócio, reforma agrária e conflitos. Analisa transformações do mundo rural com modernização e êxodo rural.",["Relações sociais no campo","Agricultura familiar e agronegócio","Transformações e conflitos"],"Não confunda Sociologia rural com agronomia.","As relações de trabalho no campo são objetos de estudo da:",["Sociologia urbana","Sociologia rural","Sociologia do trabalho","Sociologia da educação","Sociologia da religião"],1,"Sociologia rural estuda relações sociais no campo."],
"Reforma agrária":["Reforma agrária é a redistribuição de terras para trabalhadores rurais sem terra, com objetivo de reduzir a concentração fundiária e promover justiça social. No Brasil, é pauta histórica do MST.",["Redistribuição de terras","Redução da concentração","Pauta do MST"],"Reforma agrária é política social, não desapropriação por utilidade pública.","A distribuição de terras para famílias de trabalhadores rurais é política de:",["Reforma urbana","Reforma agrária","Reforma tributária","Reforma política","Reforma educacional"],1,"Reforma agrária é redistribuição de terras."],
"Agricultura familiar e agronegócio":["Agricultura familiar é produzida por pequenos proprietários, com mão de obra familiar, e é responsável por grande parte dos alimentos consumidos no Brasil. O agronegócio é produção em larga escala, voltada para exportação.",["Familiar: pequena escala, alimentos","Agronegócio: larga escala, exportação","Lógicas distintas"],"Não confunda agricultura familiar com atraso.","A agricultura familiar produz a maior parte dos alimentos, enquanto o agronegócio domina as exportações.","Isso mostra:",["Uma única lógica agrícola","Duas lógicas distintas","Superioridade do agronegócio","Insignificância da agricultura familiar","Ausência de conflitos"],1,"Duas lógicas distintas."],
"Conflitos no campo":["Os conflitos no campo envolvem disputas por terra entre trabalhadores rurais, indígenas, quilombolas, pequenos agricultores e grandes proprietários. São marcados por violência e impunidade. A CPT documenta esses conflitos.",["Disputas por terra","Violência e impunidade","CPT documenta"],"Conflitos são disputas sociais, não crimes isolados.","Disputas entre fazendeiros e comunidades tradicionais por território são exemplos de:",["Conflitos urbanos","Conflitos no campo","Conflitos religiosos","Conflitos étnicos","Conflitos ambientais"],1,"Conflitos no campo envolvem disputas por terra."],
/* ----- MÓDULO 17: Educação ----- */
"Educação e sociedade":["A educação é um processo social que transmite conhecimento, valores e normas. A escola é instituição central na socialização e na reprodução ou transformação das desigualdades. É direito social e instrumento de mobilidade.",["Processo social","Socialização e reprodução","Direito e mobilidade"],"Não confunda educação com escolarização.","A educação pode reproduzir desigualdades ou promover mobilidade.","Isso mostra que a educação é:",["Neutra","Ambivalente","Sempre transformadora","Sempre conservadora","Irrelevante"],1,"Educação tem efeitos ambivalentes."],
"Desigualdade educacional":["A desigualdade educacional é a diferença de acesso e qualidade da educação entre grupos sociais. Reproduz desigualdades de classe, raça e região. A escola pública de qualidade é política de redução.",["Acesso e qualidade desiguais","Reproduz desigualdades","Escola pública como política"],"Ter escola não garante educação de qualidade.","Escolas de bairros ricos têm mais recursos, enquanto escolas de periferias enfrentam falta de infraestrutura.","Isso caracteriza:",["Igualdade educacional","Desigualdade educacional","Meritocracia","Mobilidade social","Inclusão digital"],1,"Desigualdade educacional é diferença de acesso e qualidade."],
"Paulo Freire e a educação libertadora":["Paulo Freire é educador brasileiro que propôs educação libertadora, baseada no diálogo e conscientização. Criticou a educação bancária, em que o aluno é passivo. Sua obra 'Pedagogia do Oprimido' é referência mundial.",["Educação libertadora","Diálogo e conscientização","Crítica à educação bancária"],"Educação bancária é passiva; tradicional pode ser ativa.","Paulo Freire criticou a educação que trata o aluno como depósito de conteúdo.","Essa crítica está em:",["Pedagogia do Oprimido","Casa-Grande & Senzala","Raízes do Brasil","O Povo Brasileiro","A Integração do Negro"],0,"Pedagogia do Oprimido é a obra de Paulo Freire."],
"Função social da escola":["A escola tem funções sociais: socializar, transmitir conhecimento, preparar para o trabalho e formar cidadãos. Pode reproduzir desigualdades ou promover transformação.",["Socialização e conhecimento","Preparação e cidadania","Reprodução ou transformação"],"Não reduza a escola à preparação para o trabalho.","A escola socializa, transmite conhecimento e prepara para o trabalho e a cidadania.","Essas são:",["Funções econômicas","Funções sociais da escola","Funções familiares","Funções religiosas","Funções midiáticas"],1,"Funções sociais da escola."],
"Currículo e ideologia":["O currículo escolar é uma seleção de conhecimentos e valores que reflete relações de poder. Pode ser inclusivo ou excludente, valorizando ou silenciando culturas. A Lei 10.639 torna obrigatório o ensino de história afro-brasileira.",["Seleção de conhecimentos","Reflete relações de poder","Lei 10.639"],"O currículo não é neutro.","A inclusão de história afro-brasileira nos currículos é política de:",["Neutralidade curricular","Valorização da diversidade","Exclusão cultural","Homogeneização","Padronização"],1,"A Lei 10.639 valoriza a diversidade."],
"Educação e mobilidade social":["A educação é um dos principais canais de mobilidade social, permitindo que indivíduos de origem pobre ascendam. No entanto, a desigualdade educacional limita essa mobilidade. Políticas de inclusão, como cotas, buscam ampliar o acesso.",["Canal de mobilidade","Limitada pela desigualdade","Cotas como política"],"Mobilidade é individual; igualdade é coletiva.","A educação pode promover mobilidade, mas a desigualdade de acesso limita esse potencial.","Isso mostra relação entre:",["Educação e mobilidade","Educação e religião","Educação e esporte","Educação e mídia","Educação e arte"],0,"Educação e mobilidade social estão relacionadas."],
"Educação inclusiva":["A educação inclusiva garante acesso e permanência de todos os alunos, independentemente de deficiência, origem, raça ou gênero. Envolve adaptações curriculares, formação de professores e combate ao preconceito.",["Acesso e permanência","Adaptações e combate ao preconceito","Direito constitucional"],"Inclusão transforma a escola; integração exige que o aluno se adapte.","A escola que adapta seu currículo e espaço para receber alunos com deficiência pratica:",["Exclusão","Integração","Inclusão","Segregação","Padronização"],2,"Inclusão transforma a escola para atender a todos."],
/* ----- MÓDULO 18: Religião ----- */
"Religião e sociedade":["A religião é instituição social que oferece sentido, coesão e normas morais. Durkheim via a religião como expressão da sociedade; Weber analisou sua influência econômica; Marx a criticou como alienação.",["Sentido e coesão","Durkheim: expressão social","Weber: influência econômica"],"Não confunda religião com igreja.","A religião pode ser analisada como expressão social, influência econômica ou alienação.","Essas análises mostram que a religião é:",["Apenas espiritual","Fenômeno social","Irrelevante","Individual","Natural"],1,"Religião é fenômeno social."],
"Secularização":["Secularização é o processo de separação entre religião e outras esferas sociais, como Estado, educação e ciência. Na modernidade, a religião perde centralidade na vida pública. No Brasil, a laicidade do Estado é garantida pela Constituição.",["Separação religião e esferas","Perda de centralidade","Laicidade do Estado"],"Secularização é processo social; ateísmo é posição individual.","O Estado brasileiro é laico e garante liberdade religiosa.","Isso é exemplo de:",["Fundamentalismo","Secularização","Teocracia","Intolerância","Dogmatismo"],1,"Secularização é separação entre religião e Estado."],
"Fundamentalismo religioso":["Fundamentalismo religioso é a interpretação literal dos textos sagrados e a defesa de sua aplicação na vida social e política. Pode gerar intolerância e conflitos. Não é exclusivo de uma religião.",["Interpretação literal","Aplicação na vida social","Intolerância e conflitos"],"Fé é crença; fundamentalismo é postura política.","Grupos que defendem aplicação literal de leis religiosas no Estado são:",["Seculares","Fundamentalistas","Laicos","Ateus","Agnósticos"],1,"Fundamentalismo defende aplicação literal de textos sagrados."],
"Diversidade religiosa no Brasil":["O Brasil é marcado pela diversidade religiosa: catolicismo, protestantismo, religiões afro-brasileiras, indígenas, espíritas. A Constituição garante liberdade religiosa. A intolerância religiosa ainda é desafio.",["Múltiplas religiões","Liberdade garantida","Intolerância persiste"],"Diversidade não é o mesmo que igualdade.","O Brasil tem uma das maiores diversidades religiosas do mundo.","Isso é exemplo de:",["Monoteísmo","Diversidade religiosa","Teocracia","Fundamentalismo","Ateísmo"],1,"Diversidade religiosa é coexistência de várias religiões."],
"Religião e política":["A relação entre religião e política é complexa. No Brasil, a bancada evangélica e grupos católicos influenciam decisões. A laicidade do Estado garante a separação, mas não impede a participação de religiosos na política.",["Influência de grupos religiosos","Laicidade do Estado","Participação política"],"Estado é laico, mas a sociedade é religiosa.","A atuação de bancadas religiosas no Congresso é exemplo de:",["Laicidade","Relação entre religião e política","Secularização","Ateísmo","Fundamentalismo"],1,"Relação entre religião e política."],
"Intolerância religiosa":["A intolerância religiosa é o desrespeito ou a violência contra práticas e crenças religiosas diferentes. No Brasil, religiões afro-brasileiras são as mais afetadas. A liberdade religiosa é direito constitucional.",["Desrespeito e violência","Afro-brasileiras mais afetadas","Direito constitucional"],"Crítica é argumentativa; intolerância é violenta.","Ataques a terreiros de candomblé e umbanda são exemplos de:",["Liberdade religiosa","Intolerância religiosa","Secularização","Diversidade religiosa","Laicidade"],1,"Intolerância religiosa é violência ou desrespeito."],
/* ----- MÓDULO 19: Comunicação ----- */
"Comunicação de massa":["A comunicação de massa é a produção e difusão de informações para grandes públicos, via TV, rádio e internet. Influencia opiniões, comportamentos e consumo.",["Grandes públicos","Influência na opinião","Concentração e fake news"],"Massa é para muitos; interpessoal é entre poucos.","A TV, o rádio e a internet difundem informações para milhões ao mesmo tempo.","Isso é:",["Comunicação interpessoal","Comunicação de massa","Comunicação organizacional","Comunicação científica","Comunicação política"],1,"Comunicação de massa é para grandes públicos."],
"Indústria cultural e mídia":["A indústria cultural, conceito de Adorno e Horkheimer, transforma cultura em mercadoria e padroniza gostos. A mídia é seu principal veículo. Ela pode homogeneizar ou diversificar, dependendo do contexto.",["Cultura como mercadoria","Padronização","Mídia como veículo"],"Indústria cultural produz cultura de massa.","Programas de TV, músicas e filmes produzidos em massa para lucro são exemplos de:",["Cultura erudita","Cultura popular","Indústria cultural","Multiculturalismo","Relativismo"],2,"Indústria cultural é produção em massa de bens culturais."],
"Opinião pública":["A opinião pública é o conjunto de opiniões compartilhadas por uma sociedade sobre temas de interesse coletivo. É formada por influência da mídia, das redes sociais e das interações sociais.",["Opiniões compartilhadas","Influência da mídia","Pode ser manipulada"],"Opinião pública não é sinônimo de maioria.","A opinião pública sobre um tema é formada pela influência da mídia e das redes sociais.","Isso mostra que a opinião pública é:",["Sempre espontânea","Influenciada","Sempre correta","Imutável","Individual"],1,"Opinião pública é influenciada."],
"Propaganda e manipulação":["A propaganda é a difusão de ideias e informações com objetivo de influenciar comportamentos. Pode ser comercial, política ou ideológica. A manipulação é o uso enganoso da informação para controlar a opinião.",["Difusão de ideias","Influência de comportamento","Manipulação enganosa"],"Publicidade é comercial; propaganda é política ou ideológica.","Campanhas que usam informações distorcidas para influenciar eleições são exemplos de:",["Educação","Propaganda e manipulação","Jornalismo","Ciência","Arte"],1,"Propaganda e manipulação usam informação para influenciar."],
"Mídia e democracia":["A mídia é essencial para a democracia, pois informa os cidadãos e fiscaliza o poder. No entanto, a concentração midiática e as fake news ameaçam a qualidade do debate público.",["Informação e fiscalização","Concentração e fake news","Pluralidade necessária"],"Mídia influencia, mas não substitui instituições democráticas.","A existência de diversos veículos de comunicação é importante para:",["Concentração midiática","Pluralidade democrática","Manipulação","Censura","Desinformação"],1,"Pluralidade democrática exige diversidade de vozes."],
"Espectro midiático":["O espectro midiático é a diversidade de posições políticas e ideológicas presentes nos meios de comunicação. Reflete a pluralidade da sociedade, mas também a concentração de propriedade.",["Diversidade de posições","Reflete pluralidade","Concentração e regulação"],"Espectro não significa equilíbrio.","A existência de veículos com diferentes orientações políticas é exemplo de:",["Monopólio midiático","Espectro midiático","Censura","Propaganda","Manipulação"],1,"Espectro midiático é diversidade de posições."],
/* ----- MÓDULO 20: Ciência e Tecnologia ----- */
"Ciência e sociedade":["A ciência é uma construção social, influenciada por contextos históricos, econômicos e culturais. Produz conhecimento, mas também pode ser usada para legitimar poder.",["Construção social","Influência de contextos","Relação com poder"],"A ciência não é neutra.","A ciência não é neutra; é influenciada por valores e interesses sociais.","Isso mostra que a ciência é:",["Puramente objetiva","Construção social","Independente da sociedade","Natural","Imutável"],1,"A ciência é construção social."],
"Tecnociência":["Tecnociência é a fusão entre ciência e tecnologia, em que a pesquisa científica está cada vez mais orientada para aplicações tecnológicas e interesses econômicos. Levanta questões éticas.",["Fusão ciência-tecnologia","Orientação para aplicações","Questões éticas"],"Tecnociência integra ciência e tecnologia.","A pesquisa científica financiada por empresas para desenvolver produtos é exemplo de:",["Ciência pura","Tecnociência","Ciência básica","Humanidades","Arte"],1,"Tecnociência é ciência orientada para aplicações."],
"Sociedade do conhecimento":["A sociedade do conhecimento é aquela em que o conhecimento e a informação são os principais recursos produtivos. Isso gera novas desigualdades, como a exclusão digital, e novas oportunidades.",["Conhecimento como recurso","Novas desigualdades","Exclusão digital"],"Conhecimento é mais amplo que informação.","Na sociedade do conhecimento, o acesso à educação e tecnologia é essencial para participação social.","Isso gera:",["Igualdade total","Novas desigualdades","Fim das classes","Homogeneização","Estagnação"],1,"Novas desigualdades surgem com a exclusão digital."],
"Riscos tecnológicos":["Riscos tecnológicos são os perigos associados ao uso de tecnologias, como poluição, acidentes nucleares, armas e vigilância. A sociedade de risco (Beck) analisa como a modernidade produz riscos globais.",["Perigos do uso de tecnologias","Sociedade de risco (Beck)","Gestão política"],"Risco é probabilidade; certeza é determinação.","Acidentes nucleares, como Chernobyl e Fukushima, são exemplos de:",["Riscos naturais","Riscos tecnológicos","Riscos sociais","Riscos econômicos","Riscos políticos"],1,"Riscos tecnológicos são associados a tecnologias."],
"Divulgação científica":["A divulgação científica é a comunicação do conhecimento científico para o público geral, buscando democratizar o acesso e combater a desinformação. Enfrenta desafios como complexidade da linguagem e resistência a evidências.",["Comunicação para o público","Democratização do conhecimento","Combate à desinformação"],"Divulgar é traduzir sem distorcer.","A divulgação científica busca tornar o conhecimento acessível a todos.","Seu principal desafio é:",["Aumentar o lucro","Democratizar o acesso","Esconder informações","Manipular dados","Reduzir a ciência"],1,"Divulgação científica busca democratizar o acesso."],
"Ética na ciência":["A ética na ciência envolve princípios como honestidade, transparência e responsabilidade. Casos de fraude e má conduta científica abalam a confiança pública.",["Honestidade e transparência","Fraude e má conduta","Integridade científica"],"Erro é involuntário; fraude é intencional.","A falsificação de resultados de pesquisa é violação de:",["Método científico","Ética na ciência","Divulgação científica","Tecnociência","Sociedade do conhecimento"],1,"Ética na ciência proíbe fraude e má conduta."],
/* ----- MÓDULO 21: Arte e Cultura ----- */
"Arte e sociedade":["A arte é uma expressão social que reflete e questiona valores, crenças e conflitos de uma época. Pode ser instrumento de crítica, resistência ou legitimação do poder.",["Expressão social","Reflete e questiona","Crítica e resistência"],"Arte pode entreter, mas também provocar e criticar.","A arte pode ser instrumento de crítica social e resistência política.","Isso mostra que a arte é:",["Neutra","Fenômeno social","Individual","Natural","Irrelevante"],1,"Arte é fenômeno social."],
"Cultura popular e erudita":["A cultura popular é produzida pelo povo, espontânea e coletiva; a erudita é acadêmica e institucional. Essa distinção é histórica e não hierárquica.",["Popular: coletiva e espontânea","Erudita: acadêmica e institucional","Não hierárquica"],"Não hierarquize: cultura popular não é inferior.","O frevo, o maracatu e o samba de roda são exemplos de:",["Cultura erudita","Cultura popular","Cultura de massa","Indústria cultural","Cultura globalizada"],1,"Cultura popular é produzida coletivamente."],
"Vanguardas artísticas":["As vanguardas artísticas são movimentos que rompem com padrões estéticos tradicionais, buscando novas formas de expressão. Exemplos: cubismo, surrealismo, futurismo, modernismo.",["Ruptura com padrões","Novas formas de expressão","Refletem transformações"],"Vanguarda é ruptura estética; moda é tendência passageira.","O cubismo, o surrealismo e o futurismo são exemplos de:",["Arte acadêmica","Vanguardas artísticas","Arte popular","Arte de massa","Arte clássica"],1,"Vanguardas são movimentos de ruptura."],
"Patrimônio artístico e cultural":["O patrimônio artístico e cultural é o conjunto de bens materiais e imateriais que representam a identidade de um povo. Sua preservação é garantida por leis e órgãos como o IPHAN.",["Bens materiais e imateriais","Identidade de um povo","Tombamento e registro"],"Tombamento protege; desapropriação transfere propriedade.","O tombamento de um prédio histórico pelo IPHAN é forma de preservar o:",["Patrimônio material","Patrimônio imaterial","Patrimônio natural","Patrimônio artístico","Patrimônio cultural"],0,"Tombamento protege patrimônio material."],
"Arte e política":["A arte pode ser instrumento de crítica política, resistência ou propaganda. Regimes autoritários censuram a arte; movimentos sociais usam a arte como expressão.",["Crítica e resistência","Censura e propaganda","Expressão política"],"Arte engajada é crítica; panfletária é simplista.","Obras de arte que denunciam injustiças sociais são exemplos de:",["Arte pela arte","Arte engajada","Arte acadêmica","Arte comercial","Arte decorativa"],1,"Arte engajada critica a realidade social."],
/* ----- MÓDULO 22: Esporte e Lazer ----- */
"Esporte e sociedade":["O esporte é fenômeno social que envolve competição, identidade, inclusão e exclusão. Pode ser instrumento de socialização, mobilidade ou reprodução de desigualdades.",["Fenômeno social","Identidade e inclusão","Mobilidade e desigualdade"],"Esporte é social e competitivo; atividade física é individual.","O esporte pode promover inclusão, mas também reproduzir desigualdades.","Isso mostra que o esporte é:",["Neutro","Ambivalente","Sempre inclusivo","Sempre excludente","Irrelevante"],1,"Esporte tem efeitos ambivalentes."],
"Lazer e tempo livre":["O lazer é o tempo livre dedicado a atividades prazerosas e não obrigatórias. Sua distribuição é desigual: classes sociais têm diferentes acessos. A indústria do lazer transforma o tempo livre em mercado.",["Tempo livre","Distribuição desigual","Indústria do lazer"],"Lazer é direito social.","O acesso ao lazer é desigual entre classes sociais.","Isso mostra que o lazer é:",["Universal","Direito social","Privilégio de poucos","Irrelevante","Natural"],1,"Lazer é direito social, mas acesso é desigual."],
"Corpo e esporte":["O corpo é moldado socialmente: padrões de beleza, desempenho e saúde variam entre culturas. O esporte disciplina o corpo e produz identidades.",["Corpo socialmente moldado","Padrões variáveis","Disciplina e identidade"],"Corpo é social e cultural.","Os padrões de beleza e desempenho esportivo variam entre culturas e épocas.","Isso mostra que o corpo é:",["Natural","Construção social","Imutável","Individual","Biológico"],1,"Corpo é socialmente construído."],
"Indústria esportiva":["A indústria esportiva é o conjunto de atividades econômicas ligadas ao esporte, como clubes, patrocínios, transmissões e produtos. Movimenta bilhões e transforma o esporte em mercadoria.",["Atividades econômicas","Esporte como mercadoria","Empregos e desigualdades"],"Indústria é profissional e comercial.","Patrocínios, direitos de transmissão e venda de produtos esportivos são exemplos de:",["Esporte amador","Indústria esportiva","Esporte educacional","Esporte de lazer","Esporte comunitário"],1,"Indústria esportiva envolve atividades comerciais."],
"Esporte e inclusão":["O esporte pode ser instrumento de inclusão social, oferecendo oportunidades para jovens em vulnerabilidade. Projetos sociais esportivos são exemplos. A inclusão depende de políticas públicas e acesso.",["Instrumento de inclusão","Oportunidades","Depende de políticas"],"Inclusão é direito; assistencialismo é ajuda pontual.","Projetos que oferecem atividades esportivas para jovens de periferias são exemplos de:",["Exclusão social","Inclusão pelo esporte","Indústria esportiva","Esporte profissional","Esporte de alto rendimento"],1,"Inclusão pelo esporte oferece oportunidades."],
/* ----- MÓDULO 23: Saúde e Corpo ----- */
"Saúde e sociedade":["A saúde é direito social e fenômeno socialmente determinado. Acesso, qualidade e condições de vida influenciam a saúde. A Sociologia da Saúde analisa desigualdades, medicalização e políticas públicas.",["Direito social","Socialmente determinado","Desigualdades e políticas"],"Saúde é bem-estar físico, mental e social.","A saúde é influenciada por condições sociais, econômicas e culturais.","Isso mostra que a saúde é:",["Apenas biológica","Fenômeno social","Individual","Natural","Irrelevante"],1,"Saúde é socialmente determinada."],
"Medicalização":["Medicalização é o processo de transformar questões sociais e comportamentais em problemas médicos, tratados com medicamentos. Amplia o poder da medicina sobre a vida cotidiana.",["Transformação em problema médico","Uso de medicamentos","Crítica à medicalização"],"Crítica é ao excesso, não ao tratamento adequado.","Transformar tristeza em doença e prescrever medicamentos é exemplo de:",["Saúde pública","Medicalização","Bioética","Epidemiologia","Prevenção"],1,"Medicalização transforma questões sociais em médicas."],
"Corpo e sociedade":["O corpo é moldado por normas sociais, padrões de beleza, gênero e classe. A Sociologia do Corpo analisa como a sociedade disciplina, marca e valoriza corpos.",["Corpo socialmente moldado","Normas e padrões","Disciplina e valorização"],"Corpo é construído socialmente.","Os padrões de beleza variam entre culturas e épocas, mostrando que o corpo é:",["Natural","Socialmente construído","Imutável","Biológico","Individual"],1,"Corpo é socialmente construído."],
"Bioética e sociedade":["A bioética é o estudo dos dilemas éticos ligados à vida, saúde e tecnologia. Envolve questões como aborto, eutanásia, transgênicos, clonagem e uso de dados genéticos.",["Dilemas éticos","Vida e tecnologia","Interdisciplinar"],"Bioética é mais ampla que ética médica.","Debates sobre aborto, eutanásia e transgênicos são exemplos de:",["Saúde pública","Bioética","Epidemiologia","Medicalização","Prevenção"],1,"Bioética estuda dilemas éticos."],
"Saúde pública e desigualdade":["A saúde pública é o conjunto de políticas e ações do Estado para garantir saúde à população. No Brasil, o SUS é universal, mas enfrenta desigualdades de acesso e qualidade.",["Políticas do Estado","SUS universal","Desigualdades de acesso"],"Pública é do Estado; privada é do mercado.","O SUS garante saúde universal, mas populações pobres ainda enfrentam dificuldades de acesso.","Isso mostra que a saúde pública:",["É igualitária","Enfrenta desigualdades","É privada","É irrelevante","É elitista"],1,"Saúde pública enfrenta desigualdades."],
"Movimentos de saúde":["Movimentos de saúde lutam por acesso, qualidade e direitos na área da saúde. Exemplos: movimento sanitário, movimento de pessoas com deficiência, movimentos por saúde mental.",["Lutas por direitos","Acesso e qualidade","Ex.: movimento sanitário"],"Movimento de saúde luta por direitos; antivacina é crítico à ciência.","O movimento sanitário brasileiro lutou pela criação do SUS.","Esse é exemplo de:",["Movimento social","Movimento de saúde","Movimento sindical","Movimento urbano","Movimento ambientalista"],1,"Movimento de saúde luta por direitos na área."],
/* ----- MÓDULO 24: Família e Gerações ----- */
"Família contemporânea":["A família contemporânea é plural: nuclear, monoparental, homoafetiva, extensa, reconstituída. Transformações sociais, como entrada da mulher no mercado de trabalho e diversidade sexual, redefiniram a família.",["Pluralidade de formas","Transformações sociais","Não há modelo único"],"Não existe família 'normal'.","Uma família formada por duas mães e um filho é exemplo de:",["Família nuclear","Família homoafetiva","Família monoparental","Família extensa","Família patriarcal"],1,"Família homoafetiva."],
"Gerações e conflitos geracionais":["As gerações (baby boomers, X, Y, Z) têm valores e comportamentos distintos, gerando conflitos. A juventude é período de transição e construção de identidade. O envelhecimento populacional é desafio contemporâneo.",["Gerações distintas","Conflitos de valores","Juventude e envelhecimento"],"Gerações não são blocos homogêneos.","Conflitos entre pais e filhos sobre tecnologia e valores são exemplos de:",["Conflitos de classe","Conflitos geracionais","Conflitos raciais","Conflitos de gênero","Conflitos religiosos"],1,"Conflitos geracionais ocorrem entre gerações."],
"Juventude e sociedade":["A juventude é uma construção social, variando entre culturas e épocas. Os jovens são agentes de transformação social, mas também enfrentam desemprego, violência e falta de oportunidades.",["Construção social","Agentes de transformação","Desafios e políticas"],"Há juventudes, diversas e desiguais.","Os jovens são frequentemente protagonistas de movimentos sociais e culturais.","Isso mostra que a juventude é:",["Passiva","Agente de transformação","Homogênea","Irrelevante","Natural"],1,"Juventude é agente de transformação."],
"Envelhecimento e sociedade":["O envelhecimento populacional é o aumento da proporção de idosos na população. Gera desafios para saúde, previdência e família. O idoso é frequentemente discriminado (etarismo).",["Aumento de idosos","Desafios sociais","Etarismo e políticas"],"Envelhecer é processo natural; doença é patologia.","O aumento da proporção de idosos gera desafios para previdência e saúde.","Isso é exemplo de:",["Transição demográfica","Envelhecimento populacional","Êxodo rural","Urbanização","Migração"],1,"Envelhecimento populacional é aumento de idosos."],
"Famílias monoparentais":["Famílias monoparentais são chefiadas por um único responsável, geralmente a mãe. Resultam de separações, viuvez ou escolha. Enfrentam desafios econômicos e sociais.",["Um único responsável","Geralmente chefiadas por mulheres","Desafios e proteção"],"Família monoparental é forma legítima de família.","Uma mãe que cria os filhos sozinha é exemplo de família:",["Nuclear","Monoparental","Extensa","Homoafetiva","Reconstituída"],1,"Família monoparental tem um único responsável."],
"Parentalidade e gênero":["A parentalidade é o exercício de ser pai ou mãe, socialmente construído. As mulheres ainda são as principais responsáveis pelo cuidado, gerando dupla jornada. A divisão desigual do trabalho doméstico é questão de gênero.",["Construção social","Dupla jornada feminina","Divisão desigual"],"Parentalidade é social e afetiva.","As mulheres ainda dedicam mais tempo ao trabalho doméstico do que os homens.","Isso é exemplo de:",["Igualdade de gênero","Desigualdade de gênero","Parentalidade igualitária","Divisão justa","Equidade"],1,"Desigualdade de gênero na divisão do trabalho doméstico."],
/* ----- MÓDULO 25: Migrações ----- */
"Migrações contemporâneas":["As migrações contemporâneas são movimentos de pessoas entre países, motivados por guerra, perseguição, pobreza ou busca de oportunidades. Envolvem refugiados, migrantes econômicos e deslocados. Geram xenofobia e desafios humanitários.",["Movimentos internacionais","Motivos diversos","Xenofobia e desafios"],"Refugiado foge de perseguição; migrante busca oportunidades.","Pessoas que fogem de guerras e perseguições em busca de proteção são:",["Migrantes econômicos","Refugiados","Turistas","Nômades digitais","Expatriados"],1,"Refugiados fogem de perseguição."],
"Refugiados e deslocados":["Refugiados são pessoas que fogem de seus países por perseguição, guerra ou violação de direitos. Deslocados internos são os que fogem dentro do próprio país. O ACNUR é a agência da ONU para refugiados.",["Fuga de perseguição","ACNUR","Políticas de acolhimento"],"Refugiado tem proteção internacional específica.","Pessoas que deixam seus países por guerra e buscam proteção em outro país são:",["Imigrantes","Refugiados","Turistas","Nômades","Expatriados"],1,"Refugiados buscam proteção internacional."],
"Xenofobia e racismo":["A xenofobia é a aversão a estrangeiros, frequentemente combinada com racismo. No Brasil, migrantes e refugiados enfrentam discriminação. A xenofobia é crime previsto na legislação brasileira.",["Aversão a estrangeiros","Combinada com racismo","Crime no Brasil"],"Patriotismo é amor ao país; xenofobia é ódio ao estrangeiro.","Discriminação contra refugiados e migrantes é exemplo de:",["Acolhimento","Xenofobia","Integração","Multiculturalismo","Diversidade"],1,"Xenofobia é aversão a estrangeiros."],
"Diásporas":["As diásporas são dispersões de grupos étnicos ou nacionais pelo mundo, mantendo laços culturais e identitários. Exemplos: diáspora africana, judaica, chinesa.",["Dispersão de grupos","Laços culturais mantidos","Diversidade e economia"],"Diáspora é coletiva e mantém identidade.","A dispersão de africanos pelo mundo, mantendo laços culturais, é exemplo de:",["Migração individual","Diáspora","Refúgio","Turismo","Nomadismo"],1,"Diáspora é dispersão coletiva."],
"Fronteiras e identidade":["As fronteiras são construções sociais e políticas que separam territórios, mas também são espaços de contato e troca. Moldam identidades e hierarquias. Migrantes e refugiados desafiam fronteiras.",["Construções políticas","Contato e troca","Identidades e hierarquias"],"Fronteiras são históricas e políticas.","As fronteiras separam territórios, mas também são espaços de contato cultural.","Isso mostra que as fronteiras são:",["Naturais","Construções sociais","Imutáveis","Apenas físicas","Irrelevantes"],1,"Fronteiras são construções sociais."],
"Políticas migratórias":["As políticas migratórias são o conjunto de leis e ações que regulam a entrada, permanência e saída de migrantes. Podem ser restritivas ou acolhedoras. No Brasil, a Lei de Migração (2017) substituiu o Estatuto do Estrangeiro.",["Leis e ações","Restritivas ou acolhedoras","Lei de Migração (2017)"],"Refúgio é proteção específica.","A Lei de Migração brasileira (2017) é considerada uma legislação:",["Restritiva","Acolhedora","Autoritária","Xenófoba","Discriminatória"],1,"Lei de Migração de 2017 é mais acolhedora."],
/* ----- MÓDULO 26: Desenvolvimento ----- */
"Desenvolvimento e subdesenvolvimento":["Desenvolvimento é o processo de melhoria das condições de vida de uma população, envolvendo economia, educação, saúde e direitos. Subdesenvolvimento é a condição de países que não atingiram esse patamar, marcados por desigualdade e dependência.",["Melhoria das condições de vida","Subdesenvolvimento e dependência","Relação histórica"],"Não confunda desenvolvimento com crescimento econômico.","Países com alta desigualdade e baixa qualidade de vida são considerados:",["Desenvolvidos","Subdesenvolvidos","Emergentes","Centrais","Periféricos"],1,"Subdesenvolvidos têm baixa qualidade de vida."],
"Teoria da dependência":["A teoria da dependência analisa a relação desigual entre países centrais e periféricos. Os países pobres fornecem matéria-prima e mão de obra barata, enquanto os ricos concentram tecnologia e capital.",["Relação centro-periferia","Dependência estrutural","Crítica ao desenvolvimento"],"Dependência é relação histórica, não natural.","Países periféricos exportam matéria-prima e importam tecnologia dos países centrais.","Isso caracteriza:",["Desenvolvimento autônomo","Dependência econômica","Independência tecnológica","Autarquia","Soberania plena"],1,"Dependência econômica é relação desigual."],
"Economia solidária":["A economia solidária é modelo de produção e consumo baseado na cooperação, autogestão e solidariedade, em oposição à competição capitalista. Exemplos: cooperativas, associações, bancos comunitários.",["Cooperação e autogestão","Oposição à competição","Justiça social"],"Solidária é organização econômica; caridade é ajuda.","Cooperativas de produção e consumo são exemplos de:",["Economia capitalista","Economia solidária","Economia planificada","Economia informal","Economia globalizada"],1,"Economia solidária é baseada em cooperação."],
"Desigualdade global":["A desigualdade global é a diferença de riqueza e qualidade de vida entre países e dentro deles. Resulta de processos históricos, como colonialismo e globalização. Organismos internacionais buscam reduzi-la, com resultados limitados.",["Diferença entre países","Resultado histórico","Tentativas de redução"],"Desigualdade é relacional; pobreza é absoluta ou relativa.","A diferença de renda entre países ricos e pobres é exemplo de:",["Desigualdade regional","Desigualdade global","Desigualdade local","Desigualdade individual","Desigualdade natural"],1,"Desigualdade global é entre países."],
"Capitalismo e crise":["O capitalismo é sistema econômico baseado na propriedade privada, no lucro e no trabalho assalariado. Passa por crises periódicas de superprodução, desemprego e concentração de renda. Marx analisou suas contradições.",["Propriedade privada e lucro","Crises periódicas","Contradições (Marx)"],"Crise econômica é financeira; social é de valores.","As crises periódicas do capitalismo são analisadas por:",["Durkheim","Weber","Marx","Comte","Freyre"],2,"Marx analisou as crises do capitalismo."],
"Desenvolvimento sustentável":["Desenvolvimento sustentável é o modelo que busca conciliar crescimento econômico, justiça social e preservação ambiental. Foi definido no Relatório Brundtland (1987) e é central nos debates contemporâneos.",["Economia, sociedade e ambiente","Relatório Brundtland","ODS"],"Sustentável é qualitativo, não apenas quantitativo.","Conciliar crescimento econômico com preservação ambiental e justiça social é objetivo do:",["Capitalismo selvagem","Desenvolvimento sustentável","Consumismo","Industrialização","Urbanização"],1,"Desenvolvimento sustentável busca conciliar três dimensões."],
/* ----- MÓDULO 27: Contemporânea ----- */
"Pós-modernidade":["A pós-modernidade é um conceito que descreve as transformações culturais, sociais e econômicas das sociedades contemporâneas, marcadas pela fragmentação, pluralidade e incerteza. Questiona as grandes narrativas e a noção de progresso linear.",["Fragmentação e pluralidade","Crítica às grandes narrativas","Incerteza e diversidade"],"Pós-modernidade é social; pós-modernismo é estético.","A pós-modernidade questiona as grandes narrativas e valoriza a pluralidade.","Isso significa que ela:",["Valoriza a uniformidade","Critica a diversidade","Questiona a verdade única","Defende o progresso linear","Rejeita a ciência"],2,"Pós-modernidade questiona verdades únicas."],
"Sociedade em rede (Castells)":["Manuel Castells analisa a sociedade em rede como aquela em que as tecnologias digitais conectam pessoas, instituições e mercados globalmente. Redes são a nova morfologia social. Gera inclusão e exclusão digital.",["Redes digitais globais","Nova morfologia social","Inclusão e exclusão"],"Rede é fluida; comunidade tem laços fortes.","A sociedade em rede é caracterizada pela:",["Centralização do poder","Conexão global em redes","Isolamento total","Ausência de tecnologia","Uniformidade cultural"],1,"Sociedade em rede é baseada em conexões globais."],
"Individualização (Bauman)":["Zygmunt Bauman analisa a individualização como processo em que responsabilidades e riscos são transferidos do coletivo para o indivíduo. Na modernidade líquida, os laços sociais são frágeis e as identidades fluidas.",["Responsabilidade individual","Modernidade líquida","Laços frágeis"],"Individualização é processo social; individualismo é valor.","Na modernidade líquida, os laços sociais são frágeis e as identidades fluidas.","Isso é análise de:",["Durkheim","Weber","Bauman","Marx","Comte"],2,"Bauman analisa a modernidade líquida."],
"Modernidade líquida":["Modernidade líquida é o conceito de Bauman para descrever a sociedade contemporânea, marcada pela fluidez, incerteza e fragilidade dos laços sociais. Instituições e identidades são temporárias e mutáveis.",["Fluidez e incerteza","Laços frágeis","Instituições temporárias"],"Líquido é fluido mas concreto.","A modernidade líquida é caracterizada pela:",["Estabilidade","Fluidez e incerteza","Rigidez","Tradição","Imutabilidade"],1,"Modernidade líquida é fluida e incerta."],
