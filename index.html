var C={
/* ----- MÓDULO 1: Cultura ----- */
"Cultura e sociedade":["Cultura é o conjunto de valores, normas, costumes, conhecimentos e práticas compartilhados por um grupo social. Ela não é natural, é aprendida e transmitida socialmente. A cultura inclui tanto aspectos materiais (objetos, ferramentas) quanto imateriais (crenças, valores, linguagem). Cada sociedade desenvolve sua própria cultura, e nenhuma é superior a outra.",["Cultura: valores, normas e práticas compartilhados","Cultura material e imaterial","Aprendida e transmitida socialmente"],"Não confunda cultura com erudição. Cultura popular também é cultura. Desconfie de generalizações sobre grupos sociais.","Em uma comunidade ribeirinha amazônica, os moradores desenvolvem técnicas de pesca, festas religiosas e formas de organizar o trabalho coletivo que são transmitidas de geração em geração.","O conjunto de valores, normas e práticas aprendidas e compartilhadas socialmente pela comunidade é denominado:",["Cultura","Erudição","Civilização","Sociedade","Nação"],0,"Cultura é o conjunto de valores, normas e práticas aprendidas socialmente. Erudição é conhecimento refinado; civilização é termo amplo; sociedade é o grupo organizado; nação é comunidade política."],
"Etnocentrismo e relativismo cultural":["Etnocentrismo é a visão que julga outras culturas a partir dos padrões da própria cultura, considerando-a superior. Relativismo cultural busca compreender cada cultura em seus próprios termos, sem julgamentos de valor. O relativismo não significa aceitar tudo, mas evitar o julgamento etnocêntrico.",["Etnocentrismo: julgar outra cultura pela própria","Relativismo: compreender em seus termos","Multiculturalismo: reconhecer diversidade"],"Relativismo cultural é postura metodológica, não defesa de violações de direitos humanos.","Em uma visita a um museu, um estudante afirma que obras de arte indígena são 'primitivas' comparadas à arte europeia.","A atitude do estudante é um exemplo de:",["Relativismo cultural","Multiculturalismo","Etnocentrismo","Diversidade cultural","Alteridade"],2,"Etnocentrismo julga outras culturas pelos padrões da própria. Relativismo seria compreender em contexto; multiculturalismo reconhece diversidade; alteridade é se colocar no lugar do outro."],
"Cultura erudita e cultura popular":["Cultura erudita é associada ao conhecimento acadêmico, às artes clássicas e às instituições formais. Cultura popular é produzida pelo povo, de forma espontânea e coletiva. Essa distinção é histórica e não hierárquica: ambas são expressões culturais legítimas.",["Erudita: acadêmica, institucional","Popular: espontânea, coletiva","Não há hierarquia entre elas"],"Cultura popular não é inferior à erudita. A indústria cultural pode transformar ambas em mercadorias.","O frevo, o maracatu e o samba de roda são manifestações transmitidas oralmente e praticadas coletivamente.","Essas manifestações são exemplos de:",["Cultura erudita","Cultura popular","Cultura de massa","Indústria cultural","Cultura globalizada"],1,"Frevo, maracatu e samba são cultura popular, produzida coletivamente. Erudita é institucional; massa é industrializada; indústria cultural é o sistema de produção."],
"Indústria cultural":["Indústria cultural é o conceito formulado por Adorno e Horkheimer para descrever a produção em massa de bens culturais padronizados, com fins lucrativos. Ela transforma cultura em mercadoria, homogeneizando gostos e comportamentos.",["Adorno e Horkheimer","Cultura como mercadoria","Padronização e massificação"],"Palavras-chave: padronização, massificação, lucro, mercadoria cultural.","Um jovem assiste a um reality show, consome produtos licenciados e ouve músicas criadas por grandes empresas para atingir o maior público possível.","O fenômeno descrito é exemplo de:",["Cultura erudita","Cultura popular","Indústria cultural","Multiculturalismo","Relativismo cultural"],2,"Indústria cultural é produção em massa com fins lucrativos. Erudita é acadêmica; popular é coletiva; multiculturalismo reconhece diversidade; relativismo é postura de compreensão."],
"Multiculturalismo":["Multiculturalismo é o reconhecimento da coexistência de múltiplas culturas em uma mesma sociedade, com respeito à diversidade. Envolve políticas de inclusão e valorização das diferenças.",["Reconhecimento da diversidade","Coexistência de culturas","Políticas de inclusão"],"Não confunda multiculturalismo com assimilação. Multiculturalismo valoriza a diferença; assimilação exige abandono da cultura.","O Brasil reconhece oficialmente a diversidade cultural indígena, afro-brasileira e de imigrantes. A Constituição de 1988 garante direitos culturais a esses grupos.","A situação descrita é um exemplo de:",["Etnocentrismo","Multiculturalismo","Assimilação cultural","Homogeneização","Indústria cultural"],1,"Multiculturalismo reconhece e valoriza diversidade. Etnocentrismo julga; assimilação exige abandono; homogeneização elimina diferenças; indústria cultural massifica."],
"Patrimônio material e imaterial":["Patrimônio material é o conjunto de bens físicos (monumentos, obras de arte, sítios arqueológicos). Patrimônio imaterial é o conjunto de práticas, saberes, expressões e celebrações transmitidos oralmente. O IPHAN é o órgão brasileiro responsável pelo tombamento e registro.",["Material: bens físicos","Imaterial: práticas e saberes","IPHAN: tombamento e registro"],"Patrimônio imaterial está nos 'modos de fazer'. A feijoada é imaterial; uma estátua é material.","O modo de fazer queijo de Minas, as festas juninas e a capoeira são reconhecidos como patrimônio cultural imaterial brasileiro.","Essas manifestações são classificadas como:",["Patrimônio material","Patrimônio imaterial","Patrimônio natural","Patrimônio histórico","Patrimônio artístico"],1,"Imaterial: práticas e saberes transmitidos oralmente. Material são bens físicos; natural é ambiental; histórico e artístico são categorias de bens materiais."],
"Determinismo e estruturalismo cultural":["Determinismo cultural afirma que a cultura determina o comportamento dos indivíduos. Estruturalismo cultural, associado a Lévi-Strauss, busca estruturas universais do pensamento humano. O determinismo é criticado por ignorar a agência individual.",["Determinismo: cultura determina comportamento","Estruturalismo: estruturas universais","Crítica ao determinismo"],"O ENEM cobra a crítica ao determinismo, valorizando a agência e a diversidade.","Um estudante afirma que 'os brasileiros são naturalmente alegres e festivos', atribuindo características fixas a toda uma população.","Essa afirmação é um exemplo de:",["Relativismo cultural","Determinismo cultural","Multiculturalismo","Estruturalismo","Alteridade"],1,"Determinismo cultural atribui características fixas a um grupo. Relativismo compreende em contexto; multiculturalismo reconhece diversidade; estruturalismo busca estruturas; alteridade é se colocar no lugar do outro."],
"Contracultura e subcultura":["Subcultura é um grupo dentro de uma sociedade que compartilha valores e práticas distintas, mas mantém relação com a cultura dominante. Contracultura é um movimento que se opõe ativamente à cultura dominante, buscando transformá-la.",["Subcultura: distinta, mas integrada","Contracultura: oposição ativa","Exemplos: hippies, punks"],"Subcultura não é necessariamente oposição; contracultura é.","Nos anos 1960, o movimento hippie rejeitou valores como consumo, guerra e moral tradicional.","Esse movimento é um exemplo de:",["Subcultura integrada","Contracultura","Cultura erudita","Indústria cultural","Multiculturalismo"],1,"Contracultura se opõe ativamente à cultura dominante. Subcultura é distinta mas integrada; erudita é acadêmica; indústria cultural massifica; multiculturalismo reconhece diversidade."],
/* ----- MÓDULO 2: Trabalho ----- */
"Modos de produção":["Modo de produção é a forma como uma sociedade organiza a produção de bens materiais, envolvendo forças produtivas e relações de produção. Marx identificou modos: primitivo, escravista, feudal, capitalista e socialista. Cada modo tem contradições que levam à transformação social.",["Forças produtivas + relações de produção","Modos: primitivo, escravista, feudal, capitalista","Contradições levam à transformação"],"Não confunda modo de produção com modo de desenvolvimento. O capitalismo é baseado na propriedade privada dos meios de produção.","Na sociedade feudal, os senhores eram proprietários da terra, e os servos trabalhavam em troca de proteção, entregando parte da produção.","Qual é o modo de produção descrito?",["Primitivo","Escravista","Feudal","Capitalista","Socialista"],2,"Feudal: propriedade senhorial da terra e trabalho servil. Primitivo é comunitário; escravista é escravidão; capitalista é trabalho assalariado; socialista é propriedade coletiva."],
"Mais-valia e alienação":["Mais-valia é o valor produzido pelo trabalhador que excede o valor da sua força de trabalho, apropriado pelo capitalista. Alienação é o processo pelo qual o trabalhador se torna estranho ao produto do seu trabalho e a si mesmo. São conceitos centrais de Marx.",["Mais-valia: valor não pago ao trabalhador","Alienação: estranhamento do produto","Crítica ao capitalismo"],"Mais-valia absoluta: aumento da jornada. Relativa: aumento da produtividade. Não confunda com lucro contábil.","Um trabalhador produz 100 peças por dia, recebendo salário equivalente a 40 peças. As outras 60 são apropriadas pelo dono.","O valor das 60 peças não pagas ao trabalhador é denominado:",["Lucro","Mais-valia","Capital","Renda","Juros"],1,"Mais-valia é o valor produzido que excede o valor da força de trabalho. Lucro é conceito contábil; capital é valor investido; renda é remuneração de propriedade; juros de empréstimo."],
"Fordismo e toyotismo":["Fordismo é o modelo de produção em massa desenvolvido por Henry Ford, baseado na linha de montagem, padronização e altos salários em troca de disciplina. Toyotismo é o modelo japonês baseado na produção flexível, just-in-time e qualidade total.",["Fordismo: linha de montagem","Toyotismo: flexível, just-in-time","Transição a partir dos anos 1970"],"Fordismo produz em massa; toyotismo produz sob demanda.","Uma montadora adota produção flexível, com estoques mínimos e trabalho em equipe, adaptando-se rapidamente ao mercado.","Esse modelo é chamado de:",["Fordismo","Taylorismo","Toyotismo","Artesanato","Manufatura"],2,"Toyotismo é produção flexível. Fordismo é massa padronizada; taylorismo é organização científica; artesanato é individual; manufatura é manual coletiva."],
"Uberização e precarização":["Uberização é a transformação de trabalhadores em prestadores autônomos, sem vínculo empregatício, mediados por plataformas digitais. Precarização é a perda de direitos e garantias trabalhistas.",["Uberização: autônomo sem vínculo","Precarização: perda de direitos","Plataformas digitais"],"Uberização não é empreendedorismo. O trabalhador não tem férias, FGTS, INSS ou jornada definida.","Motoristas de aplicativo trabalham sem carteira assinada, sem férias, sem FGTS e com renda variável.","Essa situação é exemplo de:",["Fordismo","Toyotismo","Uberização e precarização","Sindicalismo","Economia solidária"],2,"Uberização: autônomos mediados por plataformas com precarização de direitos. Fordismo e toyotismo são modelos industriais; sindicalismo é organização coletiva; economia solidária é cooperativa."],
"Sindicalismo e movimento operário":["Sindicalismo é a organização coletiva de trabalhadores para defender interesses como salários, condições e direitos. O movimento operário surgiu com a Revolução Industrial, lutando por jornada de 8 horas, proibição do trabalho infantil e direito à greve.",["Organização coletiva","Lutas: jornada, salário, direitos","Greve como instrumento"],"Não confunda sindicato com partido político.","Em 1917, em São Paulo, trabalhadores da indústria têxtil fizeram greve por melhores salários e jornada de 8 horas.","Essa greve é exemplo de:",["Movimento estudantil","Movimento sindical","Movimento feminista","Movimento ambientalista","Movimento indígena"],1,"Movimento sindical organiza trabalhadores por direitos. Os demais têm outras pautas."],
"Divisão social do trabalho":["A divisão social do trabalho é a distribuição de tarefas entre grupos sociais, conforme a especialização. Durkheim distingue solidariedade mecânica (sociedades simples) e solidariedade orgânica (sociedades complexas, interdependentes).",["Especialização de tarefas","Solidariedade mecânica e orgânica","Integração ou desigualdade"],"Durkheim: sociedades simples → mecânica; complexas → orgânica.","Em uma sociedade industrial, cada trabalhador exerce uma função especializada e todos dependem uns dos outros.","Segundo Durkheim, é solidariedade:",["Mecânica","Orgânica","Anomia","Alienação","Mais-valia"],1,"Orgânica é típica de sociedades complexas, com divisão do trabalho e interdependência. Mecânica é de sociedades simples; anomia é ausência de normas."],
"Trabalho informal e desemprego":["Trabalho informal é atividade remunerada sem vínculo empregatício formal, sem proteção social. Desemprego é a situação de quem busca trabalho e não encontra. Ambos são problemas estruturais do capitalismo.",["Informal: sem vínculo formal","Desemprego: busca sem encontrar","Problemas estruturais"],"Trabalho informal não é sinônimo de ilegal.","Um vendedor ambulante trabalha todos os dias, mas não tem carteira assinada, férias ou FGTS.","Essa situação caracteriza:",["Trabalho formal","Trabalho informal","Desemprego","Trabalho escravo","Trabalho voluntário"],1,"Informal é sem vínculo formal. Formal tem carteira; desemprego é ausência; escravo é forçado; voluntário é não remunerado."],
"Automação e futuro do trabalho":["A automação substitui trabalho humano por máquinas e algoritmos, aumentando produtividade e reduzindo postos de trabalho. Afeta funções repetitivas e também serviços. O futuro do trabalho exige requalificação e políticas de proteção social.",["Substituição de trabalho humano","Redução de postos","Requalificação necessária"],"Automação inclui software e algoritmos, não apenas robôs físicos.","Caixas de supermercado são substituídos por terminais de autoatendimento, e fábricas usam robôs.","Esse fenômeno é chamado de:",["Fordismo","Toyotismo","Automação","Uberização","Precarização"],2,"Automação é substituição por máquinas e algoritmos. Fordismo e toyotismo são modelos; uberização é plataformas; precarização é perda de direitos."],
/* ----- MÓDULO 3: Desigualdade ----- */
"Classes sociais":["Classes sociais são grupos definidos pela posição nas relações de produção e pela distribuição de riqueza, poder e prestígio. Para Marx, as classes se definem pela propriedade dos meios de produção (burguesia e proletariado). Para Weber, classe, status e poder são dimensões distintas.",["Marx: posição nos meios de produção","Weber: classe, status e poder","Grupos hierarquizados"],"Marx: duas classes principais. Weber: múltiplas dimensões. Não confunda classe com estamento ou casta.","Em uma sociedade capitalista, proprietários das fábricas e trabalhadores assalariados ocupam posições opostas.","Esses grupos são, respectivamente:",["Classe média e baixa","Burguesia e proletariado","Estamento e casta","Nobreza e plebe","Patrícios e plebeus"],1,"Burguesia e proletariado são as classes fundamentais do capitalismo para Marx. As demais opções são de outras sociedades ou categorias."],
"Estamentos e castas":["Estamentos são estratos definidos por status hereditário, típicos do feudalismo. Castas são estratos rígidos, hereditários e endogâmicos, como na Índia tradicional. A mobilidade social é praticamente inexistente nesses sistemas.",["Estamento: status hereditário","Casta: rígida, hereditária, endogâmica","Mobilidade quase nula"],"Estamento é hereditário; classe é definida pela posição econômica e permite mobilidade.","Na Índia tradicional, as pessoas nascem em uma casta e permanecem nela por toda a vida.","Esse sistema é chamado de:",["Classe social","Estamento","Casta","Meritocracia","Mobilidade social"],2,"Casta é sistema rígido, hereditário e endogâmico. Classe permite mobilidade; estamento é hereditário mas menos rígido; meritocracia é ideia de ascensão por mérito."],
"Mobilidade social":["Mobilidade social é a mudança de posição de um indivíduo ou grupo na estrutura social. Pode ser vertical (ascensão ou queda), horizontal (sem alteração de status), intergeracional ou intrageracional. A educação é um dos principais canais de mobilidade.",["Vertical: ascensão ou queda","Horizontal: sem mudança de status","Intergeracional e intrageracional"],"Mobilidade não é apenas mudança de renda; envolve status, prestígio e poder.","Um jovem de família pobre se forma em medicina e muda de classe social em relação aos pais.","Esse é um exemplo de:",["Mobilidade horizontal","Mobilidade vertical ascendente","Mobilidade vertical descendente","Imobilidade","Mobilidade geográfica"],1,"Mobilidade vertical ascendente é ascensão. Horizontal é sem alteração de status; descendente é queda; imobilidade é ausência; geográfica é mudança de local."],
"Pobreza e exclusão social":["Pobreza é a falta de recursos para satisfazer necessidades básicas. Exclusão social é a marginalização de indivíduos ou grupos dos direitos e oportunidades. A pobreza pode ser absoluta (falta de sobrevivência) ou relativa (comparação com padrão da sociedade).",["Pobreza absoluta e relativa","Exclusão: marginalização","Multidimensional"],"Não reduza pobreza a renda. Ela envolve educação, saúde, moradia e acesso a direitos.","Uma família sem renda suficiente para alimentação, moradia e saúde vive em:",["Pobreza relativa","Pobreza absoluta","Exclusão digital","Desigualdade regional","Mobilidade social"],1,"Pobreza absoluta é falta de recursos para necessidades básicas. Relativa é comparação; exclusão digital é tecnologia; desigualdade regional é entre regiões; mobilidade é mudança de posição."],
"Concentração de renda":["Concentração de renda é a distribuição desigual da riqueza, em que pequena parcela da população detém a maior parte da renda. O Brasil é um dos países mais desiguais do mundo. O índice de Gini mede essa desigualdade, de 0 (igualdade) a 1 (desigualdade total).",["Pequena parcela detém grande parte","Índice de Gini","Brasil: alta desigualdade"],"Gini próximo de 0 = igualdade; próximo de 1 = desigualdade.","Dados hipotéticos mostram que os 10% mais ricos detêm 50% da renda, enquanto os 50% mais pobres detêm 10%.","Essa distribuição indica:",["Igualdade de renda","Concentração de renda","Mobilidade social","Pobreza relativa","Exclusão social"],1,"Concentração de renda é distribuição desigual. Igualdade seria equitativa; mobilidade é mudança de posição; pobreza relativa é comparação; exclusão é marginalização."],
"Meritocracia":["Meritocracia é a ideia de que a posição social de cada um é resultado exclusivo do esforço e mérito. Na prática, é limitada por desigualdades estruturais de origem, raça, gênero e classe. O ENEM cobra a crítica à meritocracia como discurso que legitima desigualdades.",["Ideia: posição = esforço + mérito","Crítica: ignora desigualdades estruturais","Discurso que legitima privilégios"],"A meritocracia não explica a baixa mobilidade social.","Um estudante afirma que 'quem é pobre é pobre porque não se esforça', ignorando desigualdades de acesso.","Essa afirmação expressa uma visão:",["Crítica à desigualdade","Meritocrática","Relativista","Multiculturalista","Socialista"],1,"Meritocracia atribui posição social apenas ao esforço individual, ignorando desigualdades estruturais."],
"Racismo estrutural e desigualdade":["Racismo estrutural é o conjunto de práticas, normas e políticas que reproduzem a desigualdade racial de forma sistemática, mesmo sem intenção explícita. No Brasil, manifesta-se em diferenças salariais, educacionais, de saúde e de encarceramento.",["Desigualdade racial sistemática","Não precisa de intenção explícita","Diferenças em renda, educação, saúde"],"Racismo estrutural ≠ racismo individual. O estrutural está nas instituições.","Dados hipotéticos mostram que trabalhadores negros ganham em média 60% do salário de brancos com a mesma escolaridade.","Essa diferença é exemplo de:",["Racismo individual","Racismo estrutural","Desigualdade regional","Meritocracia","Mobilidade social"],1,"Racismo estrutural é reprodução sistemática da desigualdade racial nas instituições. Individual é ato isolado; regional é entre regiões; meritocracia é ideia de esforço; mobilidade é mudança de posição."],
"Desigualdade educacional":["Desigualdade educacional é a diferença de acesso e qualidade da educação entre grupos sociais. Ela reproduz desigualdades de classe, raça e região. A escola pode ser instrumento de mobilidade ou de reprodução de desigualdades.",["Diferença de acesso e qualidade","Reproduz desigualdades","Escola: mobilidade ou reprodução"],"Não confunda igualdade de acesso com igualdade de qualidade.","Em uma mesma cidade, escolas de bairros ricos têm mais recursos, enquanto escolas de periferias enfrentam falta de infraestrutura.","Isso caracteriza:",["Igualdade educacional","Desigualdade educacional","Meritocracia","Mobilidade social","Inclusão digital"],1,"Desigualdade educacional é diferença de acesso e qualidade."],
/* ----- MÓDULO 4: Poder e Estado ----- */
"Tipos de Estado":["Estado é a instituição que detém o monopólio legítimo da força em um território. Tipos: Estado Liberal (mínima intervenção), Estado de Bem-Estar Social (proteção social), Estado Neoliberal (privatizações, redução de gastos), Estado Totalitário (controle total).",["Monopólio legítimo da força (Weber)","Liberal, Bem-Estar, Neoliberal, Totalitário","Reflete relações de poder"],"Não confunda Estado com governo. Estado é permanente; governo é temporário.","Um país adota privatizações, redução de gastos sociais e abertura comercial.","Esse modelo é:",["Estado Liberal","Estado de Bem-Estar Social","Estado Neoliberal","Estado Totalitário","Estado Socialista"],2,"Neoliberalismo: redução do Estado, privatizações e abertura de mercado."],
"Formas de governo":["Formas de governo são modos de organizar o exercício do poder: monarquia (poder hereditário), república (poder eletivo), presidencialismo (chefe de Estado e governo na mesma pessoa), parlamentarismo (chefe de governo escolhido pelo parlamento). O Brasil é república presidencialista.",["Monarquia x República","Presidencialismo x Parlamentarismo","Brasil: república presidencialista"],"Não confunda forma de governo (monarquia/república) com sistema de governo (presidencialismo/parlamentarismo).","No Brasil, o presidente é eleito pelo voto direto e exerce chefia de Estado e de governo.","Essa forma é:",["Monarquia parlamentarista","República presidencialista","República parlamentarista","Monarquia presidencialista","Ditadura"],1,"República presidencialista: presidente eleito acumula chefia de Estado e governo."],
"Contratualistas":["Contratualistas explicam a origem do Estado a partir de um contrato social. Hobbes: estado de natureza violento, contrato para segurança. Locke: direitos naturais à vida, liberdade e propriedade. Rousseau: vontade geral e soberania popular.",["Hobbes: segurança, Leviatã","Locke: direitos naturais, propriedade","Rousseau: vontade geral, soberania"],"Não atribua a Locke a ideia de 'homem mau'. Hobbes é o do 'homem lobo do homem'.","Para Hobbes, os homens vivem em estado de natureza violento e cedem liberdade a um soberano absoluto.","Essa ideia é central em:",["Locke","Rousseau","Hobbes","Montesquieu","Weber"],2,"Hobbes defende contrato social para garantir segurança. Locke defende direitos naturais; Rousseau, vontade geral; Montesquieu, separação de poderes; Weber, monopólio da força."],
"Cidadania e direitos":["Cidadania é o conjunto de direitos e deveres que vinculam o indivíduo à comunidade política. Marshall distingue três dimensões: direitos civis (liberdade, propriedade, justiça), políticos (voto, participação) e sociais (educação, saúde, trabalho).",["Civis, políticos e sociais (Marshall)","Construção histórica","Direitos e deveres"],"Não confunda cidadania formal (na lei) com real (na prática).","Um cidadão tem direito de votar, de expressar opinião e de acessar educação e saúde públicas.","Esses direitos correspondem a:",["Civil, política e social","Política, civil e social","Social, política e civil","Civil, social e política","Política, social e civil"],0,"Civis: expressão. Políticos: voto. Sociais: educação e saúde."],
"Democracia":["Democracia é o regime em que o poder emana do povo, exercido direta ou indiretamente. Inclui eleições livres, respeito aos direitos humanos, separação de poderes e pluralismo. Democracia direta (plebiscito) e representativa (eleição) são complementares.",["Poder do povo","Direta e representativa","Direitos humanos e pluralismo"],"Democracia não é apenas eleição. Envolve respeito a minorias e liberdade de imprensa.","Em um país, os cidadãos elegem representantes e votam em plebiscitos sobre questões específicas.","Esse sistema combina:",["Democracia direta e representativa","Monarquia e república","Autoritarismo e populismo","Socialismo e capitalismo","Presidencialismo e parlamentarismo"],0,"Direta é participação direta (plebiscito); representativa é eleição de representantes."],
"Autoritarismo e totalitarismo":["Autoritarismo é um regime em que o poder é concentrado e as liberdades são limitadas, mas sem controle total. Totalitarismo busca controlar todos os aspectos da vida social, com ideologia oficial, partido único e repressão generalizada.",["Autoritarismo: poder concentrado","Totalitarismo: controle total","Diferença: grau de controle"],"Todo totalitarismo é autoritário, mas nem todo autoritarismo é totalitário.","Em um regime, o governo controla a imprensa e proíbe partidos de oposição, mas permite alguma liberdade econômica e religiosa.","Esse regime é:",["Democrático","Autoritário","Totalitário","Socialista","Anarquista"],1,"Autoritarismo concentra poder e limita liberdades, mas não controla tudo. Totalitarismo controlaria também economia e religião."],
"Populismo":["Populismo é uma estratégia política que busca apoio popular direto, muitas vezes com líder carismático que se apresenta como representante do povo contra as elites. Pode ser de direita ou esquerda.",["Líder carismático","Apelo direto ao povo","Pode ser direita ou esquerda"],"Não confunda populismo com política popular.","Um líder discursa diretamente às massas, criticando 'a elite corrupta' e prometendo resolver todos os problemas.","Esse estilo é chamado de:",["Democracia direta","Populismo","Parlamentarismo","Federalismo","Anarquismo"],1,"Populismo é apelo direto ao povo com líder carismático."],
"Partidos políticos e sistemas eleitorais":["Partidos políticos são organizações que buscam conquistar o poder por meio de eleições. Sistemas eleitorais: majoritário (vence quem tem mais votos) e proporcional (distribuição conforme votos). O Brasil adota proporcional para deputados e majoritário para presidente e senadores.",["Partidos: organizações políticas","Majoritário x proporcional","Brasil: misto"],"Não confunda proporcional com majoritário.","Nas eleições para deputado federal, as cadeiras são distribuídas proporcionalmente aos votos recebidos pelos partidos.","Esse sistema é:",["Majoritário","Proporcional","Distrital","Misto","Indireto"],1,"Proporcional distribui cadeiras conforme votos."],
/* ----- MÓDULO 5: Movimentos ----- */
"Movimento operário e sindical":["O movimento operário surgiu com a Revolução Industrial, lutando por direitos trabalhistas. No Brasil, consolidou-se a partir de 1930, com a CLT. Greves, manifestações e negociações coletivas são instrumentos de luta.",["Surgiu com a Revolução Industrial","Lutas: jornada, salário, direitos","CLT (1930)"],"O movimento operário não é apenas econômico; luta por direitos políticos e sociais.","Em 1978-1980, operários do ABC paulista fizeram greves que marcaram o ressurgimento do movimento sindical.","Esse movimento é:",["Estudantil","Operário e sindical","Feminista","Ambientalista","Indígena"],1,"Operário e sindical organiza trabalhadores por direitos."],
"Movimento feminista":["O movimento feminista luta pela igualdade de gênero, pelo fim da violência contra a mulher e pela ampliação de direitos. Teve ondas: sufrágio, igualdade legal, diversidade e interseccionalidade. Conquistas: voto feminino (1932), Lei Maria da Penha (2006), Lei do Feminicídio (2015).",["Igualdade de gênero","Ondas do feminismo","Conquistas: voto, Maria da Penha"],"Não confunda feminismo com 'inversão de gênero'.","Em 1932, as mulheres conquistaram o direito ao voto após décadas de mobilização.","Essa conquista é resultado do movimento:",["Operário","Feminista","Negro","Ambientalista","Indígena"],1,"Feminista lutou pelo sufrágio feminino."],
"Movimento negro":["O movimento negro luta contra o racismo, pela igualdade racial e pela valorização da cultura afro-brasileira. Conquistas: criminalização do racismo (1989), cotas raciais, Lei 10.639 (2003).",["Luta antirracista","Conquistas: cotas, Lei 10.639","MNU (1978)"],"Racismo é crime inafiançável e imprescritível.","Em 1978, foi criado o Movimento Negro Unificado (MNU).","Esse movimento é:",["Operário","Negro","Feminista","Ambientalista","Estudantil"],1,"Movimento negro luta contra racismo."],
"Movimento LGBTQIA+":["O movimento LGBTQIA+ luta contra a discriminação por orientação sexual e identidade de gênero. Conquistas: união estável homoafetiva (2011), criminalização da homofobia (2019). Ganhou visibilidade com Stonewall (1969).",["Luta contra homofobia e transfobia","Conquistas: união estável, criminalização","Stonewall (1969)"],"Não confunda orientação sexual com identidade de gênero.","Em 2011, o STF reconheceu a união estável entre pessoas do mesmo sexo.","Essa conquista é do movimento:",["Negro","LGBTQIA+","Feminista","Indígena","Operário"],1,"LGBTQIA+ luta por direitos de pessoas LGBT."],
"Movimento indígena":["O movimento indígena luta pela demarcação de terras, pelo respeito à cultura e pela autodeterminação dos povos originários. Conquistas: reconhecimento na Constituição de 1988, demarcação de terras, políticas de saúde e educação indígena.",["Demarcação de terras","Autodeterminação","Constituição de 1988"],"Não confunda indígena com 'atrasado'.","Em 1988, a Constituição reconheceu direitos originários dos povos indígenas sobre suas terras.","Essa conquista é do movimento:",["Negro","Indígena","LGBTQIA+","Feminista","Ambientalista"],1,"Indígena luta por demarcação e direitos."],
"MST e movimentos agrários":["O Movimento dos Trabalhadores Rurais Sem Terra (MST) luta pela reforma agrária, pelo acesso à terra e por justiça social no campo. Surgiu em 1984.",["MST (1984)","Reforma agrária","Acesso à terra"],"Não confunda MST com movimento violento.","Em 1984, trabalhadores sem terra fundaram o MST.","Esse movimento é:",["Urbano","Agrário","Operário","Estudantil","Ambientalista"],1,"MST é movimento agrário."],
"Movimentos ambientalistas":["Movimentos ambientalistas lutam pela preservação do meio ambiente, pelo desenvolvimento sustentável e contra a degradação ambiental. Destacam-se movimentos contra desmatamento, mineração predatória e grandes obras. Chico Mendes é referência.",["Preservação ambiental","Desenvolvimento sustentável","Chico Mendes"],"Não confunda ambientalismo com 'anti-desenvolvimento'.","Em 1988, o líder seringueiro Chico Mendes foi assassinado por sua luta contra o desmatamento.","Essa luta é do movimento:",["Operário","Ambientalista","Negro","Indígena","Feminista"],1,"Ambientalista luta pela preservação."],
"Novos movimentos sociais e redes":["Novos movimentos sociais são mobilizações contemporâneas que transcendem a luta de classes, focando em identidades, direitos culturais e qualidade de vida. Utilizam redes sociais e comunicação digital.",["Identidade e direitos culturais","Organização em redes","Castells e a sociedade em rede"],"Não confunda com 'sem pauta econômica'. Combinam pautas identitárias e econômicas.","Em 2013, manifestações no Brasil foram organizadas por redes sociais, com pautas variadas.","Essas manifestações são exemplo de:",["Movimento operário tradicional","Novos movimentos sociais em rede","Movimento agrário","Movimento sindical","Movimento monarquista"],1,"Novos movimentos sociais utilizam redes digitais e pautas plurais."],
/* ----- MÓDULO 6: Cidadania ----- */
"Declaração Universal dos Direitos Humanos":["A DUDH foi adotada pela ONU em 1948, após a Segunda Guerra. Estabelece direitos fundamentais de todos os seres humanos, sem distinção. No Brasil, foi incorporada à Constituição de 1988.",["ONU, 1948","Direitos fundamentais universais","Base da Constituição de 1988"],"DUDH é marco histórico, mas não é lei obrigatória por si só.","Após as atrocidades da Segunda Guerra, a ONU adotou a DUDH.","Esse documento foi adotado em:",["1945","1948","1964","1988","2000"],1,"DUDH: 1948."],
"Constituição de 1988":["A Constituição de 1988, chamada 'Constituição Cidadã', garante direitos civis, políticos e sociais, além de princípios como dignidade humana, igualdade e Estado Democrático de Direito.",["Constituição Cidadã","Direitos civis, políticos e sociais","Estado Democrático de Direito"],"Ela ampliou significativamente direitos sociais e individuais.","Após a ditadura, o Brasil promulgou nova Constituição em 1988.","Essa Constituição é conhecida como:",["Constituição Cidadã","Constituição Federal","Carta Magna","Constituição Outorgada","Constituição de 1946"],0,"É a Constituição Cidadã."],
"Direitos civis, políticos e sociais":["Civis: liberdade, propriedade, justiça. Políticos: voto, participação. Sociais: educação, saúde, trabalho, moradia. Marshall distingue essas três dimensões. Todas estão na Constituição de 1988.",["Civis: liberdade e propriedade","Políticos: voto e participação","Sociais: educação, saúde, trabalho"],"Não confunda direito civil com social.","Um cidadão tem direito de votar (político), de expressar opinião (civil) e de acessar saúde (social).","Esses direitos correspondem a:",["Civil, política e social","Política, civil e social","Social, política e civil","Civil, social e política","Política, social e civil"],1,"Políticos: voto. Civis: expressão. Sociais: saúde."],
"Direitos humanos no Brasil":["No Brasil, os direitos humanos enfrentam desafios como violência policial, encarceramento em massa e desigualdade. A Constituição de 1988 incorporou a DUDH. Movimentos sociais denunciam violações, especialmente nas periferias.",["Desafios: violência, encarceramento","Constituição incorpora DUDH","Movimentos denunciam violações"],"Não confunda 'direitos humanos' com 'impunidade'.","Relatórios apontam que a violência policial atinge principalmente jovens negros e pobres.","Essa situação revela:",["Respeito aos direitos humanos","Violação de direitos humanos","Igualdade racial","Justiça social","Cidadania plena"],1,"Violência policial contra grupos específicos é violação de direitos humanos."],
"Cidadania formal e cidadania real":["Cidadania formal é o reconhecimento legal de direitos; cidadania real é o exercício efetivo desses direitos. No Brasil, há um abismo entre lei e prática.",["Formal: na lei","Real: na prática","Abismo entre lei e prática"],"Ter direito não é o mesmo que exercer direito.","Uma pessoa tem direito à saúde, mas não consegue atendimento por falta de hospitais e médicos.","Isso exemplifica a diferença entre:",["Cidadania formal e real","Direitos civis e políticos","Direitos humanos e naturais","Igualdade e equidade","Justiça e lei"],0,"Formal é na lei; real é na prática."],
"Direitos e deveres do cidadão":["Cidadania envolve direitos e deveres. Direitos: civis, políticos e sociais. Deveres: respeitar leis, pagar impostos, votar (obrigatório), preservar o meio ambiente.",["Direitos: civis, políticos, sociais","Deveres: leis, impostos, voto","Cidadania ativa"],"Voto obrigatório no Brasil para maiores de 18 anos.","No Brasil, o voto é obrigatório para maiores de 18 anos.","O voto é:",["Apenas um direito","Apenas um dever","Direito e dever","Obrigação sem direito","Facultativo para todos"],2,"Voto é direito e dever cívico."],
/* ----- MÓDULO 7: Sociologia como Ciência ----- */
"Surgimento da Sociologia":["A Sociologia surgiu no século XIX, como resposta às transformações da Revolução Industrial e da Revolução Francesa. Auguste Comte é considerado o pai, propondo a física social. A disciplina busca compreender a sociedade de forma científica.",["Século XIX","Revolução Industrial e Francesa","Comte: pai da Sociologia"],"Não confunda surgimento da Sociologia com surgimento da sociedade.","A Sociologia surgiu como ciência no século XIX, em meio às transformações europeias.","Qual evento está associado ao surgimento da Sociologia?",["Revolução Industrial","Revolução Russa","Segunda Guerra Mundial","Guerra Fria","Globalização"],0,"Revolução Industrial transformou relações sociais, gerando questões que a Sociologia buscou compreender."],
"Positivismo de Comte":["O positivismo de Comte propõe que a sociedade deve ser estudada com métodos das ciências naturais, buscando leis universais. A humanidade passaria por três estágios: teológico, metafísico e positivo.",["Comte: fundador","Método das ciências naturais","Três estágios"],"Não confunda positivismo com otimismo.","Comte propôs que a Sociologia deveria estudar a sociedade com métodos das ciências naturais.","Essa proposta é característica do:",["Marxismo","Positivismo","Compreensivismo","Estruturalismo","Funcionalismo"],1,"Positivismo defende métodos das ciências naturais."],
"Método compreensivo de Weber":["Weber propõe que a Sociologia deve compreender o sentido que os indivíduos atribuem às suas ações. O método compreensivo busca entender as motivações subjetivas. Tipos ideais são ferramentas metodológicas para analisar a realidade.",["Compreensão do sentido da ação","Método interpretativo","Tipos ideais"],"Não confunda compreensão com empatia.","Para Weber, o sociólogo deve compreender o sentido que os indivíduos dão às suas ações.","Esse método é:",["Positivismo","Compreensivismo","Materialismo histórico","Estruturalismo","Funcionalismo"],1,"Compreensivismo é o método de Weber."],
"Métodos de pesquisa social":["A pesquisa social utiliza métodos quantitativos (survey, estatística) e qualitativos (entrevista, observação participante, análise documental). A escolha depende do objeto e objetivos. Deve seguir rigor metodológico e ética.",["Quantitativo e qualitativo","Survey, entrevista, observação","Rigor e ética"],"Quantitativo e qualitativo são complementares.","Um pesquisador realiza entrevistas em profundidade com moradores de uma comunidade.","Esse é um método:",["Quantitativo","Qualitativo","Experimental","Estatístico","Dedutivo"],1,"Entrevistas em profundidade são qualitativas."],
"Senso comum x conhecimento científico":["Senso comum é conhecimento espontâneo, baseado na experiência cotidiana, sem rigor metodológico. Conhecimento científico é sistemático, verificável e crítico. A Sociologia rompe com o senso comum ao investigar a sociedade com método.",["Senso comum: espontâneo, acrítico","Ciência: sistemática, verificável","Sociologia rompe com senso comum"],"Não confunda senso comum com ignorância.","Uma pessoa afirma que 'o brasileiro é naturalmente corrupto', baseando-se em generalizações.","Essa afirmação é exemplo de:",["Conhecimento científico","Senso comum","Teoria sociológica","Método compreensivo","Análise estrutural"],1,"Senso comum é conhecimento espontâneo e acrítico."],
"Indivíduo e sociedade":["A relação entre indivíduo e sociedade é central na Sociologia. Durkheim enfatiza que a sociedade é anterior ao indivíduo e exerce coerção. Weber destaca a ação individual. A Sociologia busca superar a dicotomia.",["Durkheim: sociedade precede indivíduo","Weber: ação individual","Relação dialética"],"Não caia no determinismo nem no individualismo.","Para Durkheim, os fatos sociais são exteriores ao indivíduo e exercem coerção.","Essa concepção enfatiza:",["Ação individual","Primazia da sociedade","Contrato social","Luta de classes","Racionalidade"],1,"Durkheim enfatiza primazia da sociedade."],
/* ----- MÓDULO 8: Clássicos ----- */
"Émile Durkheim":["Durkheim é um dos fundadores da Sociologia. Defende que os fatos sociais devem ser estudados como coisas, com objetividade. Conceitos: fato social (exterior, coercitivo, geral), anomia (ausência de normas), solidariedade mecânica e orgânica.",["Fato social: exterior, coercitivo, geral","Anomia","Solidariedade mecânica e orgânica"],"Não confunda fato social com fato histórico.","Durkheim estudou o suicídio como fato social.","Para Durkheim, o suicídio é:",["Ato individual","Fato social","Problema psicológico","Escolha racional","Questão biológica"],1,"Durkheim trata o suicídio como fato social."],
"Max Weber":["Weber é um dos fundadores da Sociologia. Defende o método compreensivo, buscando entender o sentido da ação social. Conceitos: ação social, tipos ideais, burocracia, desencantamento do mundo, ética protestante e espírito do capitalismo.",["Ação social: com sentido","Tipos ideais","Racionalização e burocracia"],"Não atribua a Weber a ideia de que a economia determina tudo.","Em 'A Ética Protestante e o Espírito do Capitalismo', Weber relaciona moral protestante ao capitalismo.","Para Weber, isso mostra que:",["Economia determina religião","Religião influencia economia","Religião é irrelevante","Capitalismo é natural","Cultura não importa"],1,"Weber argumenta que valores religiosos influenciaram o capitalismo."],
"Karl Marx":["Marx é um dos fundadores da Sociologia. Analisa o capitalismo, a luta de classes, a mais-valia e a alienação. Defende o materialismo histórico. A transformação social viria da revolução do proletariado.",["Luta de classes","Mais-valia e alienação","Materialismo histórico"],"Não confunda Marx com Comte. Marx não é positivista.","Para Marx, a história da humanidade é a história da luta de classes.","Essa afirmação expressa o conceito de:",["Solidariedade orgânica","Luta de classes","Fato social","Ação social","Anomia"],1,"Luta de classes é conceito central de Marx."],
"Auguste Comte":["Comte é considerado o pai da Sociologia. Propôs a física social, que depois chamou de Sociologia. Defendeu o positivismo e a lei dos três estágios.",["Pai da Sociologia","Positivismo","Lei dos três estágios"],"Comte é positivista; Marx é crítico.","Comte propôs que a sociedade deveria ser estudada com métodos das ciências naturais.","Essa proposta é característica do:",["Marxismo","Positivismo","Compreensivismo","Estruturalismo","Funcionalismo"],1,"Positivismo é a corrente de Comte."],
"Herbert Spencer":["Spencer aplicou a teoria da evolução de Darwin à sociedade, criando o darwinismo social. Defendia que a sociedade evolui por seleção natural. Suas ideias justificaram racismo e imperialismo.",["Darwinismo social","Sociedade evolui por seleção","Justificou racismo e imperialismo"],"Darwinismo social é distorção da teoria de Darwin.","Spencer aplicou a ideia de seleção natural às sociedades humanas.","Essa teoria é:",["Positivismo","Darwinismo social","Materialismo histórico","Compreensivismo","Funcionalismo"],1,"Darwinismo social aplica evolução biológica à sociedade."],
"Tocqueville e a democracia":["Tocqueville analisou a democracia americana, destacando a importância da sociedade civil, da participação e do associativismo. Alertou para o risco da tirania da maioria.",["Democracia americana","Sociedade civil e associativismo","Risco: tirania da maioria"],"Tocqueville não é contratualista.","Tocqueville observou que, nos EUA, associações civis eram fundamentais para a democracia.","Para ele, o associativismo:",["Enfraquece a democracia","Fortalece a democracia","É irrelevante","Substitui o Estado","É autoritário"],1,"Tocqueville via o associativismo como essencial."],
/* ----- MÓDULO 9: Brasileira ----- */
"Gilberto Freyre":["Gilberto Freyre, em 'Casa-Grande & Senzala', analisou a formação da sociedade brasileira a partir da colonização portuguesa, destacando a miscigenação e a cultura afro-brasileira. Sua obra foi criticada por idealizar a 'democracia racial'.",["Casa-Grande & Senzala","Miscigenação","Crítica: idealização da democracia racial"],"Não confunda análise de Freyre com realidade.","Gilberto Freyre destacou a importância da miscigenação na formação brasileira.","Essa análise está em:",["Casa-Grande & Senzala","Raízes do Brasil","O Povo Brasileiro","A Integração do Negro","A Ética Protestante"],0,"Casa-Grande & Senzala é a obra de Freyre."],
"Sérgio Buarque de Holanda":["Sérgio Buarque, em 'Raízes do Brasil', analisou a formação da sociedade brasileira a partir do conceito de 'homem cordial', a personalidade marcada pela emotividade e pela confusão entre público e privado.",["Raízes do Brasil","Homem cordial","Confusão entre público e privado"],"Não confunda 'homem cordial' com 'gentil'.","Para Sérgio Buarque, o brasileiro é marcado pela emotividade e dificuldade de separar o público do privado.","Esse conceito é:",["Homem cordial","Democracia racial","Povo brasileiro","Racismo estrutural","Cordialidade estatal"],0,"Homem cordial é conceito de Sérgio Buarque."],
"Darcy Ribeiro":["Darcy Ribeiro, em 'O Povo Brasileiro', analisou a formação do povo brasileiro a partir da mistura de indígenas, africanos e europeus, destacando a violência da colonização e a desigualdade social. Foi educador e político.",["O Povo Brasileiro","Miscigenação e violência","Educação pública"],"Darcy Ribeiro não idealiza a miscigenação; ele destaca a violência e a desigualdade.","Darcy Ribeiro analisou a formação do povo brasileiro destacando a violência da colonização.","Essa análise está em:",["Casa-Grande & Senzala","Raízes do Brasil","O Povo Brasileiro","A Integração do Negro","Formação do Brasil Contemporâneo"],2,"O Povo Brasileiro é a obra de Darcy Ribeiro."],
"Florestan Fernandes":["Florestan Fernandes foi um sociólogo brasileiro que analisou a integração do negro na sociedade de classes, denunciando o racismo e a desigualdade racial. Defendeu a educação pública e a transformação social.",["A Integração do Negro na Sociedade de Classes","Racismo e desigualdade","Educação pública"],"Florestan não idealiza a democracia racial; ele a critica como mito.","Florestan Fernandes analisou a situação do negro no Brasil, denunciando o racismo.","Essa análise está em:",["Casa-Grande & Senzala","A Integração do Negro na Sociedade de Classes","Raízes do Brasil","O Povo Brasileiro","Formação do Brasil Contemporâneo"],1,"A Integração do Negro é a obra de Florestan."],
"Jessé Souza":["Jessé Souza é sociólogo contemporâneo que critica a ideia de 'democracia racial' e analisa a desigualdade brasileira a partir da noção de 'ralé estrutural' — uma classe de invisíveis sociais. Questiona a meritocracia.",["Crítica à democracia racial","Ralé estrutural","Crítica à meritocracia"],"Jessé Souza não fala de 'ralé' como ofensa; é conceito sociológico.","Jessé Souza critica a ideia de que o Brasil é uma democracia racial.","Esse conceito é chamado de:",["Ralé estrutural","Democracia racial","Homem cordial","Povo brasileiro","Cordialidade"],0,"Ralé estrutural é conceito de Jessé Souza."],
"Racismo e formação social brasileira":["O racismo é um elemento estruturante da formação social brasileira, presente desde a colonização e a escravidão. Manifesta-se em desigualdades de renda, educação, saúde, segurança e representação política.",["Estruturante da sociedade","Desigualdades raciais","Mito da democracia racial"],"Não confunda racismo individual com estrutural.","Dados mostram que a população negra tem menor renda, escolaridade e maior encarceramento.","Isso é resultado de:",["Meritocracia","Racismo estrutural","Democracia racial","Igualdade de oportunidades","Mobilidade social"],1,"Racismo estrutural reproduz desigualdades raciais."],
"Pensamento social brasileiro":["O pensamento social brasileiro se desenvolveu a partir de obras que buscaram interpretar a formação do Brasil, como as de Freyre, Sérgio Buarque, Caio Prado Jr., Darcy Ribeiro e Florestan Fernandes. Analisam colonização, escravidão, miscigenação e desigualdade.",["Interpretações do Brasil","Colonização e escravidão","Diversas correntes"],"Há múltiplas visões sobre a formação do país.","Obras como 'Casa-Grande & Senzala', 'Raízes do Brasil' e 'O Povo Brasileiro' são exemplos de:",["Literatura","Pensamento social brasileiro","Sociologia europeia","Filosofia política","Antropologia cultural"],1,"São exemplos de pensamento social brasileiro."],
/* ----- MÓDULO 10: Instituições ----- */
"Família":["A família é a instituição primária de socialização, responsável pela transmissão de valores, normas e afetos. Existem diferentes formas: nuclear, monoparental, homoafetiva, extensa. A família contemporânea é plural.",["Socialização primária","Diversidade de formas","Instituição dinâmica"],"Não existe um único modelo de família.","Uma família formada por duas mães e um filho adotivo é exemplo de:",["Família nuclear","Família monoparental","Família homoafetiva","Família extensa","Família patriarcal"],2,"Família homoafetiva é formada por casal do mesmo sexo."],
"Escola e educação":["A escola é instituição de socialização secundária, responsável pela transmissão de conhecimento formal e valores sociais. Pode reproduzir desigualdades ou promover mobilidade social. A educação é um direito social.",["Socialização secundária","Conhecimento formal","Mobilidade ou reprodução"],"Não confunda educação com escolarização.","A escola transmite conhecimento formal e prepara o indivíduo para a vida social.","Essa é função da instituição:",["Família","Escola","Religião","Mídia","Estado"],1,"Escola é a instituição de socialização secundária."],
"Religião":["A religião é uma instituição social que oferece sentido, coesão e normas morais. Durkheim via a religião como expressão da sociedade; Weber analisou sua influência econômica; Marx a criticou como 'ópio do povo'.",["Sentido e coesão","Durkheim: expressão social","Weber: influência econômica","Marx: ópio do povo"],"Não confunda religião com igreja.","Para Marx, a religião é 'o ópio do povo'.","Essa crítica está associada a:",["Durkheim","Weber","Marx","Comte","Spencer"],2,"Marx critica a religião como alienação."],
"Mídia":["A mídia é uma instituição que produz e difunde informações, influenciando opiniões e comportamentos. Pode ser instrumento de democratização ou manipulação. A concentração midiática e as fake news são desafios.",["Produção e difusão de informação","Influência na opinião pública","Concentração e fake news"],"Mídia inclui TV, rádio, internet, redes sociais.","A mídia influencia a opinião pública ao selecionar e enquadrar as notícias.","Esse poder é chamado de:",["Socialização","Agenda-setting","Controle social","Anomia","Alienação"],1,"Agenda-setting: capacidade de definir temas relevantes."],
"Estado como instituição":["O Estado é a instituição que detém o monopólio legítimo da força em um território (Weber). Garante ordem, direitos e serviços públicos. Pode ser liberal, de bem-estar, neoliberal ou totalitário.",["Monopólio legítimo da força (Weber)","Garante ordem e direitos","Tipos de Estado"],"Não confunda Estado com governo.","Segundo Weber, o Estado detém o monopólio legítimo da força.","Essa definição é de:",["Durkheim","Weber","Marx","Comte","Freyre"],1,"Definição de Estado como monopólio da força é de Weber."],
"Socialização primária e secundária":["Socialização primária ocorre na infância, na família, e forma a identidade básica. Secundária ocorre na escola, no trabalho e em outras instituições, introduzindo o indivíduo em novos papéis sociais.",["Primária: família, infância","Secundária: escola, trabalho","Processo contínuo"],"Não confunda socialização com educação.","A família é responsável pela socialização primária; a escola, pela secundária.","Essa distinção é de:",["Durkheim","Weber","Marx","Berger e Luckmann","Freyre"],3,"Berger e Luckmann distinguiram socialização primária e secundária."],
"Transformações das instituições":["As instituições sociais estão em constante transformação. Modernidade, globalização e tecnologias digitais alteraram profundamente família, escola, religião, mídia e Estado. Novas formas de família, educação e participação política surgem.",["Instituições em transformação","Modernidade e globalização","Tecnologias digitais"],"Não trate as instituições como imutáveis.","O ensino a distância e as famílias monoparentais são exemplos de:",["Instituições tradicionais","Transformações das instituições","Crise das instituições","Desaparecimento das instituições","Involução social"],1,"Transformações das instituições sociais ocorrem com mudanças econômicas, culturais e tecnológicas."],
/* ----- MÓDULO 11: Globalização ----- */
"Globalização":["Globalização é o processo de integração econômica, política, cultural e social entre países, acelerado a partir dos anos 1980. Envolve fluxos de capitais, mercadorias, informações e pessoas. Gera oportunidades e desigualdades.",["Integração mundial","Fluxos econômicos, culturais, informacionais","Oportunidades e desigualdades"],"Não confunda globalização com ocidentalização.","Empresas multinacionais operam em vários países, e pessoas consomem produtos de todo o mundo.","Isso é exemplo de:",["Isolamento","Globalização","Nacionalismo","Protecionismo","Autarquia"],1,"Globalização é integração mundial."],
"Neoliberalismo":["Neoliberalismo é corrente econômica e política que defende redução do Estado, privatizações, abertura comercial e flexibilização do trabalho. Ganhou força nos anos 1980 e 1990. No Brasil, foi implementado nos governos Collor e FHC.",["Redução do Estado","Privatizações, abertura comercial","Flexibilização do trabalho"],"Não confunda neoliberalismo com liberalismo clássico.","Um governo privatiza estatais, reduz gastos sociais e abre a economia.","Essas medidas são típicas do:",["Estado de Bem-Estar Social","Neoliberalismo","Socialismo","Comunismo","Anarquismo"],1,"Neoliberalismo defende redução do Estado e privatizações."],
"Sociedade de consumo":["Sociedade de consumo é aquela em que o consumo de bens e serviços é central na vida social e na identidade das pessoas. A publicidade e a indústria cultural estimulam o consumo. O consumo pode ser alienante ou consciente.",["Consumo como centralidade","Publicidade e indústria cultural","Consumo alienante ou consciente"],"Não confunda consumo com consumismo.","Uma pessoa compra produtos não por necessidade, mas para se sentir incluída socialmente.","Esse comportamento é típico da:",["Sociedade de produção","Sociedade de consumo","Sociedade agrária","Sociedade feudal","Sociedade comunista"],1,"Sociedade de consumo é marcada pelo consumo como forma de identidade."],
"Publicidade e consumo":["A publicidade é instrumento da sociedade de consumo, que estimula desejos e associa produtos a estilos de vida. Pode criar necessidades artificiais e reforçar estereótipos.",["Estímulo ao consumo","Criação de desejos","Reforço de estereótipos"],"Não confunda publicidade com informação.","Campanhas publicitárias associam carros a sucesso e liberdade.","Essa associação é estratégia de:",["Educação","Publicidade","Jornalismo","Ciência","Arte"],1,"Publicidade associa produtos a valores e estilos de vida."],
"Consumo consciente":["Consumo consciente é a prática de consumir de forma responsável, considerando impactos ambientais e sociais. Envolve reduzir, reutilizar e reciclar. É resposta crítica à sociedade de consumo.",["Consumo responsável","Reduzir, reutilizar, reciclar","Crítica ao consumismo"],"Não confunda consumo consciente com não consumir.","Uma pessoa escolhe produtos recicláveis e evita desperdício.","Esse comportamento é:",["Consumismo","Consumo consciente","Publicidade","Indústria cultural","Alienação"],1,"Consumo consciente é consumir com responsabilidade."],
"Globalização e desigualdade":["A globalização aprofunda desigualdades entre países e dentro deles. Países ricos concentram tecnologia e capital; países pobres fornecem matéria-prima e mão de obra barata. Também gera resistências.",["Desigualdades globais","Concentração de capital","Movimentos antiglobalização"],"Não confunda globalização com desenvolvimento para todos.","Empresas multinacionais instalam fábricas em países pobres para reduzir custos, mantendo lucros nos países ricos.","Isso exemplifica:",["Globalização igualitária","Globalização e desigualdade","Desenvolvimento sustentável","Economia solidária","Autarquia"],1,"A globalização reproduz desigualdades globais."],
"Capitalismo informacional":["Capitalismo informacional é a fase em que informação e conhecimento são as principais fontes de riqueza e poder (Castells). Redes digitais, tecnologia e inovação são centrais. Gera novas desigualdades, como a exclusão digital.",["Informação como riqueza","Castells: sociedade em rede","Exclusão digital"],"Não confunda capitalismo informacional com industrial.","Empresas de tecnologia dominam o mercado global, e o acesso à internet se torna essencial.","Isso caracteriza o:",["Capitalismo industrial","Capitalismo informacional","Capitalismo comercial","Feudalismo","Socialismo"],1,"Capitalismo informacional é baseado em informação e tecnologia."],
/* ----- MÓDULO 12: Meio Ambiente ----- */
"Urbanização":["Urbanização é o processo de crescimento das cidades e aumento da população urbana. No Brasil, acelerou-se a partir dos anos 1950, com o êxodo rural. Gerou metrópoles, periferias e problemas de infraestrutura.",["Crescimento das cidades","Êxodo rural","Metrópoles e periferias"],"Não confunda urbanização com urbanismo.","O Brasil se tornou majoritariamente urbano a partir dos anos 1970.","Esse processo é:",["Industrialização","Urbanização","Êxodo urbano","Metropolização","Ruralização"],1,"Urbanização é o crescimento da população urbana."],
"Êxodo rural":["Êxodo rural é a migração da população do campo para a cidade, motivada por fatores de expulsão (mecanização, concentração de terras) e atração (empregos, serviços). No Brasil, foi intenso entre 1950 e 1980.",["Campo → cidade","Fatores de expulsão e atração","Intenso no Brasil (1950-1980)"],"Não confunda êxodo rural com migração pendular.","Milhares de famílias deixaram o campo em busca de trabalho nas cidades industrializadas.","Esse movimento é:",["Migração pendular","Êxodo rural","Migração sazonal","Imigração","Emigração"],1,"Êxodo rural é migração do campo para a cidade."],
"Favelização e periferização":["Favelização é o crescimento de favelas e assentamentos informais, resultado da urbanização acelerada sem planejamento e da desigualdade. Periferização é o crescimento das periferias urbanas, distantes dos centros.",["Favelas: ocupação informal","Periferias: distantes e carentes","Resultado da desigualdade"],"Não confunda favela com bairro pobre.","O crescimento desordenado das cidades gerou favelas e periferias sem saneamento e transporte.","Esse processo é:",["Urbanização planejada","Favelização e periferização","Metropolização","Gentrificação","Êxodo rural"],1,"Favelização e periferização são resultados da urbanização desigual."],
"Questão agrária":["A questão agrária envolve distribuição de terras, reforma agrária e conflitos no campo. No Brasil, a concentração de terras é histórica e gera desigualdade e violência. MST e outros movimentos lutam pela reforma agrária.",["Concentração de terras","Reforma agrária","Conflitos no campo"],"Não confunda reforma agrária com desapropriação.","A concentração de terras no Brasil é uma das mais altas do mundo.","Esse problema é conhecido como:",["Questão urbana","Questão agrária","Questão ambiental","Questão indígena","Questão fundiária urbana"],1,"Questão agrária é distribuição de terras e conflitos no campo."],
"Conflitos socioambientais":["Conflitos socioambientais são disputas entre diferentes grupos pelo uso e acesso aos recursos naturais. Envolvem comunidades tradicionais, indígenas, quilombolas, agricultores e empresas.",["Disputas por recursos naturais","Comunidades x empresas","Ex.: mineração, água, desmatamento"],"Não confunda conflito socioambiental com ambiental.","Comunidades ribeirinhas disputam com mineradoras o acesso à água e à terra.","Isso é exemplo de:",["Conflito urbano","Conflito socioambiental","Conflito agrário","Conflito religioso","Conflito étnico"],1,"Conflito socioambiental envolve disputas por recursos naturais."],
"Racismo ambiental":["Racismo ambiental é a distribuição desigual de impactos ambientais negativos sobre populações racializadas. Comunidades negras, indígenas e pobres são mais afetadas por poluição, desmatamento e falta de saneamento.",["Impactos ambientais desiguais","Populações racializadas mais afetadas","Justiça ambiental"],"Não confunda racismo ambiental com racismo individual.","Comunidades negras e indígenas são mais afetadas por poluição industrial e falta de saneamento.","Isso é exemplo de:",["Racismo estrutural","Racismo ambiental","Desigualdade regional","Meritocracia","Exclusão digital"],1,"Racismo ambiental é distribuição desigual de danos ambientais sobre populações racializadas."],
"Cidades e desigualdade urbana":["As cidades brasileiras são marcadas por desigualdade socioespacial: centros ricos e periferias pobres, com diferenças de infraestrutura, serviços e segurança. A segregação urbana é resultado de processos históricos e econômicos.",["Desigualdade socioespacial","Centro x periferia","Segregação e mobilidade"],"Não confunda desigualdade urbana com pobreza urbana.","Em uma mesma cidade, bairros ricos têm saneamento, segurança e transporte, enquanto periferias carecem desses serviços.","Isso caracteriza:",["Igualdade urbana","Desigualdade urbana","Planejamento urbano","Mobilidade social","Gentrificação"],1,"Desigualdade urbana é distribuição desigual de serviços."],
"Sustentabilidade e sociedade":["Sustentabilidade é a capacidade de satisfazer as necessidades do presente sem comprometer as gerações futuras. Envolve dimensões ambiental, social e econômica. A sociedade de consumo é questionada por sua insustentabilidade.",["Presente x futuro","Ambiental, social, econômica","Crítica ao modelo atual"],"Não reduza sustentabilidade ao ambiental.","O uso responsável dos recursos naturais é princípio de:",["Consumismo","Sustentabilidade","Capitalismo","Industrialização","Urbanização"],1,"Sustentabilidade é uso responsável dos recursos."],
/* ----- MÓDULO 13: Gênero, Raça, Etnia ----- */
"Patriarcado":["Patriarcado é um sistema social em que o poder é concentrado nas mãos dos homens, estruturando relações de gênero desiguais. Manifesta-se na família, no trabalho, na política e na cultura. O feminismo busca desconstruir o patriarcado.",["Poder masculino","Estrutura social","Manifesta-se em todas as esferas"],"Não confunda patriarcado com machismo individual.","Em uma sociedade patriarcal, os homens ocupam a maioria dos cargos de poder.","Esse sistema é:",["Matriarcado","Patriarcado","Feminismo","Machismo","Misoginia"],1,"Patriarcado é o sistema de poder masculino."],
"Feminismo e ondas do feminismo":["Feminismo é movimento social e corrente teórica que luta pela igualdade de gênero. Teve ondas: 1ª (sufrágio), 2ª (igualdade legal e sexual), 3ª (diversidade e interseccionalidade), 4ª (ciberfeminismo).",["Movimento e teoria","Ondas: sufrágio, igualdade, diversidade","Conquistas: voto, Maria da Penha"],"Não confunda feminismo com 'inversão de gênero'.","O feminismo conquistou o direito ao voto, igualdade no trabalho e leis de proteção.","Essas conquistas são resultado das:",["Ondas do feminismo","Lutas sindicais","Revoluções socialistas","Lutas raciais","Revoluções industriais"],0,"As ondas do feminismo marcam as fases e conquistas do movimento."],
"Racismo estrutural":["Racismo estrutural é o conjunto de práticas e normas que reproduzem a desigualdade racial de forma sistemática, mesmo sem intenção explícita. Manifesta-se em renda, educação, saúde, segurança e representação política.",["Desigualdade racial sistemática","Não precisa de intenção","Presente nas instituições"],"Não confunda racismo estrutural com individual.","Dados mostram que a população negra tem menor renda e maior encarceramento.","Isso é resultado de:",["Meritocracia","Racismo estrutural","Democracia racial","Igualdade de oportunidades","Mobilidade social"],1,"Racismo estrutural reproduz desigualdades raciais."],
"Quilombolas":["Quilombolas são comunidades remanescentes de quilombos, formadas por descendentes de africanos escravizados que resistiram à escravidão. Têm direito à terra e à cultura garantidos pela Constituição de 1988.",["Remanescentes de quilombos","Direito à terra e cultura","Constituição de 1988"],"Não confunda quilombola com escravo.","Comunidades quilombolas lutam pela titulação de suas terras.","Esse direito está garantido na:",["Constituição de 1946","Constituição de 1967","Constituição de 1988","Lei Áurea","CLT"],2,"Constituição de 1988 garante direitos territoriais e culturais aos quilombolas."],
"Questões indígenas":["Os povos indígenas lutam pela demarcação de terras, pelo respeito à sua cultura e pela autodeterminação. A Constituição de 1988 reconhece seus direitos originários sobre as terras que tradicionalmente ocupam.",["Demarcação de terras","Autodeterminação","Constituição de 1988"],"Não confunda indígena com 'atrasado'.","Os povos indígenas têm direito às terras que tradicionalmente ocupam, conforme a Constituição de 1988.","Esse direito é chamado de:",["Direito adquirido","Direito originário","Direito positivo","Direito natural","Direito civil"],1,"Direito originário é anterior ao Estado."],
"Movimento LGBTQIA+":["O movimento LGBTQIA+ luta contra a discriminação por orientação sexual e identidade de gênero. Conquistas: união estável homoafetiva (2011), criminalização da homofobia (2019).",["Luta contra homofobia e transfobia","Conquistas: união estável, criminalização","Visibilidade e direitos"],"Não confunda orientação sexual com identidade de gênero.","Em 2011, o STF reconheceu a união estável entre pessoas do mesmo sexo.","Essa conquista é do movimento:",["Negro","LGBTQIA+","Feminista","Indígena","Operário"],1,"LGBTQIA+ luta por direitos de pessoas LGBT."],
"Identidade de gênero e sexualidade":["Identidade de gênero é como a pessoa se identifica (homem, mulher, não-binário). Orientação sexual é por quem a pessoa se atrai (heterossexual, homossexual, bissexual). Sexo biológico é classificação anatômica. Essas dimensões são distintas.",["Identidade: como se identifica","Orientação: por quem se atrai","Sexo: biológico"],"Não confunda sexo biológico com identidade de gênero.","Uma pessoa pode ter sexo biológico masculino, identidade de gênero feminina e orientação heterossexual.","Isso mostra que:",["São a mesma coisa","São dimensões distintas","Não há diversidade","Gênero é biológico","Orientação é escolha"],1,"Sexo, identidade de gênero e orientação são dimensões distintas."],
"Interseccionalidade":["Interseccionalidade é o conceito que analisa como diferentes marcadores sociais (raça, gênero, classe, sexualidade) se entrecruzam e produzem experiências específicas de opressão ou privilégio. Cunhado por Kimberlé Crenshaw.",["Marcadores se entrecruzam","Opressões múltiplas","Kimberlé Crenshaw"],"Não trate os marcadores como separados.","Uma mulher negra e pobre enfrenta discriminações que se somam.","Esse conceito é:",["Multiculturalismo","Interseccionalidade","Relativismo","Etnocentrismo","Assimilação"],1,"Interseccionalidade analisa como marcadores se entrecruzam."],
/* ----- MÓDULO 14: Violência ----- */
"Violência urbana":["A violência urbana é fenômeno social complexo, ligado à desigualdade, à segregação e à falência das instituições. No Brasil, atinge principalmente jovens negros e pobres nas periferias.",["Desigualdade e segregação","Jovens negros mais afetados","Violência estrutural"],"Não reduza violência a crime.","A violência urbana no Brasil atinge desproporcionalmente jovens negros e moradores de periferias.","Isso revela:",["Violência individual","Violência estrutural e racial","Violência natural","Violência estrangeira","Violência midiática"],1,"Violência estrutural e racial reproduz desigualdades."],
"Encarceramento em massa":["O encarceramento em massa é o crescimento exponencial da população prisional, especialmente de grupos racializados e pobres. No Brasil, a população carcerária é majoritariamente negra. Ligado à seletividade penal e à guerra às drogas.",["Crescimento da população prisional","Seletividade penal","Maioria negra"],"Encarceramento em massa é política que falhou em reduzir violência.","Dados mostram que a maioria da população carcerária brasileira é negra e jovem.","Isso é resultado de:",["Justiça igualitária","Seletividade penal e racismo","Meritocracia","Democracia racial","Igualdade social"],1,"Seletividade penal e racismo estrutural explicam o encarceramento em massa."],
"Segurança pública":["Segurança pública é conjunto de políticas e instituições que buscam garantir ordem e proteção. No Brasil, é marcada pela violência policial e militarização. Modelos alternativos incluem segurança cidadã e justiça restaurativa.",["Políticas de ordem e proteção","Violência policial e militarização","Segurança cidadã"],"Não confunda segurança pública com nacional.","Debates sobre segurança pública envolvem redução da violência policial e promoção de direitos.","Isso mostra a tensão entre:",["Ordem e direitos","Riqueza e pobreza","Cidade e campo","Indivíduo e sociedade","Cultura e natureza"],0,"Segurança pública envolve tensão entre ordem e direitos humanos."],
"Desvio e anomia":["Desvio é o comportamento que viola normas sociais. Anomia (Durkheim) é a ausência de normas claras, gerando desorientação social. O desvio não é necessariamente negativo.",["Desvio: violação de normas","Anomia: ausência de normas","Definição social do desvio"],"Nem todo desvio é crime; nem todo crime é desvio.","Em uma sociedade em rápida transformação, normas se tornam confusas e as pessoas perdem referências.","Esse estado é:",["Anomia","Alienação","Mais-valia","Solidariedade","Controle social"],0,"Anomia é ausência de normas (Durkheim)."],
"Instituições totais":["Instituições totais são locais onde indivíduos são isolados da sociedade e submetidos a regime de controle total, como prisões, manicômios e conventos. Conceito de Erving Goffman.",["Isolamento e controle total","Goffman","Prisões, manicômios, conventos"],"Não confunda instituição total com social.","Uma prisão isola o indivíduo da sociedade e controla todos os aspectos de sua vida.","Isso caracteriza uma:",["Instituição social","Instituição total","Instituição religiosa","Instituição familiar","Instituição escolar"],1,"Instituição total isola e controla (Goffman)."],
"Violência simbólica":["Violência simbólica é a imposição de significados e valores que legitimam a dominação, fazendo com que os dominados a aceitem como natural. Conceito de Bourdieu.",["Imposição de significados","Legitima dominação","Bourdieu"],"Não confunda violência simbólica com física.","Piadas preconceituosas que naturalizam a inferioridade de grupos sociais são exemplos de:",["Violência física","Violência simbólica","Violência estrutural","Violência estatal","Violência doméstica"],1,"Violência simbólica é imposição de significados que legitimam dominação."],
"Violência de Estado":["Violência de Estado é o uso da força por agentes estatais de forma abusiva ou ilegal, violando direitos. No Brasil, manifesta-se em violência policial, tortura e execuções.",["Uso abusivo da força","Agentes estatais","Violação de direitos"],"Violência de Estado é ilegal ou abusiva.","Ações policiais que resultam em mortes de civis desarmados são exemplos de:",["Violência de Estado","Violência simbólica","Violência doméstica","Violência escolar","Violência midiática"],0,"Violência de Estado é uso abusivo da força por agentes estatais."],
"Controle social formal e informal":["Controle social é o conjunto de mecanismos que regulam o comportamento. Formal: leis, polícia, justiça. Informal: família, escola, religião, opinião pública.",["Formal: leis e instituições","Informal: família, escola, religião","Regulação do comportamento"],"Ambos se complementam.","A família que ensina valores e a escola que aplica regras são exemplos de:",["Controle social formal","Controle social informal","Controle social estatal","Controle social jurídico","Controle social policial"],1,"Controle social informal é exercido por instituições sociais."],
/* ----- MÓDULO 15: Tecnologia ----- */
"Cibercultura":["Cibercultura é o conjunto de práticas, valores e formas de sociabilidade que emergem com as tecnologias digitais e a internet. Transforma comunicação, trabalho, consumo e identidade.",["Práticas e valores digitais","Transforma sociabilidade","Identidade e cultura digital"],"Não confunda cibercultura com cultura digital.","A internet criou novas formas de se relacionar, trabalhar, consumir e se expressar.","Esse conjunto é:",["Cultura de massa","Cibercultura","Cultura erudita","Cultura popular","Indústria cultural"],1,"Cibercultura é a cultura digital."],
"Redes sociais e sociabilidade":["Redes sociais digitais transformaram a sociabilidade, permitindo conexões globais e instantâneas. Ampliam participação, mas também geram isolamento, comparação e vigilância.",["Conexões globais","Ampliação e isolamento","Identidade digital"],"Não confunda redes sociais com comunidade.","As redes sociais permitem conexões em tempo real, mas também geram bolhas e isolamento.","Isso mostra que a tecnologia:",["Só tem efeitos positivos","Tem efeitos ambivalentes","Só tem efeitos negativos","É neutra","Não afeta a sociedade"],1,"A tecnologia tem efeitos ambivalentes."],
"Fake news e desinformação":["Fake news são notícias falsas disseminadas como se fossem verdadeiras, com objetivo de manipular. A desinformação se espalha rapidamente pelas redes, afetando a democracia e a saúde pública.",["Notícias falsas","Manipulação e viralização","Checagem e educação midiática"],"Fake news é intencional; erro jornalístico é acidental.","Notícias falsas sobre vacinas se espalham e podem levar à recusa da vacinação.","Isso é exemplo de:",["Informação científica","Desinformação e fake news","Jornalismo investigativo","Publicidade","Propaganda política"],1,"Fake news são notícias falsas disseminadas intencionalmente."],
"Algoritmos e bolha digital":["Algoritmos são conjuntos de regras que processam dados e tomam decisões. Nas redes sociais, criam bolhas digitais ao mostrar conteúdos que confirmam as crenças do usuário, reduzindo diversidade e polarizando o debate.",["Regras de processamento","Bolhas de filtro","Polarização e radicalização"],"Não confunda algoritmo com inteligência artificial.","Algoritmos de redes sociais mostram apenas conteúdos alinhados às opiniões do usuário.","Isso pode levar à:",["Diversidade de opiniões","Polarização e radicalização","Informação imparcial","Democracia digital","Transparência total"],1,"Bolhas digitais levam à polarização."],
"Privacidade e vigilância":["A privacidade é o direito de controlar informações pessoais. A vigilância digital é a coleta e monitoramento de dados por empresas e governos. A LGPD regula o uso de dados no Brasil.",["Direito à privacidade","Coleta e monitoramento","LGPD"],"Não confunda privacidade com segredo.","Empresas coletam dados de usuários e governos monitoram comunicações.","Isso levanta questões sobre:",["Privacidade e vigilância","Liberdade de expressão","Cidadania","Democracia","Igualdade"],0,"Privacidade e vigilância são temas centrais."],
"Tecnologia e desigualdade digital":["A desigualdade digital é a diferença de acesso e uso de tecnologias entre grupos sociais. Reproduz desigualdades de classe, raça e região. A inclusão digital é política pública para reduzir essa exclusão.",["Diferença de acesso","Reproduz desigualdades","Inclusão digital"],"Ter internet não garante saber usar para transformação social.","Enquanto algumas escolas têm computadores, outras não têm sequer energia elétrica.","Isso caracteriza:",["Igualdade digital","Desigualdade digital","Inclusão digital","Alfabetização digital","Cidadania digital"],1,"Desigualdade digital é diferença de acesso."],
"Identidade digital":["A identidade digital é a construção da autoimagem nas plataformas online, envolvendo escolhas de perfil, posts e interações. Pode ser performada, curada e diferente da identidade offline.",["Autoimagem online","Performance e curadoria","Impacto na autoestima"],"Online, as pessoas escolhem o que mostrar.","Nas redes sociais, as pessoas constroem uma imagem idealizada de si mesmas.","Isso caracteriza:",["Identidade real","Identidade digital","Identidade nacional","Identidade de gênero","Identidade étnica"],1,"Identidade digital é construção da autoimagem online."],
"Manipulação e controle de dados":["A manipulação de dados é o uso de informações pessoais para influenciar comportamentos, como no caso Cambridge Analytica. O controle de dados envolve algoritmos, publicidade direcionada e vigilância.",["Uso de dados para influenciar","Cambridge Analytica","Desafio democrático"],"Manipulação é enganosa; persuasão é argumentativa.","O escândalo Cambridge Analytica revelou que dados de usuários foram usados para influenciar eleições.","Isso é exemplo de:",["Transparência","Manipulação e controle de dados","Privacidade","Liberdade de expressão","Inclusão digital"],1,"Manipulação e controle de dados são uso indevido de informações."],
/* ----- MÓDULO 16: Urbana e Rural ----- */
"Sociologia urbana":["A Sociologia urbana estuda as cidades como fenômeno social, analisando segregação, mobilidade, violência, cultura urbana e movimentos sociais. A cidade é espaço de contradições.",["Cidade como fenômeno social","Segregação e contradições","Escola de Chicago"],"Não confunda Sociologia urbana com urbanismo.","O crescimento desordenado das cidades gerou periferias sem infraestrutura.","Isso é objeto da:",["Sociologia rural","Sociologia urbana","Sociologia do trabalho","Sociologia da educação","Sociologia da religião"],1,"Sociologia urbana estuda a cidade."],
"Metropolização e periferização":["Metropolização é a formação de grandes aglomerados urbanos, com cidades conurbadas. Periferização é o crescimento das periferias, distantes dos centros e com menos infraestrutura.",["Grandes aglomerados urbanos","Periferias carentes","Conurbação"],"Não confunda metrópole com megalópole.","São Paulo e cidades vizinhas formam uma grande mancha urbana contínua.","Isso é exemplo de:",["Urbanização","Metropolização","Êxodo rural","Ruralização","Desmetropolização"],1,"Metropolização é formação de grandes aglomerados urbanos."],
"Segregação socioespacial":["Segregação socioespacial é a separação de grupos sociais no espaço urbano, com ricos em áreas centrais e pobres nas periferias. Resulta de processos históricos, econômicos e políticos.",["Separação de grupos no espaço","Centro x periferia","Desigualdade de acesso"],"Segregação é dimensão espacial da desigualdade.","Em uma cidade, bairros ricos têm segurança, escolas e hospitais, enquanto periferias carecem desses serviços.","Isso caracteriza:",["Integração socioespacial","Segregação socioespacial","Mobilidade urbana","Planejamento urbano","Gentrificação"],1,"Segregação socioespacial é separação de grupos no espaço."],
"Movimentos sociais urbanos":["Movimentos sociais urbanos lutam por moradia, transporte, saneamento e participação nas decisões da cidade. Exemplos: movimento dos sem-teto, Movimento Passe Livre.",["Lutas por moradia e transporte","Participação nas decisões","Respostas à desigualdade"],"Não confunda movimento urbano com agrário.","O Movimento Passe Livre luta por transporte público gratuito.","Esse é exemplo de:",["Movimento agrário","Movimento urbano","Movimento sindical","Movimento ambientalista","Movimento indígena"],1,"Movimento urbano luta por questões da cidade."],
